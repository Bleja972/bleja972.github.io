<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e6eff0;color:#173d4b;font:15px/1.45 Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#09394b;color:white;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.toolbar a{color:white}button{font:inherit;cursor:pointer}.print{background:linear-gradient(#fff8aa,#ffcd42 52%,#fa961e);border:2px solid #f7df8c;border-bottom:3px solid #895012;border-radius:13px;padding:12px 20px;color:#503006;font-weight:900;box-shadow:0 5px 0 #8d4c11,0 8px 18px #0005}.print:active{transform:translateY(4px);box-shadow:0 1px 0 #8d4c11}.sheet{background:#fff;width:210mm;min-height:297mm;margin:20px auto;padding:13mm 12mm 11mm;position:relative;box-shadow:0 5px 23px #10304328;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.sheet h1{font-size:22px;letter-spacing:.4px;margin:0;color:#193b4a}.sub{font-size:11px;margin:2px 0 20px;color:#305565}.student{font-size:12px;display:flex;justify-content:space-between;margin:15px 0 23px}.footer{position:absolute;bottom:10mm;right:13mm;font-size:10px;color:#5c7078}.unit{border:1px solid #d2e3e6;border-radius:14px;padding:10px 15px;margin:12px 0}.unit h2{font-size:15px;color:#0b8395;margin:0 0 2px}.hint{font-size:11px;color:#375d6b;margin:0 0 7px}.exercise-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:15mm;row-gap:6px}.exercise{display:flex;gap:5px;align-items:center;font-weight:bold;font-size:15px;min-height:27px}.blank{display:inline-block;border:1.4px solid #b0cdd1;border-radius:5px;width:69px;height:23px;margin-left:auto}.instructions{font-size:12px;margin-bottom:18px}.chain{border:1px solid #cfdde2;border-radius:15px;padding:11px 8px 9px;margin:9px 0 12px;min-height:150px}.chain h2{font-size:13px;color:#088295;margin:0 0 3px 5px}.fishrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:3px;align-items:end}.fishstep{text-align:center;min-width:0}.op{font-size:13px;color:#087d91;font-weight:900;min-height:21px;white-space:nowrap}.fish{height:72px;width:100%;background-image:url('/jeux/poissons-des-nombres-corail/poissons-realistes.webp');background-size:300% 200%;background-position:var(--x) var(--y);background-repeat:no-repeat}.fishstep:nth-child(1) .fish{--x:0%;--y:0%}.fishstep:nth-child(2) .fish{--x:50%;--y:0%}.fishstep:nth-child(3) .fish{--x:100%;--y:0%}.fishstep:nth-child(4) .fish{--x:0%;--y:100%}.fishstep:nth-child(5) .fish{--x:50%;--y:100%}.fishstep:nth-child(6) .fish{--x:100%;--y:100%}.fishstep .number{font-size:14px;font-weight:bold;min-height:27px}.fishstep .answer{display:inline-block;border:1.5px solid #b4cfd2;border-radius:5px;width:65px;height:26px}.note{background:#e6f6f8;border-radius:8px;color:#45636b;padding:10px 13px;font-size:11px;margin-top:14px}.corrections{display:grid;grid-template-columns:1fr 1fr;gap:10px 17px}.corrbox{border:1px solid #d4e3e5;border-radius:12px;padding:10px}.corrbox h2{font-size:15px;color:#097e93;margin:0 0 7px}.corrbox p{margin:3px 0;font-size:12px;font-variant-numeric:tabular-nums}.corrchain{border-bottom:1px solid #d4e2e5;padding:8px 4px;font-size:12px;line-height:1.6}.corrchain strong{display:block;color:#067f91;font-size:12px}

<body><div class="toolbar"><a href="/jeux/poissons-des-nombres-cp/">← Retour au jeu CP</a><strong>9 pages · exercices et corrigés CP</strong><button class="print" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button></div><div id="sheets"></div>
<script>
'use strict';
const groups=[["+1",[24,35,48,59,67,71,82,96]],["-1",[23,30,47,58,64,73,81,90]],["+10",[13,25,36,42,51,68,79,87]],["-10",[12,21,34,45,56,67,78,95]],["+1",[29,38,49,56,63,74,85,97]],["-1",[20,31,42,53,64,75,86,99]],["+10",[14,22,35,43,57,61,72,89]],["-10",[15,24,33,46,57,68,79,91]]];
const chains=[[21,[10,-1,-10,1,10]],[28,[-10,1,10,-1,-10]],[35,[1,10,-1,-10,1]],[42,[-1,-10,10,1,-1]],[49,[10,10,-1,-10,1]],[56,[-10,1,1,10,-1]],[63,[1,10,-10,-1,10]],[70,[-1,10,1,-10,-1]],[21,[10,-1,10,-10,1]],[28,[-10,10,1,-1,10]],[35,[1,1,10,-1,-10]],[42,[-1,-10,1,10,-1]],[49,[10,-10,1,10,-1]],[56,[-10,1,10,-1,1]],[63,[1,-1,10,-10,1]],[70,[-1,10,1,-10,10]],[21,[10,-1,-10,1,1]],[28,[-10,10,1,10,-1]],[35,[1,10,-10,1,-1]],[42,[-1,-10,1,10,10]]];
const fmt=n=>n.toLocaleString('fr-FR').replace(/\u202f/g,' ');
const op=n=>(n>0?'+':'')+fmt(n);
function sheet(title,subtitle,n){let el=document.createElement('section');el.className='sheet';el.innerHTML='<h1>'+title+'</h1><p class="sub">'+subtitle+'</p><div class="student">Prénom : __________________________________ <span>Date : __________________</span></div><span class="footer">Page '+n+' / 9</span>';document.getElementById('sheets').append(el);return el;}
for(let p=0;p<2;p++){
 let page=sheet('LES POISSONS DES NOMBRES','Calcul mental CP - Une opération à la fois',p+1);
 for(let i=p*4;i<p*4+4;i++){let [sign,nums]=groups[i],block=document.createElement('section');block.className='unit';block.innerHTML='<h2>Je calcule : '+(sign[0]==='+'?'+':'−')+fmt(Math.abs(+sign))+'</h2><p class="hint">Écris le résultat dans chaque case.</p><div class="exercise-grid">'+nums.map(n=>'<div class="exercise"><span>'+fmt(n)+' '+(sign[0]==='+'?'+':'−')+fmt(Math.abs(+sign))+' = </span><span class="blank"></span></div>').join('')+'</div>';page.append(block);}
}
for(let p=0;p<5;p++){
 let page=sheet('LES POISSONS DES NOMBRES','Défi du récif - Je passe d’un poisson à l’autre',p+3);
 page.insertAdjacentHTML('beforeend','<p class="instructions">Consigne : pars du premier nombre et applique les opérations dans l’ordre. Écris le nombre obtenu sous chaque poisson.</p>');
 for(let j=0;j<4;j++){let index=p*4+j,[start,ops]=chains[index],box=document.createElement('section');box.className='chain';box.innerHTML='<h2>CHAÎNE '+(index+1)+'</h2><div class="fishrow">'+Array.from({length:6},(_,k)=>'<div class="fishstep"><div class="op">'+(k?op(ops[k-1]):'&nbsp;')+'</div><div class="fish" aria-hidden="true"></div><div class="number">'+(k===0?fmt(start):'<span class="answer"></span>')+'</div></div>').join('')+'</div>';page.append(box);}
 page.insertAdjacentHTML('beforeend','<div class="note">Astuce : +10 avance de dix ; −10 recule de dix.</div>');
}
{
let page=sheet('CORRIGÉ - LES POISSONS DES NOMBRES','Réponses des pages 1 et 2 (une opération à la fois)',8);
let grid=document.createElement('div');grid.className='corrections';
for(const [sign,nums] of groups){let b=document.createElement('section');b.className='corrbox';b.innerHTML='<h2>'+op(+sign)+'</h2>'+nums.map(n=>'<p>'+fmt(n)+' → '+fmt(n+(+sign))+'</p>').join('');grid.append(b);}page.append(grid);
}
{
let page=sheet('CORRIGÉ - DÉFI DU RÉCIF','Les 20 chaînes de calculs : résultats dans l’ordre des poissons.',9);
for(let i=0;i<chains.length;i++){let [start,ops]=chains[i],out=[start],n=start;for(let step of ops){n+=step;out.push(n)}page.insertAdjacentHTML('beforeend','<div class="corrchain"><strong>Chaîne '+String(i+1).padStart(2,'0')+'</strong>'+out.map(fmt).join(' → ')+'</div>');}
}
</script></body></html>
