<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le chemin du kangourou — Suites numériques CE1</title><meta name="description" content="Aide le kangourou à rejoindre le spinifex en coloriant un labyrinthe de nombres par bonds de 10, 20, 25 ou 50."><link rel="canonical" href="https://bleja972.github.io/jeux/chemin-du-kangourou/"><meta property="og:title" content="Le chemin du kangourou"><meta property="og:description" content="Aide le kangourou à rejoindre le spinifex en coloriant un labyrinthe de nombres par bonds de 10, 20, 25 ou 50."><meta property="og:image" content="https://bleja972.github.io/jeux/chemin-du-kangourou/australie.webp"></head><body style="margin:0;background:#edc79b"><nav style="padding:10px 16px;font:600 15px Arial,sans-serif"><a style="color:#502c1a" href="/">← Retour aux jeux</a></nav><div id="kangourou-labynombre">
<style>
@scope (#kangourou-labynombre){
:scope{display:block;max-width:1000px;margin:auto;color:#392719;background:#edc79b url('/jeux/chemin-du-kangourou/australie.webp') center/cover;border-radius:22px;overflow:hidden;font:16px/1.4 Arial,sans-serif}*{box-sizing:border-box}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #105d70;outline-offset:2px}.screen{min-height:650px;padding:20px;background:linear-gradient(#ffebd4d9,#ffe6c4b5)}.head{text-align:center}.eyebrow{color:#9b411e;text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:bold}.head h1{font-size:clamp(26px,5vw,38px);margin:4px 0;color:#773717}.head p{margin:4px}.box{max-width:710px;margin:16px auto;background:#fff9ed99;border:1px solid #d39b69;border-radius:18px;padding:16px;box-shadow:0 5px 20px #67370d22}.levels{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.levels button,.action{border:1px solid #9c623d;border-radius:10px;background:#fffaf0;color:#663619;padding:9px 15px;min-height:44px;font-weight:bold}.levels button[aria-pressed=true],.primary{background:#a74c22;color:white;border-color:#853614}.directions{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#713413;font-size:15px;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;background:url('/jeux/chemin-du-kangourou/australie.webp') center/cover;border-radius:6px}.cell{border:1px solid #ad8056;background:rgba(255,249,237,.55);min-width:0;aspect-ratio:1.1;border-radius:5px;color:#302419;font-size:clamp(13px,3vw,22px);font-weight:700;text-shadow:0 1px 3px #fff,0 0 4px #fff;padding:0}.cell.selected{background-color:rgba(217,125,54,.88);color:#251204;border-color:#8c3b14;box-shadow:inset 0 0 0 2px #f6c789}.cell.start,.cell.finish{border:2px solid #2d6b57;background-image:url('/jeux/chemin-du-kangourou/australie.webp');background-repeat:no-repeat;position:relative}.cell.start{background-size:auto 100%;background-position:left center}.cell.finish{background-size:400% auto;background-position:100% 80%}.cell.start span,.cell.finish span{display:inline-block;background:#fff9edeb;border-radius:4px;padding:1px 3px}.arrival-label{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin-top:4px;color:#713413;font-weight:bold;font-size:clamp(10px,2vw,14px);text-align:center}.arrival-label span{grid-column:8}.controls .action{color:#fff;border:1px solid #713412;text-shadow:0 1px 1px #4b2707;box-shadow:inset 0 2px 0 #ffffff66,0 4px 0 #774018,0 6px 6px #45230c44;transition:transform .1s,box-shadow .1s}.controls .action:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #ffffff55,0 1px 0 #774018}.controls [data-check]{background:linear-gradient(#5caa70,#317747)}.controls [data-undo]{background:linear-gradient(#e8a542,#b9671c)}.controls [data-clear]{background:linear-gradient(#dc7660,#ad4134)}.controls [data-new]{background:linear-gradient(#65a4b3,#377283)}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:13px}.feedback{text-align:center;min-height:2em;font-weight:bold;margin:10px 0 0;color:#713413}.feedback.good{color:#176340}.hint{text-align:center;font-size:14px;margin:8px 0;color:#5f4936}.legend{display:flex;align-items:center;justify-content:center;gap:8px}.swatch{display:inline-block;width:18px;height:18px;border-radius:4px;background:#d97d36;border:1px solid #8c3b14}.footer{text-align:center;font-size:13px;margin:8px 0 0;color:#62482e}@media(max-width:600px){.screen{min-height:0;padding:10px}.box{padding:10px;margin:10px auto}.grid{gap:2px}.cell{font-size:clamp(12px,4vw,18px);aspect-ratio:1;min-height:35px}.levels button{padding:8px 12px}.head p{font-size:14px}.directions{font-size:13px}.action{padding:8px 10px;font-size:14px}}
}

<div class="screen"><div class="head"><div class="eyebrow">Australie · Labynombre</div><h1>Le chemin du kangourou</h1><p>Colorie le chemin jusqu’au spinifex !</p></div><div class="box"><div class="levels" role="group" aria-label="Choisir le bond"><button type="button" data-step="10" aria-pressed="true">+ 10</button><button type="button" data-step="20" aria-pressed="false">+ 20</button><button type="button" data-step="25" aria-pressed="false">+ 25</button><button type="button" data-step="50" aria-pressed="false">+ 50</button></div><p class="hint" data-instruction></p><div class="directions"><span>Départ ↓</span></div><div class="grid" role="group" aria-label="Grille du labyrinthe" data-grid></div><div class="arrival-label"><span>Arrivée</span></div><div class="controls"><button type="button" class="action primary" data-check>Vérifier</button><button type="button" class="action" data-undo>Effacer la dernière</button><button type="button" class="action" data-clear>Tout effacer</button><button type="button" class="action" data-new>Nouvelle grille</button></div><p class="feedback" role="status" aria-live="polite" data-feedback></p><div class="legend"><span class="swatch"></span><span>Couleur du chemin : ocre du désert</span></div><p class="footer">Un clic sur une case la colorie ; un nouveau clic l’efface.</p></div></div>
<script>
(()=>{'use strict';const root=document.getElementById('kangourou-labynombre'),q=s=>root.querySelector(s),grid=q('[data-grid]'),feedback=q('[data-feedback]');let step=10,route=[],values=[],selected=[],solved=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRoute(previous){const path=[0],seen=new Set(path);function walk(pos){const remaining=19-path.length,r=Math.floor(pos/8),c=pos%8,d=14-r-c;if(d>remaining||((remaining-d)%2!==0))return false;if(pos===63)return remaining===0;if(!remaining)return false;const candidates=shuffle([[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([y,x])=>y>=0&&y<8&&x>=0&&x<8).map(([y,x])=>y*8+x));for(const n of candidates){if(seen.has(n))continue;seen.add(n);path.push(n);if(walk(n))return true;path.pop();seen.delete(n)}return false}do{path.length=1;seen.clear();seen.add(0);if(!walk(0))throw new Error('Impossible de créer le parcours')}while(previous.length&&path.every((n,i)=>n===previous[i]));return path.slice()}
function make(){selected=[];solved=false;route=newRoute(route);const maxStart=Math.min(30,1000-step*(route.length-1));let start=5+Math.floor(Math.random()*(maxStart-4));const pathValues=route.map((_,i)=>start+i*step),reserved=new Set(pathValues),decoys=[];for(let n=1;n<=Math.min(1000,Math.max(250,start+step*(route.length-1)+50));n++)if(!reserved.has(n))decoys.push(n);shuffle(decoys);values=Array(64);let j=0;for(let i=0;i<64;i++)values[i]=route.includes(i)?pathValues[route.indexOf(i)]:decoys[j++];q('[data-instruction]').textContent='Ajoute '+step+' à chaque bond. Déplace-toi horizontalement ou verticalement, jamais en diagonale.';feedback.textContent='';feedback.className='feedback';draw()}
function draw(){grid.replaceChildren();values.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='cell'+(selected.includes(i)?' selected':'')+(i===route[0]?' start':'')+(i===route.at(-1)?' finish':'');if(i===route[0]||i===route.at(-1)){const label=document.createElement('span');label.textContent=n;b.append(label)}else b.textContent=n;b.setAttribute('aria-pressed',String(selected.includes(i)));b.setAttribute('aria-label',n+(i===route[0]?' départ':i===route.at(-1)?' arrivée':'')+(selected.includes(i)?' sélectionné':''));b.addEventListener('click',()=>{const pos=selected.indexOf(i);if(pos>=0)selected.splice(pos,1);else selected.push(i);solved=false;feedback.textContent='';feedback.className='feedback';draw();grid.children[i].focus({preventScroll:true})});grid.append(b)})}
root.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{step=Number(b.dataset.step);root.querySelectorAll('[data-step]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));make()}));q('[data-undo]').addEventListener('click',()=>{selected.pop();feedback.textContent='';draw()});q('[data-clear]').addEventListener('click',()=>{selected=[];feedback.textContent='';draw()});q('[data-new]').addEventListener('click',make);q('[data-check]').addEventListener('click',()=>{const success=route.slice(1,-1).every(cell=>selected.includes(cell))&&selected.every(cell=>route.includes(cell));solved=success;feedback.className='feedback'+(success?' good':'');feedback.textContent=success?'Bravo ! Le kangourou a trouvé le spinifex !':'Pas encore : vérifie les bonds et colorie toutes les cases du chemin, sans diagonale.'});make();})();
</script></div>
</body></html>
