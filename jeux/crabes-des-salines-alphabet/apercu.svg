<title id="title">Les crabes des Salines · Ordre alphabétique</title>
<desc id="desc">Aperçu de partie CE1 : cinq crabes tiennent des pancartes avec les mots front, femme, fleur, frère et forêt. Les crabes sont à ranger dans l'ordre alphabétique.</desc>
