header{text-shadow:0 2px 12px #06091b}
.panel{background:#131729eb;border-color:#796d9d;box-shadow:0 18px 48px #040612a6,0 0 26px #35ddff20}

.choices{margin-top:16px;gap:14px}.neon{--glow:#64ffe9;position:relative;min-height:60px;color:#080c19;border:2px solid #f7ffff;background:linear-gradient(150deg,#fff 0%,var(--glow) 44%);box-shadow:inset 0 0 11px #fff9,0 0 10px var(--glow),0 0 23px color-mix(in srgb,var(--glow) 65%,transparent);text-transform:uppercase;letter-spacing:.035em}.neon:not(:disabled):hover{filter:brightness(1.16)}.neon:focus-visible{outline-offset:5px}
[data-choice=mp]{--glow:#a1baff}[data-choice=fs]{--glow:#ff9eea}[data-choice=fp]{--glow:#ffee77}
.hex[data-state=ms]{--rim:#64ffe9;--face:#125751}.hex[data-state=mp]{--rim:#a1baff;--face:#344478}.hex[data-state=fs]{--rim:#ff9eea;--face:#67315f}.hex[data-state=fp]{--rim:#ffee77;--face:#5d4c22}
.scores{margin-top:16px}.scores h2{font-size:1.1rem;margin:0}.scores ol{margin-bottom:0}.scores li+li{margin-top:4px}

.grid{--cell:min(23vw,138px);--height:calc(var(--cell) * 1.154700538);width:max-content;max-width:100%;grid-template-columns:repeat(7,calc(var(--cell) / 2));grid-auto-rows:calc(var(--height) * .75);gap:0;margin:20px auto calc(20px + var(--height) * .25)}
.hex{width:var(--cell);height:var(--height);min-height:0;aspect-ratio:auto;grid-column:var(--col) / span 2;grid-row:var(--row);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);padding:8px 11%;font-size:clamp(.73rem,2.8vw,1.1rem)}
.hex::before,.hex::after{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex::after{inset:2px;transform:scale(.975)}
.hex:focus-visible{--rim:#ffdc72;--face:#473d60}.sound{min-height:38px;padding:4px 10px;font-size:.9rem}

.arcade-fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.arcade-spark,.arcade-ring{position:absolute;left:var(--x);top:var(--y);pointer-events:none;color:var(--fx)}
.arcade-spark{width:6px;height:6px;background:currentColor;border-radius:2px;box-shadow:0 0 9px currentColor;animation:arcade-burst .68s ease-out both}
.arcade-ring{width:44px;height:44px;border:3px solid currentColor;box-shadow:0 0 12px currentColor;border-radius:50%;animation:arcade-ring .55s ease-out both}
@keyframes arcade-burst{from{opacity:1;transform:translate(-50%,-50%) scale(1.3)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(160deg) scale(.2)}}
@keyframes arcade-ring{from{opacity:.9;transform:translate(-50%,-50%) scale(.35)}to{opacity:0;transform:translate(-50%,-50%) scale(2.5)}}
.hex.arcade-error{--rim:#ff917d;animation:arcade-jolt .3s ease-in-out}
@keyframes arcade-jolt{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){.arcade-fx{display:none}.hex.arcade-error{animation:none}}
</style></head><body><div id="arcade-fx" class="arcade-fx" aria-hidden="true"></div><main><nav><a style="color:#aafcef" href="/competences/grammaire/?niveau=CE1#catalogue">← Jeux de grammaire CE1</a></nav><header><div class="tag">FRANÇAIS · CE1</div><h1>Hexa <span>Flash</span></h1><p class="intro">Masculin ou féminin ? Singulier ou pluriel ? Classe les groupes de mots pour allumer la grille.</p></header><section class="panel" aria-label="Jeu de tri"><noscript>Ouvre le fichier dans un navigateur avec JavaScript activé pour jouer.</noscript><div class="hud"><span id="count"></span><span id="score"></span><button id="sound" type="button" class="plain sound" aria-pressed="true">Son activé</button></div><div id="grid" class="grid" role="group" aria-label="Grille à colorier"></div><div class="question" id="question">Choisis le genre et le nombre de ce groupe de mots. <strong id="word" class="word"></strong></div><div class="choices" role="group" aria-label="Choisir le genre et le nombre"><button type="button" class="neon" data-choice="ms">Masculin Singulier</button><button type="button" class="neon" data-choice="mp">Masculin Pluriel</button><button type="button" class="neon" data-choice="fs">Féminin Singulier</button><button type="button" class="neon" data-choice="fp">Féminin Pluriel</button></div><p id="feedback" class="feedback" role="status"></p><div class="foot"><button id="restart" type="button" class="plain">Nouvelle grille</button><small>1 point par case réussie du premier coup.</small></div></section><section class="panel scores" aria-labelledby="history-title"><h2 id="history-title">Scores des dernières parties</h2><ol id="history"></ol></section></main>
<script>
'use strict';
const words=[
 ['un chat','des chats'],['une pomme','des pommes'],['le lapin','les lapins'],['la fleur','les fleurs'],['un bateau','des bateaux'],['un gâteau','des gâteaux'],['un cheval','des chevaux'],['un journal','des journaux'],['un jeu','des jeux'],['un bijou','des bijoux'],['la souris','les souris'],['un nez','des nez'],['une noix','des noix'],['le tapis','les tapis'],['le loup','les loups'],['la poule','les poules'],['un livre','des livres'],['une étoile','des étoiles'],['un petit chien','des petits chiens'],['une grande maison','des grandes maisons'],['un oiseau','des oiseaux'],['la chaussure','les chaussures'],['un caillou','des cailloux'],['la tortue','les tortues']];
const $=id=>document.getElementById(id),choices=[...document.querySelectorAll('[data-choice]')];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const labels={ms:'masculin singulier',mp:'masculin pluriel',fs:'féminin singulier',fp:'féminin pluriel'};
function drawWords(){
 const gender=(pair)=>/^(une|la) /.test(pair[0])?'f':'m';
 return shuffle(['m','f'].flatMap(g=>shuffle(words.filter(pair=>gender(pair)===g)).slice(0,6).map((pair,i)=>({word:pair[i<3?0:1],kind:g+(i<3?'s':'p'),singular:pair[0],done:false,tried:false}))));
}
const historyKey='hexaflash-genre-nombre-scores-v1';
let history=[];
try{const saved=JSON.parse(localStorage.getItem(historyKey)||'[]');if(Array.isArray(saved))history=saved.filter(x=>Number.isInteger(x)&&x>=0&&x<=12).slice(0,10);}catch{}
function showHistory(){
 const list=$('history');list.replaceChildren();
 for(const label of history.length?history.map(n=>n+' / 12 — '+Math.round(n/12*100)+' %'):['Aucune partie terminée.']){const li=document.createElement('li');li.textContent=label;list.append(li);}
}
function saveScore(){history.unshift(points);history=history.slice(0,10);try{localStorage.setItem(historyKey,JSON.stringify(history));}catch{}showHistory();}

let grid,selected,points,done;
function say(s,good=false){$('feedback').textContent=s;$('feedback').className='feedback'+(good?' good':'')}
function select(i){if(grid[i]?.done||!grid[i])return;selected=i;update();say('')}
function update(){
 $('count').textContent=done+' / 12 cases allumées';$('score').textContent='Score : '+points+' / 12';
 $('word').textContent=done===12?'Grille terminée !':grid[selected].word;
 choices.forEach(b=>b.disabled=done===12);
 Array.from($('grid').children).forEach((b,i)=>{let item=grid[i];b.disabled=item.done;b.dataset.state=item.done?item.kind:'';b.setAttribute('aria-current',String(i===selected&&!item.done));b.setAttribute('aria-label',item.word+(item.done?' : '+labels[item.kind]:''))});
}

let audio, soundOn=true;
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'Son activé':'Son coupé';};
function playSound(success){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  audio??=new AC();if(audio.state==='suspended')audio.resume().catch(()=>{});
  const t=audio.currentTime, out=audio.createGain();out.gain.value=.48;out.connect(audio.destination);
  function tone(type,f,end,at,dur,vol){
   const o=audio.createOscillator(),g=audio.createGain(),a=t+at;
   o.type=type;o.frequency.setValueAtTime(f,a);o.frequency.exponentialRampToValueAtTime(end,a+dur);
   g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(vol,a+.014);g.gain.exponentialRampToValueAtTime(.0001,a+dur);
   o.connect(g);g.connect(out);o.start(a);o.stop(a+dur+.01);
  }
  if(success){
   tone('sine',180,430,0,.19,.18);
   [523,659,784,1047].forEach((f,i)=>{tone('sine',f,f*1.015,i*.072,.37,.17);tone('sine',f*2.01,f*2,i*.072,.18,.04);tone('sine',f,f,.12+i*.072,.36,.036);});
  }else{
   tone('triangle',300,125,0,.22,.21);tone('sine',315,106,0,.25,.13);tone('triangle',200,82,.17,.30,.15);
  }
  const duration=success?.16:.25,buf=audio.createBuffer(1,Math.floor(audio.sampleRate*duration),audio.sampleRate),samples=buf.getChannelData(0);
  for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*(1-i/samples.length)**2;
  const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();
  src.buffer=buf;filter.type='bandpass';filter.frequency.setValueAtTime(success?1900:980,t);filter.frequency.exponentialRampToValueAtTime(success?3900:390,t+duration);gain.gain.value=success?.09:.18;
  src.connect(filter);filter.connect(gain);gain.connect(out);src.start(t);setTimeout(()=>out.disconnect(),850);
 }catch{}
}


const arcadeColors={ms:'#64ffe9',mp:'#a1baff',fs:'#ff9eea',fp:'#ffee77'};
function arcadeEffect(ok,kind){
 const cell=$('grid').children[selected];
 if(!cell||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 if(!ok){cell.classList.remove('arcade-error');void cell.offsetWidth;cell.classList.add('arcade-error');cell.addEventListener('animationend',()=>cell.classList.remove('arcade-error'),{once:true});}
 const {left,top,width,height}=cell.getBoundingClientRect(),layer=$('arcade-fx');
 for(let i=0;i<(ok?19:7);i++){
  const p=document.createElement('i'),a=i*2.39996,d=(ok?42:20)+Math.random()*(ok?73:27);
  p.className=i===0?'arcade-ring':'arcade-spark';
  Object.entries({'--x':left+width/2+'px','--y':top+height/2+'px','--fx':ok?arcadeColors[kind]:'#ff917d','--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px'}).forEach(([k,v])=>p.style.setProperty(k,v));
  layer.append(p);p.addEventListener('animationend',()=>p.remove(),{once:true});
 }
}

function answer(kind){
 if(done===12)return;const item=grid[selected],det=item.word.split(' ')[0];
 if(kind!==item.kind){arcadeEffect(false,kind);playSound(false);item.tried=true;say(kind[1]!==item.kind[1]?'Réessaie ! « '+det+' » donne un indice sur le nombre.':item.kind[1]==='p'?'Réessaie ! Au singulier, on dit « '+item.singular+' ».':'Réessaie ! « '+det+' » donne un indice sur le genre.');return;}
 arcadeEffect(true,kind);playSound(true);item.done=true;done++;if(!item.tried)points++;
 if(done<12){const next=grid.findIndex((x,i)=>i>selected&&!x.done);selected=next<0?grid.findIndex(x=>!x.done):next;}
 update();
 if(done===12)saveScore();
 say(done===12?'Bravo, toute la grille est allumée ! Ton score : '+points+' / 12.':'Bravo ! « '+item.word+' » est au '+labels[kind]+'.',true);
}
function start(){grid=drawWords();selected=points=done=0;$('grid').replaceChildren();grid.forEach((item,i)=>{let b=document.createElement('button');b.type='button';b.className='hex';b.style.setProperty('--row',Math.floor(i/3)+1);b.style.setProperty('--col',1+2*(i%3)+Math.floor(i/3)%2);b.textContent=item.word;b.onclick=()=>select(i);$('grid').append(b)});update();say('')}
choices.forEach(b=>b.onclick=()=>answer(b.dataset.choice));$('restart').onclick=start;showHistory();start();
</script><script async data-goatcounter="https://lesjeuxdemathsetdefrancais.goatcounter.com/count" src="https://gc.zgo.at/count.js"></script></body></html>
