function random(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function neighbors(p){let y=Math.floor(p/8),x=p%8;return Object.entries(delta).map(([k,[dy,dx]])=>[k,y+dy,x+dx]).filter(a=>a[1]>=0&&a[1]<8&&a[2]>=0&&a[2]<8).map(([k,r,c])=>[k,r*8+c])}
function shortest(start,targets,water){let queue=[[start,0,0]],seen=new Set([start+',0']),all=(1<<targets.length)-1;for(let i=0;i<queue.length;i++){let [p,mask,d]=queue[i];for(let j=0;j<targets.length;j++)if(targets[j]===p)mask|=1<<j;if(mask===all)return d;for(const [,n] of neighbors(p)){let key=n+','+mask;if(!water.has(n)&&!seen.has(key)){seen.add(key);queue.push([n,mask,d+1])}}}return Infinity}

function say(t,c=''){msg.textContent=t;msg.className='message '+c}function resetPosition(){position=board.start;fish=new Set(board.targets);eaten=new Set;const row=Math.floor(position/8),col=position%8;const nearest=board.targets.reduce((best,p)=>Math.abs(Math.floor(p/8)-row)+Math.abs(p%8-col)<Math.abs(Math.floor(best/8)-row)+Math.abs(best%8-col)?p:best,board.targets[0]);const dy=Math.floor(nearest/8)-row,dx=nearest%8-col;facing=Math.abs(dy)>=Math.abs(dx)?(dy<0?'U':'D'):(dx<0?'L':'R');runIndex=-1}function draw(){grid.replaceChildren();for(let i=0;i<64;i++){let d=document.createElement('div');d.className='cell'+(board.water.has(i)?' water':'')+(position===i?' bear':'')+((fish.has(i)||eaten.has(i))?' fishing-hole':'');d.setAttribute('role','gridcell');let names=[];if(board.water.has(i))names.push('eau');else names.push('banquise');if(fish.has(i))names.push('poisson');if(position===i)names.push('ours');d.setAttribute('aria-label',names.join(', '));if(eaten.has(i))names.push('arêtes de poisson');if(fish.has(i)||eaten.has(i)){let f=document.createElement('img');f.className='sprite ground-image';f.src=fish.has(i)?sprites.poisson:sprites.aretes;f.alt='';d.append(f)}if(position===i){let bear=document.createElement('img');bear.className='sprite bear-image';bear.src=facing==='U'?sprites.dos:facing==='D'?sprites.face:sprites.ours;bear.style.transform=facing==='L'?'scaleX(-1)':'';bear.alt='';d.append(bear)}d.setAttribute('aria-label',names.join(', '));grid.append(d)}q('[data-fish]').textContent='Poissons restants : '+fish.size;let p=q('[data-program]');p.replaceChildren();program.forEach((v,i)=>{let el=document.createElement('span');el.className='instruction'+(i===runIndex?' active':i<runIndex?' done':'');el.textContent=arrows[v];el.setAttribute('aria-label',({U:'haut',D:'bas',L:'gauche',R:'droite',E:'manger'})[v]);p.append(el)});q('[data-count]').textContent=program.length+' / 24';root.querySelectorAll('button,select').forEach(x=>{x.disabled=busy});q('[data-add="E"]').hidden=m function load(){token++;busy=false;board=levels[level];program=[];resetPosition();sel.value=String(level);say('Ajoute des flèches, puis lance ton programme.');draw()}
root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(program.length>=24){say('Le programme est limité à 24 instructions.','error');return}program.push(b.dataset.add);say('');draw()});q('[data-undo]').onclick=()=>{program.pop();say('');draw()};q('[data-clear]').onclick=()=>{program=[];resetPosition();say('Programme effacé.');draw()};sel.onchange=()=>{level=+sel.value;load()};q('[data-next]').onclick=()=>{level=(level+1)%20;load()};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;root.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));program=[];resetPosition();say(mode==='eat'?'Ajoute « Manger » sur chaque case contenant un poisson.':'Les poissons sont ramassés automatiquement.');draw()});
q('[data-run]').onclick=async()=>{if(!program.length){say('Ajoute au moins une instruction.','error');return}resetPosition();busy=true;let current=++token;say('C’est parti !');draw();for(let i=0;i<program.length;i++){runIndex=i;draw();await new Promise(r=>setTimeout(r,500));if(current!==token)return;let action=program[i];if(action==='E'){if(fish.has(position)){fish.delete(position);eaten.add(position)}else if(!eaten.has(position)){busy=false;say('Il n’y a pas de poisson sur cette case. Modifie ton programme et réessaie.','error');draw();return}}else{let [dy,dx]=delta[action],y=Math.floor(position/8)+dy,x=position%8+dx;if(y<0||y>7||x<0||x>7||board.water.has(y*8+x)){busy=false;say('Plouf ! L’ours est tombé à l’eau ou sorti de la grille. Modifie ton programme.','error');draw();return}position=y*8+x;facing=action;if(mode==='auto'&&fish.delete(position))eaten.add(position)}draw();if(fish.size===0)break;if(eaten.size>0&&fish.size>0)say('Encore '+fish.size+' poisson'+(fish.size>1?'s':'')+' à ramasser : l’ours continue son chemin.')}busy=false;runIndex=program.length;if(fish.size===0)say('Bravo ! L’ours a ramassé tous les poissons ! 🐟','good');else say('Il reste '+fish.size+' poisson'+(fish.size>1?'s':'')+' à ramasser. Ajoute des flèches après la dernière instruction, puis appuie sur GO.','error');draw()};load();})();
