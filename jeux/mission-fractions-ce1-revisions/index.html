<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const lesson=[
{title:'Reconnaître un demi et un quart',sub:'Choisis OUI si exactement la fraction annoncée est coloriée.',q:[
 {type:'choice',label:'a) Un demi est-il colorié ?',shape:'bar',n:2,k:1,expect:'Oui'},
 {type:'choice',label:'a) Un demi est-il colorié ?',shape:'wedge',n:2,k:1,expect:'Oui'},
 {type:'choice',label:'a) Un demi est-il colorié ?',shape:'triangle',n:2,k:1,expect:'Oui'},
 {type:'choice',label:'a) Un demi est-il colorié ?',shape:'circle',n:2,k:1,expect:'Oui'},

 {type:'choice',label:'b) Un quart est-il colorié ?',shape:'bar',n:2,k:1,expect:'Non'},
 {type:'choice',label:'b) Un quart est-il colorié ?',shape:'wedge',n:4,k:1,expect:'Oui'},
 {type:'choice',label:'b) Un quart est-il colorié ?',shape:'circle',n:4,k:1,expect:'Oui'}]},
{title:'Lire la partie coloriée',sub:'Écris le numérateur au-dessus de la barre et le dénominateur en dessous.',q:[
 {type:'fraction',label:'a) Hexagone',shape:'hex',n:6,k:1,expect:'1/6'},
 {type:'fraction',label:'b) Carré',shape:'wedge',n:8,k:1,expect:'1/8'},
 {type:'fraction',label:'c) Rectangle',shape:'bar',n:5,k:1,expect:'1/5'}]},
{title:'Former un tout',sub:'Complète la fraction pour qu’elle soit égale à 1.',q:[
 {type:'fraction',label:'a) Un tout en trois tiers',statement:'1 tout =',expect:'3/3',fixedDen:3},
 {type:'fraction',label:'b) Sept parts font un tout',statement:'1 tout =',expect:'7/7',fixedNum:7}]},
{title:'Le complément à 1',sub:'Trouve la fraction manquante pour obtenir un tout.',q:[
 {type:'fraction',label:'a) Complète',statement:'2/6 + ___ = 1',expect:'4/6'},
 {type:'fraction',label:'b) Complète',statement:'7/8 + ___ = 1',expect:'1/8'}]},
{title:'La partie d’un tout',sub:'Chaque petit triangle colorié représente quelle fraction de la figure entière ?',q:[
 {type:'fraction',label:'a) Un triangle dans un rectangle de six demi-parts',shape:'bar',n:6,k:1,expect:'1/6'},
 {type:'fraction',label:'b) Un triangle dans une figure de sept demi-parts',shape:'bar',n:7,k:1,expect:'1/7'}]},
{title:'Comparer les fractions',sub:'Choisis la plus petite ou la plus grande fraction.',q:[
 {type:'compare',label:'a) La plus petite',options:['1/2','1/4'],expect:'1/4'},
 {type:'compare',label:'b) La plus petite',options:['1/3','1/2'],expect:'1/3'},
 {type:'compare',label:'c) La plus grande',options:['1/8','1/6'],expect:'1/6'},
 {type:'compare',label:'d) La plus grande',options:['1/3','1/8'],expect:'1/3'}]},
{title:'Fractions de carrés',sub:'Lis les carrés, puis classe les fractions de la plus grande à la plus petite.',q:[
 {type:'fraction',label:'a) Carré 1',shape:'square',n:4,k:1,expect:'1/4'},
 {type:'fraction',label:'a) Carré 2',shape:'square',n:4,k:3,expect:'3/4'},
 {type:'fraction',label:'a) Carré 3',shape:'square',n:4,k:2,expect:'2/4'},
 {type:'order',label:'b) Du plus grand au plus petit',options:['1/4','3/4','2/4'],expect:'3/4|2/4|1/4',sign:'>'}]},
{title:'Fractions de disques',sub:'Observe les huitièmes, puis range les fractions de la plus petite à la plus grande.',q:[
 {type:'fraction',label:'a) Disque 1',shape:'circle',n:8,k:4,expect:'4/8',fixedDen:8},
 {type:'fraction',label:'a) Disque 2',shape:'circle',n:8,k:3,expect:'3/8',fixedDen:8},
 {type:'fraction',label:'a) Disque 3',shape:'circle',n:8,k:6,expect:'6/8',fixedDen:8},
 {type:'order',label:'b) Du plus petit au plus grand',options:['4/8','3/8','6/8'],expect:'3/8|4/8|6/8',sign:'<'}]},
{title:'Additionner des fractions',sub:'Additionne les numérateurs. Le dénominateur reste identique.',q:[
 {type:'fraction',label:'a) Calcul',statement:'1/5 + 2/5 =',expect:'3/5'},
 {type:'fraction',label:'b) Calcul',statement:'4/7 + 3/7 =',expect:'7/7'},
 {type:'fraction',label:'c) Calcul',statement:'2/8 + 3/8 =',expect:'5/8'},
 {type:'fraction',label:'d) Calcul',statement:'4/9 + 5/9 =',expect:'9/9'}]},
{title:'Soustraire des fractions',sub:'Soustrais les numérateurs lorsque les dénominateurs sont identiques.',q:[
 {type:'fraction',label:'a) Calcul',statement:'4/7 − 2/7 =',expect:'2/7'},
 {type:'fraction',label:'b) Calcul',statement:'1 − 7/8 =',expect:'1/8'},
 {type:'fraction',label:'c) Calcul',statement:'4/5 − 3/5 =',expect:'1/5'},
 {type:'fraction',label:'d) Calcul',statement:'1 − 4/9 =',expect:'5/9'}]}
];
let mission=0,finished=false,state=[],audio=null,scores={};
const nameList=['Demi et quart','Fraction coloriée','Un tout','Compléments à 1','Partie d’un tout','Comparer','Carrés','Disques','Additions','Soustractions'];
function beep(kind){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const seq=kind==='win'?[523,659,784]:kind==='bad'?[230,180]:[420];seq.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.17)})}catch(e){}}
function fracHtml(str){const a=String(str).split('/');return a.length!==2?str:'<span class="frac"><span class="top">'+a[0]+'</span><span class="bar"></span><span class="bottom">'+a[1]+'</span></span>'}
function mathHtml(s){return String(s).replace(/\d+\/\d+/g,t=>fracHtml(t)).replaceAll('___','<strong>?</strong>')}
function pathSlice(cx,cy,r,start,end){const a=start*Math.PI/180,b=end*Math.PI/180;const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);return 'M'+cx+' '+cy+'L'+x1+' '+y1+'A'+r+' '+r+' 0 '+(end-start>180?1:0)+' 1 '+x2+' '+y2+'Z'}
function figureSvg(shape,n,k,index=0){
 const colors=['#ffce32','#fb4484','#22d6f5','#a65bff','#27ed9b','#ff802a','#ed4ff8','#54d9ff','#f9ed3c','#ff5963','#4bf7c8','#da72ff'];
 const col=colors[(index+mission*3)%colors.length],empty='#080b17',stroke='#f3f7ff';
 let body='';
 if(shape==='bar'){for(let j=0;j<n;j++){const hh=96/n;body+='<rect x="28" y="'+(17+j*hh)+'" width="74" height="'+hh+'" fill="'+(j<k?col:empty)+'" stroke="'+stroke+'" stroke-width="1.8"/>'}}
 else if(shape==='square'){for(let i=0;i<4;i++){const x=23+(i%2)*42,y=23+Math.floor(i/2)*42;body+='<rect x="'+x+'" y="'+y+'" width="42" height="42" fill="'+(i<k?col:empty)+'" stroke="'+stroke+'" stroke-width="1.8"/>'}}
 else if(shape==='triangle'){body='<path d="M65 18L112 103H18Z" fill="'+empty+'" stroke="'+stroke+'" stroke-width="2"/><path d="M65 18L65 103H18Z" fill="'+col+'" stroke="'+stroke+'" stroke-width="1.3"/><path d="M65 18V103" stroke="'+stroke+'" stroke-dasharray="4 3"/>'}
 else if(shape==='hex'){for(let i=0;i<6;i++){const a=i*60-90,b=a+60;body+='<path d="'+pathSlice(65,65,47,a,b)+'" fill="'+(i<k?col:empty)+'" stroke="'+stroke+'" stroke-width="1.8"/>'}}
 else{for(let i=0;i<n;i++){const a=-90+i*360/n,b=a+360/n;const shift=(mission===7&&shape==='circle')?[1,4,6][index%3]:0;const colored=((i-shift+n)%n)<k;body+='<path d="'+pathSlice(65,65,45,a,b)+'" fill="'+(colored?col:empty)+'" stroke="'+stroke+'" stroke-width="1.8"/>'}}
 // Les disques sont circulaires : ne pas ajouter un carré autour.
 return '<svg class="figure" viewBox="0 0 130 130" role="img" aria-label="'+k+' parts coloriées sur '+n+'">'+body+'</svg>'
}
function answerHtml(q){const [num,den]=q.expect.split('/');return '<span class="answer"><input inputmode="numeric" pattern="[0-9]*" aria-label="Numérateur" data-num type="text" maxlength="3" '+(q.fixedNum?'value="'+q.fixedNum+'" readonly':'')+'><span class="bar"></span><input inputmode="numeric" pattern="[0-9]*" aria-label="Dénominateur" data-den type="text" maxlength="3" '+(q.fixedDen?'value="'+q.fixedDen+'" readonly':'')+'></span>'}
function renderCard(q,i){let content='',controls='';
 if(q.shape)content+=figureSvg(q.shape,q.n,q.k,i);
 if(q.statement){
  let statement=mathHtml(q.statement);
  if(mission===3&&q.type==='fraction')statement=statement.replace('<strong>?</strong>',answerHtml(q));
  content+='<span class="statement">'+statement+'</span>';
 }
 if(q.type==='fraction'){controls=(mission===3)?'':answerHtml(q)}
 else if(q.type==='choice'||q.type==='compare')controls='<div class="choices">'+(q.options||['Oui','Non']).map((x,j)=>'<button type="button" class="choice" data-select="'+j+'" aria-pressed="false">'+(x.includes('/')?fracHtml(x):x)+'</button>').join('')+'</div>';
 else if(q.type==='order')controls='<div class="sort-options">'+q.options.map((x,j)=>'<button type="button" class="sort-option" data-sort="'+j+'">'+fracHtml(x)+'</button>').join('')+'</div><div class="sort-seq" aria-label="Ordre choisi">Choisis les trois fractions</div><button type="button" class="btn undo" data-undo style="min-height:39px;font-size:12px;margin-top:8px">↶ Effacer le dernier choix</button>';
 return '<article class="problem" data-q="'+i+'"><div class="problem-head">'+q.label.replace(/^[a-d]\)\s*/i,'')+'</div><div class="problem-body">'+content+controls+'</div><div class="note" aria-live="polite"></div></article>'
}
function scoreProgress(){const l=lesson[mission].q;let answered=state.filter((s,i)=>{let card=document.querySelector('[data-q="'+i+'"]');if(l[i].type==='fraction')return Array.from(card.querySelectorAll('input')).every(x=>x.value.trim()!=='');if(l[i].type==='order')return s.length===3;return s!==null}).length;$('#fill').style.width=Math.round(answered/l.length*100)+'%';$('#score').textContent=answered+' / '+l.length}
function render(){document.body.classList.toggle('mission-one',mission===0);finished=false;state=lesson[mission].q.map(q=>q.type==='order'?[]:null);$('#title').textContent='MISSION '+(mission+1)+' · '+lesson[mission].title.toUpperCase();$('#subtitle').textContent=lesson[mission].sub;$('#missions').innerHTML=nameList.map((s,i)=>'<button class="mission-btn '+(i===mission?'active':'')+'" data-m="'+i+'"><span class="number">'+String(i+1).padStart(2,'0')+'</span><span>'+s+'</span></button>').join('');$('#questions').innerHTML=lesson[mission].q.map(renderCard).join('');$('#fill').style.width='0%';$('#score').textContent='0 / '+lesson[mission].q.length;$('#result').hidden=true;$('#result').className='';$('#verify').disabled=false;$('#next').textContent=mission===9?'REVENIR À LA MISSION 1 ↻':'MISSION SUIVANTE →';attach()}
function attach(){
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mission=+b.dataset.m;beep('tap');render()});
 document.querySelectorAll('[data-q]').forEach(card=>{
 let i=+card.dataset.q,q=lesson[mission].q[i];
 card.querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,3);scoreProgress()}));
 card.querySelectorAll('[data-select]').forEach(btn=>btn.onclick=()=>{if(finished)return;card.querySelectorAll('[data-select]').forEach(b=>{b.classList.toggle('selected',b===btn);b.setAttribute('aria-pressed',String(b===btn))});state[i]=q.type==='choice'?['Oui','Non'][+btn.dataset.select]:q.options[+btn.dataset.select];beep('tap');scoreProgress()});
 function renderSort(){card.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('used',state[i].includes(q.options[+b.dataset.sort])));card.querySelector('.sort-seq').innerHTML=state[i].length?state[i].map(fracHtml).join('<span style="color:#fff;padding:0 6px">'+q.sign+'</span>'):'Choisis les trois fractions';scoreProgress()}
 card.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{if(finished)return;const v=q.options[+b.dataset.sort];if(state[i].includes(v)||state[i].length>=q.options.length)return;state[i].push(v);renderSort();beep('tap')});
 const undo=card.querySelector('[data-undo]');if(undo)undo.onclick=()=>{if(finished)return;state[i].pop();renderSort();beep('tap')};
 })}
function verify(){if(finished)return;finished=true;let right=0;lesson[mission].q.forEach((q,i)=>{const card=document.querySelector('[data-q="'+i+'"]');let actual;if(q.type==='fraction'){const a=card.querySelector('[data-num]').value.trim(),b=card.querySelector('[data-den]').value.trim();actual=a&&b?a+'/'+b:''}
 else if(q.type==='order')actual=state[i].join('|');else actual=state[i]||'';
 const good=actual===q.expect;if(good)right++;card.classList.add(good?'ok':'no');card.querySelector('.note').innerHTML=good?'✓ BRAVO !':'Réponse attendue : '+(q.type==='order'?q.expect.split('|').map(fracHtml).join(' '+q.sign+' '):q.expect.includes('/')?fracHtml(q.expect):q.expect);card.querySelectorAll('input').forEach(el=>el.readOnly=true);card.querySelectorAll('button').forEach(el=>el.disabled=true)});
 const n=lesson[mission].q.length,pct=Math.round(100*right/n);scores[mission]=pct;$('#score').textContent=right+' / '+n;$('#fill').style.width='100%';$('#verify').disabled=true;const perfect=right===n;$('#result').className=perfect?'perfect':'';$('#result').hidden=false;$('#result').innerHTML='<div class="big">'+(perfect?'BRAVO !':pct+' %')+'</div><div>'+right+' bonnes réponses sur '+n+' · '+pct+' %</div><p style="font-size:14px;font-weight:600">Les corrections sont indiquées sous les questions.</p>';beep(perfect?'win':right>0?'tap':'bad');if(perfect)confetti()}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#44faff','#ffe352','#ff62cf','#61ffb0','#9c81ff'];for(let i=0;i<28;i++){let s=document.createElement('span');s.style.cssText='position:fixed;z-index:30;pointer-events:none;width:8px;height:15px;border-radius:3px;left:'+Math.random()*100+'vw;top:-10px;background:'+colors[i%5]+';transition:transform 1.6s ease-in,opacity 1.6s';document.body.append(s);requestAnimationFrame(()=>{s.style.transform='translate('+(Math.random()*200-100)+'px,100vh) rotate(680deg)';s.style.opacity='0'});setTimeout(()=>s.remove(),1800)}}
$('#verify').onclick=verify;$('#reset').onclick=()=>{render();beep('tap')};$('#next').onclick=()=>{mission=(mission+1)%10;render();beep('tap');document.querySelector('.play').scrollIntoView({behavior:'smooth',block:'start'})};
const canvas=$('#stars'),ctx=canvas.getContext('2d');if(ctx&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){let dots=[],w=0,h=0;function size(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;dots=Array.from({length:Math.min(85,Math.max(30,Math.floor(w*h/14500)))},()=>({x:Math.random()*w,y:Math.random()*h,s:.15+Math.random()*.36,r:.5+Math.random()*1.2}))}size();window.addEventListener('resize',size,{passive:true});function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#a4dfff';dots.forEach(s=>{s.y=(s.y+s.s)%h;ctx.globalAlpha=.12+.24*(s.r/1.7);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(draw)}requestAnimationFrame(draw)}
render();
})();
</script></body></html>
