<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Géométrie CE1 — Colorier les figures</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e6f4ff,#fff7dc);font-family:Arial,sans-serif;color:#22384c}main{max-width:1150px;margin:auto;padding:14px}header,.card{background:#fffd;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 7px 20px #4454a01c}h1{color:#1765a1;text-align:center;margin:4px 0}p{line-height:1.55}.instruction{font-size:clamp(18px,2.2vw,24px);font-weight:bold}.palette,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{cursor:pointer;font:700 17px Arial;border:2px solid #d7e5ed;border-radius:12px;padding:10px 14px;background:#f4f9ff;color:#193b55}button[aria-pressed=true]{border-color:#1d72bc;box-shadow:0 0 0 2px #badafb}.primary{background:#1d72bc;color:white}.dot{width:22px;height:22px;display:inline-block;border:1px solid #889;border-radius:6px;vertical-align:middle;margin-right:7px}.board{display:block;width:100%;height:auto;max-height:75vh;touch-action:manipulation;background:white;border:2px solid #e4eefa;border-radius:16px}.shape{cursor:pointer;stroke:#35495b;stroke-width:3;stroke-linejoin:round;fill:#fff;transition:fill .15s}.shape:focus-visible{outline:none;stroke:#156cca;stroke-width:6}.shape.wrong{stroke:#e38c27;stroke-width:6}.shape.correct{stroke:#2b9851;stroke-width:5}#message{font-weight:700;font-size:20px;min-height:30px}.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#1266a2}@media(max-width:600px){.palette button{padding:9px}.board{max-height:none}}
</style></head><body><main><header><h1>🎨 Géométrie CE1</h1></header><section class="card"><p class="instruction">Colorie l’intérieur des carrés en <span style="color:#ef5b5b">rouge</span>, des rectangles en <span style="color:#2678d9">bleu</span>, des triangles en <span style="color:#299b50">vert</span> et des cercles en <span style="color:#8b54cf">violet</span>.</p><div class="bar"><strong>Choisis une couleur puis touche une figure.</strong><strong id="progress">0 figure coloriée</strong></div><div class="palette" id="palette"><button data-ink="red" aria-pressed="true"><span class="dot" style="background:#ef5b5b"></span>Rouge</button><button data-ink="blue" aria-pressed="false"><span class="dot" style="background:#4f98e6"></span>Bleu</button><button data-ink="green" aria-pressed="false"><span class="dot" style="background:#58b86a"></span>Vert</button><button data-ink="purple" aria-pressed="false"><span class="dot" style="background:#9a6fda"></span>Violet</button><button data-ink="erase" aria-pressed="false">🧽 Gomme</button></div>
<svg class="board" viewBox="0 0 1100 680" role="group" aria-label="Figures à colorier">
<rect x="5" y="5" width="1090" height="670" rx="16" fill="white"/>
<rect class="shape" tabindex="0" data-answer="red" aria-label="Carré" x="90" y="95" width="86" height="86"/>
<polygon class="shape" tabindex="0" data-answer="green" aria-label="Triangle" points="275,110 385,110 340,219"/>
<rect class="shape" tabindex="0" data-answer="blue" aria-label="Rectangle incliné" x="445" y="118" width="173" height="86" transform="rotate(-13 531.5 161)"/>
<rect class="shape" tabindex="0" data-answer="red" aria-label="Carré incliné" x="745" y="108" width="104" height="104" transform="rotate(43 797 160)"/>
<circle class="shape" tabindex="0" data-answer="purple" aria-label="Cercle" cx="952" cy="145" r="40"/>
<polygon class="shape" tabindex="0" data-answer="green" aria-label="Triangle" points="977,258 1073,219 1053,333"/>
<rect class="shape" tabindex="0" data-answer="blue" aria-label="Rectangle fin incliné" x="224" y="292" width="294" height="31" transform="rotate(24 371 307.5)"/>
<polygon class="shape" tabindex="0" data-answer="green" aria-label="Triangle" points="105,482 228,440 157,564"/>
<circle class="shape" tabindex="0" data-answer="purple" aria-label="Cercle" cx="524" cy="510" r="49"/>
<rect class="shape" tabindex="0" data-answer="blue" aria-label="Rectangle" x="625" y="455" width="159" height="86" transform="rotate(-8 704.5 498)"/>
<ellipse class="shape" tabindex="0" data-answer="erase" aria-label="Ovale" cx="923" cy="510" rx="107" ry="42" transform="rotate(19 923 510)"/>
<polygon class="shape" tabindex="0" data-answer="erase" aria-label="Parallélogramme" points="280,574 421,574 458,638 317,638"/>
</svg>
<div class="actions"><button class="primary" id="check">✅ Vérifier</button><button id="clear">🧽 Tout effacer</button><button id="again">🔄 Rejouer</button></div><p id="message" role="status" aria-live="polite"></p><p><a href="/">← Retour au blog</a></p></section></main><script>
(()=>{const colors={red:'#ef5b5b',blue:'#4f98e6',green:'#58b86a',purple:'#9a6fda',erase:'#fff'};let ink='red';const shapes=[...document.querySelectorAll('.shape')];const progress=document.querySelector('#progress'),msg=document.querySelector('#message');function update(){const n=shapes.filter(e=>e.dataset.ink&&e.dataset.ink!=='erase').length;progress.textContent=n+' figure'+(n!==1?'s':'')+' coloriée'+(n!==1?'s':'')}function paint(s){s.dataset.ink=ink;s.style.fill=colors[ink];s.classList.remove('correct','wrong');msg.textContent='';update()}document.querySelector('#palette').addEventListener('click',e=>{let b=e.target.closest('[data-ink]');if(!b)return;ink=b.dataset.ink;document.querySelectorAll('[data-ink]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});shapes.forEach(s=>{s.dataset.ink='erase';s.addEventListener('click',()=>paint(s));s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(s)}})});function clear(){shapes.forEach(s=>{s.dataset.ink='erase';s.style.fill='#fff';s.classList.remove('correct','wrong')});msg.textContent='Toutes les couleurs ont été effacées.';update()}document.querySelector('#clear').onclick=clear;document.querySelector('#again').onclick=clear;document.querySelector('#check').onclick=()=>{let n=0;shapes.forEach(s=>{const ok=s.dataset.ink===s.dataset.answer;s.classList.toggle('correct',ok);s.classList.toggle('wrong',!ok);if(ok)n++});let p=Math.round(100*n/shapes.length);msg.textContent=(n===shapes.length?'🏆 Bravo ! ':'Tu peux corriger les figures entourées en orange. ')+n+' / '+shapes.length+' réponses justes — '+p+' % de réussite.'};update()})();
</script><script defer data-bleja-share src="/assets/partager-jeu.js?v=share-v1"></script></body></html>
