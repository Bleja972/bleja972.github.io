function score(){ $('score').textContent=`Score : ${correct} / 15` }function startSeries(){series=Array.from({length:90},(_,i)=>i+10);for(let i=series.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[series[i],series[j]]=[series[j],series[i]]}series=series.slice(0,15);position=0;correct=total=0;score();newQuestion()}function newQuestion(){n=series[position];units=new Set();tens=new Set();unitTarget=n%10;tenTarget=Math.floor(n/10);$('progress').textContent=`Opération ${position+1} / 15`;$('next').textContent=position===14?"Voir le bilan →":"Suivant →";$('subtract').textContent=n;answer.value='';answer.readOnly=false;done=false;attempted=false;$('feedback').textContent='';$('feedback').className='feedback';$('check').hidden=false;$('next').hidden=true;render();}for(const [i,k] of [...'1234567890','erase'].entries()){let b=document.createElement('button');b.type='button';b.className='key'+(k==='erase'?' erase':'');b.style.setProperty('--neon',colors[i%colors.length]);b.textContent=k==='erase'?'Effacer':k;b.onclick=()=>{if(done)return;let s=answer.selectionStart??answer.value.length,e=answer.selectionEnd??s;if(k==='erase'){if(s===e)s=Math.max(0,s-1);answer.setRangeText('',s,e,'end')}else if(answer.value.length-e+s<3)answer.setRangeText(k,s,e,'end');answer.focus({preventScroll:true})};$('keypad').append(b)}function validate(e){if(e)e.preventDefault();if(done)return;if(!ready()){ $('feedback').textContent='Termine la manipulation de la grille.';return;}if(!/^\d{1,3}$/.test(answer.value.trim())){ $('feedback').textContent='Écris un nombre dans la case réponse.';$('feedback').className='feedback bad';answer.focus();return}const ok=Number(answer.value)===100-n;if(!attempted){total++;if(ok)correct++;attempted=true;score()}if(!ok){$('feedback').textContent=level===2?'Essaie encore. Retire les dizaines, puis les unités.':'Essaie encore. Compte uniquement les boules vertes.';$('feedback').className='feedback bad';sound(false);answer.select();return}done=true;answer.readOnly=true;refreshTargets();updateSteps();$('feedback').textContent=`Bravo ! 100 − ${n} = ${100-n}`;$('feedback').className='feedback good';$('check').hidden=true;$('next').hidden=false;sound(true);$('next').focus()} $('check').addEventListener('click',validate);$('exercise').addEventListener('submit',validate);answer.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();validate(e)}});$('next').onclick=()=>{if(!done)return;if(position===14){$('feedback').textContent=`Mission terminée ! Score : ${correct} / 15 (au premier essai).`; $('progress').textContent='15 opérations terminées';$('next').hidden=true;$('reset').focus();return}position++;newQuestion()};function selectLevel(v){if(level===v)return;level=v;$('level1').setAttribute('aria-pressed',String(v===1));$('level2').setAttribute('aria-pressed',String(v===2));$('visual').hidden=v===2;document.querySelector('.steps').hidden=v===2;document.querySelector('main').classList.toggle('mental',v===2);startSeries();} $('level1').onclick=()=>selectLevel(1);$('level2').onclick=()=>selectLevel(2);$('reset').onclick=startSeries;$('sound').onclick=()=>{muted=!muted;$('sound').textContent='♫ Sons : '+(muted?'OFF':'ON');$('sound').setAttribute('aria-pressed',String(!muted))};let canvas=$('stars'),ctx=canvas.getContext('2d');function stars(){canvas.width=innerWidth;canvas.height=innerHeight;ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=0;i<90;i++){ctx.fillStyle=i%4?'#263b4f':'#7295b9';ctx.beginPath();ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,Math.random()*.85+.2,0,Math.PI*2);ctx.fill()}}addEventListener('resize',stars);stars();startSeries();</script></body></html>
