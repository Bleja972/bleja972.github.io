main { width: min(100%, 1150px); margin: auto; padding: 18px 16px; }
h1 {
  margin: 0 0 4px;
  font-size: clamp(1.4rem, 4vw, 2.35rem);
  text-transform: uppercase;
  letter-spacing: .045em;
  text-shadow: 0 0 24px #8acaff88;
}
.subtitle { color: #d7e6fa; font-size: .9rem; }
.top, .info, .controls, .answer, .step { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.top { justify-content: space-between; margin-bottom: 14px; }
.info span {
  padding: 8px 12px; border-radius: 13px;
  background: #081322e8; border: 1px solid #8cc9ff;
  box-shadow: 0 0 14px #3b9dff37; font-weight: 750;
}
.panel {
  padding: clamp(8px, 2vw, 22px);
  background: linear-gradient(145deg,#101e31eb,#070d18f2);
  border: 1px solid #769abd; border-radius: 19px;
  box-shadow: inset 0 0 0 1px #85baff25, 0 14px 42px #0008;
}
.operation { padding: 4px 0 16px; text-align: center; font-weight: 800; }
.op-grid {
  display: inline-grid; grid-template-columns: repeat(4, 1.4ch);
  gap: 1px 9px; font-size: clamp(24px, 4vw, 34px);
  font-variant-numeric: tabular-nums; line-height: 1.1; color: #ffdf63;
  text-shadow: 0 0 11px #f7c24265;
}
.op-grid .carry { min-height: 1.1em; font-size: .56em; align-self: end; }
.op-grid .carry.visible { color: #ffe89c; animation: born .6s ease-out; }
.op-grid .result { border-top: 2px solid #d7ebff; padding-top: 4px; }
.mat {
  display: grid; grid-template-columns: repeat(3,minmax(0,1fr));
  border: 1px solid #6489ae; border-radius: 12px; overflow: hidden;
  background: #091521ad;
}
.place { min-width: 0; border-inline-end: 1px solid #526d8d; display: grid; grid-template-rows: subgrid; grid-row: span 4; }
.place:last-child { border-inline-end: 0; }
.heading {
  padding: 8px 2px; text-align: center; font-weight: 800;
  font-size: clamp(.72rem, 2.6vw, 1rem);
  background: linear-gradient(#172e4b,#0a1729);
  border-bottom: 1px solid #56799a;
}
.tokens { display: contents; }
.group {
  display: flex; align-content: center; align-items: center; justify-content: center; flex-wrap: wrap;
  gap: 7px; padding: 8px 5px 10px; min-height: 51px;
}
.separator { align-self: center; width: 80%; margin: auto; border-top: 1px dashed #809dbd90; }
.token {
  --shine: #ffc5c9; --body: #e33c53; --deep: #6e102a; --edge: #49091a;
  display: inline-grid; place-items: center; position: relative;
  flex: 0 0 auto; width: clamp(25px, 4.6vw, 46px); aspect-ratio: 1;
  border-radius: 50%; border: 1px solid var(--shine);
  background:
    radial-gradient(ellipse at 31% 17%, #ffffff93, transparent 36%),
    repeating-conic-gradient(from 35deg, #fff0 0deg, #ffffff10 3deg, #0002 5deg, #fff0 7deg),
    linear-gradient(145deg, var(--shine), var(--body) 38%, var(--deep) 74%, var(--body));
  color: #fff; font-size: clamp(.65rem, 1.7vw, .98rem); font-weight: 900;
  letter-spacing: -.04em; text-shadow: 0 -1px #000, 0 1px 2px #000;
  transform: perspective(200px) rotateX(17deg);
  box-shadow: inset 0 0 0 2px var(--edge), inset 0 0 0 3px #ffffff61,
    inset 0 -5px 8px #0007, 0 3px 0 var(--edge), 0 6px 7px #000b;
}
.token.t { --shine: #fff3a9; --body: #d6a027; --deep: #79500d; --edge: #513203; }
.token.h { --shine: #c8efff; --body: #2c9ffa; --deep: #174486; --edge: #09284c; }
.token.second { outline: 1px dashed #ffffffad; outline-offset: -5px; }
.tenpack {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; width: 100%;
  padding: 7px; border: 2px solid transparent; border-radius: 24px;
}
.tenpack.active { background: #ff925629; border-color: #ff8f59; box-shadow: 0 0 19px #ff825da1; animation: pulse .55s infinite alternate; }
.tenpack.vanish { animation: collapse .45s ease-in forwards; }
.newten { animation: born .75s ease-out; }
.circled-ten::after { content: ''; position: absolute; inset: -5px; border: 2px solid #ffdd76; border-radius: 50%; box-shadow: 0 0 11px #ffcf69; pointer-events: none; }
.notice { min-height: 2.7em; margin: 9px 0; display: grid; place-items: center; text-align: center; font-weight: 750; color: #a1f7cc; }
.notice[data-kind="error"] { color: #ffb0ba; }
.panel2 { padding: 8px; margin-bottom: 12px; background: #0c1b2c; border: 1px solid #4b6785; border-radius: 12px; }
.steps { display: grid; gap: 8px; }
.step, .controls, .answer { justify-content: center; }
.stepLabel, .digit label { font-weight: 700; }
.expr { color: #ffdf63; font-size: 1.25rem; font-weight: 850; white-space: nowrap; }
.expr .second { color: #d7c7ff; }
.expr .carry { color: #9bdcff; }
button, input { font: inherit; }
button {
  border: 1px solid #98d4ff; border-radius: 11px; padding: 9px 15px;
  color: #fff; font-weight: 800; cursor: pointer; touch-action: manipulation;
  background: linear-gradient(#57a6e5,#1b4474 58%,#112d50);
  box-shadow: inset 0 1px 3px #fff6, 0 2px 0 #14283e, 0 0 13px #409aff4d;
  text-shadow: 0 1px 2px #000b;
}
button:hover:not(:disabled) { filter: brightness(1.16); }
button:disabled { opacity: .48; cursor: default; }
button.alt { background: linear-gradient(#f1b260,#94601b 58%,#704615); border-color: #ffe1ad; box-shadow: inset 0 1px 3px #fff6, 0 0 13px #ffac4e55; }
button:focus-visible, input:focus-visible { outline: 3px solid #ffe195; outline-offset: 3px; }
input {
  width: 51px; height: 42px; text-align: center; font-size: 1.35rem; font-weight: 800;
  color: #0d233a; background: #edf7ff; border: 1px solid #8cc5f7; border-radius: 9px;
  box-shadow: inset 0 0 5px #36699f55;
}
input:disabled { opacity: .66; }
.answer { margin-top: 12px; align-items: end; }
.digit { text-align: center; }
.digit label { display: block; margin-bottom: 3px; font-size: .78rem; }
.summary { font-size: 1.25rem; font-weight: 800; text-align: center; padding: 14px; }
.hidden { display: none !important; }
.flash {
  position: fixed; pointer-events: none; z-index: 5; width: 32px; height: 32px;
  border-radius: 50%; background: radial-gradient(circle,#fff,#ffd66b 28%,#ff984444 61%,transparent 72%);
  animation: flash .68s ease-out both; box-shadow: 0 0 24px #ffdc70;
}
@keyframes flash { from { transform: scale(.25); opacity: 1; } to { transform: scale(5); opacity: 0; } }
@keyframes pulse { to { box-shadow: 0 0 28px #ff825d; } }
@keyframes collapse { to { transform: scale(.08); opacity: 0; } }
@keyframes born { 0% { transform: scale(.15); opacity: 0; } 55% { transform: scale(1.2); } 100% { opacity: 1; } }
@media(max-width: 480px) {
  main { padding: 10px 6px; }
  .group { gap: 4px; padding-inline: 3px; }
  .tenpack { gap: 4px; padding: 4px 0; }
  .stepLabel { flex-basis: 100%; text-align: center; font-size: .88rem; }
  .info span { padding: 5px 8px; font-size: .8rem; }
}
@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .flash { display: none; }
  .tenpack.vanish { opacity: 0; }
}
</style></head><body><main><div class="top"><div><h1>Additions avec échanges</h1><div class="subtitle">Vaisseau extraterrestre • jetons de numération en 3D</div></div><div class="info"><span id="progress">Addition 1 / 8</span><span id="score">Réussites : 0</span></div></div><div class="panel"><div class="operation" id="operation"></div><div class="mat"><section class="place" data-col="h"><div class="heading">Centaines</div><div class="tokens" id="hundreds"></div></section><section class="place" data-col="t"><div class="heading">Dizaines</div><div class="tokens" id="tens"></div></section><section class="place" data-col="u"><div class="heading">Unités</div><div class="tokens" id="units"></div></section></div><div class="notice" id="notice" aria-live="polite"></div><div class="steps panel2" id="steps"><div class="step" id="stepUnits"><span class="stepLabel">Addition en ligne des unités :</span><span id="unitsExpr" class="expr"></span><input id="unitsSum" inputmode="numeric" maxlength="2" aria-label="Résultat des unités"><button id="checkUnits" class="good">Valider</button></div><div class="step hidden" id="stepTens"><span class="stepLabel">Addition en ligne des dizaines :</span><span id="tensExpr" class="expr"></span><input id="tensSum" inputmode="numeric" maxlength="2" aria-label="Résultat des dizaines"><button id="checkTens" class="good">Valider</button></div></div><div class="controls"><button id="exchange">✦ Échanger 10 unités → 1 dizaine</button><button id="exchangeTens" class="hidden">✦ Échanger 10 dizaines → 1 centaine</button><button id="restart" class="alt">↻ Nouvelle partie</button></div><div class="answer" id="answer"><div class="digit"><label for="rh">Centaines</label><input id="rh" inputmode="numeric" maxlength="1" aria-label="Chiffre des centaines"></div><div class="digit"><label for="rt">Dizaines</label><input id="rt" inputmode="numeric" maxlength="1" aria-label="Chiffre des dizaines"></div><div class="digit"><label for="ru">Unités</label><input id="ru" inputmode="numeric" maxlength="1" aria-label="Chiffre des unités"></div><button class="good" id="verify">Vérifier</button></div><div id="end" class="summary hidden"></div></div></main><script>
const $=id=>document.getElementById(id);const pause=ms=>new Promise(r=>setTimeout(r,ms));let games=[],pos=0,success=0,phase='unitsInput',locked=false,current={};
function token(n,which='first',extra=''){const e=document.createElement('span');e.className=`token ${n===100?'h':n===10?'t':'u'} ${which} ${extra}`;e.textContent=n;return e}
function generate(){const seen=new Set();let out=[];while(out.length<8){let a=Math.floor(Math.random()*170)+110,b=Math.floor(Math.random()*180)+100;if((a%10+b%10)<10||a+b>899||seen.has(a+'-'+b))continue;seen.add(a+'-'+b);out.push({a,b});}return out}
function setNotice(message,kind='normal') {
  $('notice').textContent=message;
  $('notice').dataset.kind=kind;
  if(kind==='error') sound(false);
}
function lockGame(value) {
  locked=value;
  $('restart').disabled=value;
}
function drawOperation() {
  const {a,b}=current;
  const board=document.createElement('div');
  board.className='op-grid';
  board.setAttribute('aria-hidden','true');
  const digits=n=>String(n).split('');
  const rows=[['','','',''],['',...digits(a)],['+',...digits(b)],['','','','']];
  for(const [rowIndex,row] of rows.entries()) {
    for(const [column,value] of row.entries()) {
      const cell=document.createElement('span');
      cell.textContent=value;
      if(rowIndex===0) {
        cell.className='carry';
        if(column===1) cell.id='carryHundreds';
        if(column===2) cell.id='carryTens';
      }
      if(rowIndex===3) cell.className='result';
      if(rowIndex!==3 || column!==0) board.append(cell);
      else board.append(document.createElement('span'));
    }
  }
  $('operation').setAttribute('role','img');
  $('operation').setAttribute('aria-label',`Addition posée : ${a} plus ${b}`);
  $('operation').replaceChildren(board);
}
async function animateExchange(source,destination,value,carry) {
  const wrap=document.createElement('div');
  wrap.className='tenpack active';
  const picked=Array.from($(source).querySelectorAll('.group .token')).slice(0,10);
  $(source).querySelector('.first-group').prepend(wrap);
  wrap.append(...picked);
  sound();
  await pause(1050);
  burst(wrap.getBoundingClientRect());
  wrap.className='tenpack vanish';
  await pause(460);
  wrap.remove();
  const piece=token(value,'first','newten circled-ten');
  $(destination).querySelector('.first-group').append(piece);
  burst(piece.getBoundingClientRect());
  $(carry).textContent='1';
  $(carry).classList.add('visible');
  $('operation').setAttribute('aria-label',`Addition posée : ${current.a} plus ${current.b}. ${carry==='carryTens' ? 'Retenue aux dizaines.' : 'Retenues aux dizaines et aux centaines.'}`);
}
function sound(ok=true){try{const audio=new (window.AudioContext||window.webkitAudioContext)(),osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(ok?660:220,audio.currentTime);if(ok)osc.frequency.exponentialRampToValueAtTime(990,audio.currentTime+.12);gain.gain.setValueAtTime(.055,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+.22);osc.onended=()=>audio.close()}catch(e){}}
function burst(rect){const e=document.createElement('span');e.className='flash';e.style.left=(rect.left+rect.width/2-16)+'px';e.style.top=(rect.top+rect.height/2-16)+'px';e.style.width='32px';e.style.height='32px';document.body.append(e);setTimeout(()=>e.remove(),700)}
function setupColumn(target){target.replaceChildren();const first=document.createElement('div');first.className='group first-group';const sep=document.createElement('div');sep.className='separator';const second=document.createElement('div');second.className='group second-group';target.append(first,sep,second);return {first,second}}
function coloredExpression(id,parts){const el=$(id);el.replaceChildren();for(const [value,cls] of parts){const span=document.createElement('span');span.textContent=value;if(cls)span.className='colored-digit '+cls;el.append(span)}}
function show(el,yes=true){$(el).classList.toggle('hidden',!yes)}
function resetInputs(){for(let id of ['rh','rt','ru','unitsSum','tensSum']){$(id).value='';$(id).disabled=false}}
function buildCurrent(a,b){const au=a%10, bu=b%10, at=Math.floor(a/10)%10, bt=Math.floor(b/10)%10, ah=Math.floor(a/100), bh=Math.floor(b/100);const unitsTotal=au+bu;const unitsCarry=unitsTotal>=10?1:0;const tensBase=at+bt+unitsCarry;const tensCarry=tensBase>=10?1:0;const hundredsTotal=ah+bh+tensCarry;return {a,b,au,bu,at,bt,ah,bh,unitsTotal,unitsCarry,tensBase,tensCarry,hundredsTotal};}
function render(){current=buildCurrent(games[pos].a,games[pos].b);phase='unitsInput';lockGame(false);$('progress').textContent=`Addition ${pos+1} / 8`;$('score').textContent=`Réussites : ${success}`;drawOperation();const H=setupColumn($('hundreds')),T=setupColumn($('tens')),U=setupColumn($('units'));for(let i=0;i<current.ah;i++)H.first.append(token(100,'first'));for(let i=0;i<current.at;i++)T.first.append(token(10,'first'));for(let i=0;i<current.au;i++)U.first.append(token(1,'first'));for(let i=0;i<current.bh;i++)H.second.append(token(100,'second'));for(let i=0;i<current.bt;i++)T.second.append(token(10,'second'));for(let i=0;i<current.bu;i++)U.second.append(token(1,'second'));coloredExpression('unitsExpr',[[current.au,'first u'],[' + ',''],[current.bu,'second u'],[' =','']]);coloredExpression('tensExpr',[[current.at,'first t'],[' + ',''],[current.bt,'second t'],...(current.unitsCarry?[[' + ',''],['1','carry']]:[]),[' =','']]);show('stepUnits',true);show('stepTens',false);show('exchange',false);show('exchangeTens',false);$('exchange').disabled=false;$('exchangeTens').disabled=false;$('checkUnits').disabled=false;$('checkTens').disabled=false;$('verify').disabled=false;$('answer').classList.remove('hidden');$('end').classList.add('hidden');resetInputs();setNotice('Commence par compléter l’addition en ligne des unités. Exemple : 9 + 6 = 15.');}
function checkUnits(){if(locked||phase!=='unitsInput')return;const v=$('unitsSum').value.trim();if(!/^\d{1,2}$/.test(v)){setNotice('Complète le résultat des unités.');return}if(Number(v)!==current.unitsTotal){setNotice('Ce n’est pas le bon résultat pour les unités.','error');return}$('unitsSum').disabled=true;$('checkUnits').disabled=true;if(current.unitsCarry){phase='unitsExchange';show('exchange',true);setNotice(`Bravo ! ${current.au} + ${current.bu} = ${current.unitsTotal}. Maintenant, échange 10 unités contre 1 dizaine.`);}else{phase='tensInput';show('stepTens',true);setNotice(`Bravo ! ${current.au} + ${current.bu} = ${current.unitsTotal}. Passe aux dizaines.`);}}
async function exchangeUnits() {
  if(locked||phase!=='unitsExchange') return;
  lockGame(true);
  $('exchange').disabled=true;
  setNotice('Regarde les 10 unités entourées.');
  await animateExchange('units','tens',10,'carryTens');
  phase='tensInput';
  lockGame(false);
  show('exchange',false);
  show('stepTens');
  setNotice('10 unités deviennent 1 dizaine. Ajoute la retenue dans le calcul des dizaines.');
}
function checkTens(){if(locked||phase!=='tensInput')return;const v=$('tensSum').value.trim();if(!/^\d{1,2}$/.test(v)){setNotice('Complète le résultat des dizaines.');return}if(Number(v)!==current.tensBase){setNotice('Ce n’est pas le bon résultat pour les dizaines. N’oublie pas la retenue.','error');return}$('tensSum').disabled=true;$('checkTens').disabled=true;if(current.tensCarry){phase='tensExchange';show('exchangeTens',true);setNotice(`Bravo ! ${$('tensExpr').textContent} ${current.tensBase}. Maintenant, échange 10 dizaines contre 1 centaine.`);}else{phase='final';setNotice(`Bravo ! ${$('tensExpr').textContent} ${current.tensBase}. Tu peux maintenant écrire le résultat final.`);}}
async function exchangeTens() {
  if(locked||phase!=='tensExchange') return;
  lockGame(true);
  $('exchangeTens').disabled=true;
  setNotice('Regarde les 10 dizaines entourées.');
  await animateExchange('tens','hundreds',100,'carryHundreds');
  phase='final';
  lockGame(false);
  show('exchangeTens',false);
  setNotice('10 dizaines deviennent 1 centaine. Écris maintenant le résultat final.');
}
async function verify(){if(locked)return;if(phase!=='final'){setNotice('Complète d’abord les additions en ligne et les échanges.');return}const a=$('rh').value.trim(),b=$('rt').value.trim(),c=$('ru').value.trim();if(!/^\d$/.test(b)||!/^\d$/.test(c)||(a!==''&&!/^\d$/.test(a))){setNotice('Renseigne les dizaines et les unités, et les centaines si nécessaire.');return}const value=Number((a||'0')+b+c),goal=current.a+current.b;if(value!==goal){setNotice('Essaie encore ! Aide-toi des jetons et des additions en ligne.','error');return}lockGame(true);sound();burst($('verify').getBoundingClientRect());success++;$('score').textContent=`Réussites : ${success}`;setNotice('🎉 Bravo ! C’est juste !');$('verify').disabled=true;await pause(1300);pos++;if(pos<8)render();else finish()}
function finish(){lockGame(false);$('operation').removeAttribute('aria-label');$('operation').removeAttribute('role');$('progress').textContent='Partie terminée';$('operation').textContent='Bravo !';$('answer').classList.add('hidden');show('stepUnits',false);show('stepTens',false);show('exchange',false);show('exchangeTens',false);$('end').classList.remove('hidden');$('end').textContent=`Tu as réussi ${success} additions sur 8, soit ${Math.round(success/8*100)} % !`;$('notice').textContent='Clique sur Nouvelle partie pour recommencer.'}
function restart(){games=generate();pos=0;success=0;render()}
$('exchange').addEventListener('click',exchangeUnits);$('exchangeTens').addEventListener('click',exchangeTens);$('checkUnits').addEventListener('click',checkUnits);$('checkTens').addEventListener('click',checkTens);$('verify').addEventListener('click',verify);$('restart').addEventListener('click',restart);for(let id of ['rh','rt','ru','unitsSum','tensSum'])$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,e.target.maxLength||2)});
for(const [input,action] of [['unitsSum',checkUnits],['tensSum',checkTens],['rh',verify],['rt',verify],['ru',verify]]) {
  $(input).addEventListener('keydown',event=>{ if(event.key==='Enter') action(); });
}
restart();</script></body></html>
