<script>
'use strict';
const icon='<svg aria-hidden="true" viewBox="0 0 128 76"><g fill="none" stroke="#8e4a14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="m47 48-24 1-12 14m35-9-22 7-7 10m62-23 24 1 12 14m-35-9 22 7 7 10M41 42 22 33l-3-13m68 22 19-9 3-13"/></g><g fill="#ffae21" stroke="#8e4a14" stroke-width="2"><path class="claw" d="M22 33C4 31 3 12 17 4c-2 8 1 12 5 13l7-11c10 11 7 24-7 27Z"/><path class="claw" d="M106 33c18-2 19-21 5-29 2 8-1 12-5 13l-7-11c-10 11-7 24 7 27Z"/><ellipse cx="64" cy="48" rx="31" ry="21"/></g><g fill="#38271b"><path d="M53 33v-9m22 9v-9" stroke="#38271b" stroke-width="3"/><circle cx="53" cy="23" r="4"/><circle cx="75" cy="23" r="4"/></g><path d="M58 51q6 6 12 0" stroke="#78360b" stroke-width="2" fill="none"/></svg>';
const $=id=>document.getElementById(id);
const labels=['pairs','impairs'], endings=['0, 2, 4, 6 ou 8','1, 3, 5, 7 ou 9'];
const TOTAL=5;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeRounds(){
 const pools=[0,1].map(p=>shuffle(Array.from({length:490},(_,i)=>20+2*i+p)).slice(0,TOTAL*3));
 return Array.from({length:TOTAL},(_,i)=>shuffle(pools.flatMap(p=>p.slice(3*i,3*i+3))));
}
let mode,rounds,index,good,errors,found;
function update(){$('round').textContent='Traversée '+(index+1)+' / '+TOTAL;$('progress').textContent='Bons crabes : '+found+' / 3';$('score').textContent='Bonnes réponses : '+good+' · Erreurs : '+errors;}
function feedback(t,type=''){$('feedback').textContent=t;$('feedback').className='feedback '+type;}
function showRound(){
 found=0;$('next').hidden=true;$('crew').replaceChildren();$('scene').querySelectorAll('.traveler').forEach(el=>el.remove());
 $('instruction').textContent='Clique sur les nombres '+labels[mode]+'.';
 rounds[index].forEach(n=>{
  const b=document.createElement('button');b.type='button';b.className='crab';b.innerHTML='<span class="sign">'+n+'</span>'+icon;b.onclick=()=>choose(n,b);$('crew').append(b);
 });
 update();feedback('');
}
function travel(n,b){
 const scene=$('scene'),s=scene.getBoundingClientRect(),r=b.getBoundingClientRect(),x=(r.left+r.width/2-s.left)/s.width*100,y=(r.bottom-s.top)/s.height*100;
 const el=document.createElement('div');el.className='traveler';el.setAttribute('aria-hidden','true');el.innerHTML='<span class="sign">'+n+'</span>'+icon;el.style.left=x+'%';el.style.top=y+'%';scene.append(el);
