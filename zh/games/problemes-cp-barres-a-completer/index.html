$('check-bars').addEventListener('click',()=>{$('bars').classList.add('show-colors');let p=data[group].problems[index],v=models[index];if(v.some(x=>x===null)){$('bar-feedback').textContent="完成所有的栏杆。";$('bar-feedback').className='feedback err';return}if(v.every((x,i)=>x===expected(p)[i])){$('bar-feedback').textContent="好样的!你已经完成了酒吧!时 间";$('bar-feedback').className='feedback ok'}else{$('bar-feedback').textContent="这还不公平看看故事 再试一次!时 间";$('bar-feedback').className='feedback err'}});

function validateAnswer(){let input=$("答案"),raw=input.value.trim(),p=data[group].problems[index];if(!/^\d+$/.test(raw)){$('feedback').textContent="在盒子里写一个号码。";$('feedback').className='feedback err';input.className='answer bad';input.focus();return}let good=Number(raw)===p.answer;if(attempts[index]===null)attempts[index]=good;if(good){done[index]=true;input.className='answer good';$('feedback').className='feedback ok';$('feedback').textContent="好样的!你的回答是对的!时 间"}else{input.className='answer bad';$('feedback').className='feedback err';$('feedback').textContent="这还不是正确的答案你能做到的 再试一次!时 间";input.focus();input.select()}}
function next(){if(index<data[group].problems.length-1){index++;render()}else{let tested=attempts.filter(x=>x!==null).length,right=attempts.filter(x=>x===true).length;$("得分").textContent=(tested?Math.round(right/data[group].problems.length*100):0)+' %';$('score-detail').textContent=right+' bonne'+(right>1?'s':'')+" 答答"+(right>1?'s':'')+" 第一次测试 "+data[group].problems.length+" 应用题 "+(tested<data[group].problems.length?"未回答的问题占了总数。":'');show('result')}}
$('units').innerHTML=data.map((g,i)=>'<article class="unit"><div class="icon">'+g.icon+"</div><span class=\"eyebrow\">练习组 "+(i+1)+'</span><h3>'+g.title+'</h3><p>'+g.description+'</p><button class="btn" type="button" data-start="'+i+"\">开始游戏</button></article>").join('');document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>start(Number(b.dataset.start))));$('verify').addEventListener('click',validateAnswer);$('form').addEventListener('submit',e=>{e.preventDefault();validateAnswer()});$("答案").addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();validateAnswer()}});$("答案").addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));$("下一题").addEventListener('click',next);$("上一题").addEventListener('click',()=>{if(index>0){index--;render()}});$('go-home').addEventListener('click',menu);$('go-menu').addEventListener('click',menu);$('result-home').addEventListener('click',menu);$('replay').addEventListener('click',()=>start(group));$("听一听").addEventListener('click',()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('story').textContent+' '+$('question').textContent);u.lang='zh-CN';u.rate=.9;speechSynthesis.speak(u)}else{$('feedback').textContent="此设备上没有音频播放 。"}});
