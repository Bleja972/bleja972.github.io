<!doctype html>
<html lang="zh-Hans" translate="no" class="notranslate">
<head><base href="https://bejewelled-kataifi-9328a8.netlify.app/">
<meta charset="UTF-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b8fa3">
<title>数轴挑战</title>
<style>
:root{
  --ink:#17324d; --blue:#0b8fa3; --good:#2f9e44; --bad:#d94841;
  --cream:#fffaf0; --gold:#ffbf2f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{
  min-height:100vh;min-height:100dvh;
  background:linear-gradient(#c8efff 0 58%,#5dc6dc 58% 68%,#f3d998 68%);
  display:flex;justify-content:center
}
.app{
  width:100%;max-width:820px;min-height:100vh;min-height:100dvh;
  background:rgba(255,255,255,.95);display:flex;flex-direction:column
}
header{
  text-align:center;padding:13px 14px 10px;
  background:linear-gradient(90deg,#fff6c9,#e4fbff);border-bottom:3px solid white
}
.school{font-weight:900;color:#086a74;font-size:clamp(16px,4vw,21px)}
h1{margin:4px 0 0;color:var(--blue);font-size:clamp(28px,7vw,45px)}
.screen{display:none;flex:1}
.screen.active{display:flex;flex-direction:column}
.home{justify-content:center;padding:20px;text-align:center}
.card{
  background:#ffd18a;border-radius:28px;padding:22px 18px;
  box-shadow:0 12px 30px rgba(0,0,0,.12)
}
.hero{font-size:60px}
.intro{font-size:19px;font-weight:800;line-height:1.4}
.nameInput{
  width:100%;border:3px solid #98dde6;border-radius:17px;text-align:center;
  padding:14px;font-size:24px;outline:none;margin:7px 0 14px
}
.levels{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0 16px}
.levelBtn{
  border:3px solid transparent;border-radius:18px;background:#ffd18a;
  padding:15px;font-size:20px;font-weight:900;cursor:pointer
}
.levelBtn.selected{border-color:var(--blue);background:#dff8fb}
.startBtn,.actionBtn,.tickBtn{
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer
}
.startBtn{
  width:100%;min-height:66px;border:0;border-radius:20px;background:var(--blue);
  color:white;font-size:clamp(23px,6vw,31px);font-weight:900;box-shadow:0 7px 0 #076d79
}
.game{padding:10px 14px 16px}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{
  background:#ffd18a;border-radius:16px;text-align:center;padding:10px 4px;
  font-weight:900;box-shadow:0 5px 12px rgba(0,0,0,.06)
}
.progress{height:12px;background:#e7eef0;border-radius:999px;overflow:hidden;margin-bottom:14px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#55c3da,#2f9e44);transition:width .3s}
.challenge{
  background:var(--cream);border:4px solid white;border-radius:26px;
  padding:20px 12px;box-shadow:0 9px 20px rgba(0,0,0,.10)
}
.prompt{text-align:center;font-size:21px;font-weight:900}
.target{
  text-align:center;font-size:clamp(50px,14vw,78px);font-weight:900;
  color:#0b7180;margin:4px 0 18px
}
.lineCard{
  background:#ffd18a;border-radius:22px;padding:28px 12px 20px;
  box-shadow:inset 0 0 0 2px #edf3f5;
  overflow-x:auto
}
.numberLine{
  min-width:560px;
  display:grid;
  align-items:start;
  position:relative;
  padding:0 12px;
}
.lineTrack{
  height:8px;background:#17324d;border-radius:999px;
  position:absolute;left:28px;right:28px;top:24px
}
.ticks{
  display:grid;grid-template-columns:repeat(11,1fr);
  position:relative;z-index:2
}
.tickCol{
  display:flex;flex-direction:column;align-items:center;min-width:0
}
.tickBtn{
  width:44px;height:52px;border:0;background:transparent;position:relative;
  display:flex;align-items:flex-start;justify-content:center;padding:0
}
.tickMark{
  width:4px;height:26px;background:#17324d;border-radius:3px;
  transition:.15s
}
.tickBtn:hover .tickMark{height:34px;background:#0b8fa3}
.tickBtn.selected .tickMark{height:40px;background:#ff9800}
.tickBtn.correct .tickMark{height:42px;background:var(--good);width:7px}
.tickBtn.wrong .tickMark{height:42px;background:var(--bad);width:7px}
.tickLabel{
  min-height:44px;
  margin-top:4px;
  font-size:0;
  color:transparent;
}
.tickLabel.blank{color:transparent}

.tickLabel.endpoint{
  min-height:72px;
  width:72px;
  height:72px;
  margin-top:8px;
  font-size:24px;
  font-weight:900;
  color:#17324d;
  background:#ffd18a;
  border:3px solid #67bfd2;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(45deg);
  border-radius:10px;
  box-shadow:0 6px 14px rgba(0,0,0,.08);
}
.tickLabel.endpoint span{
  transform:rotate(-45deg);
  display:block;
}
.selectedText{
  text-align:center;font-size:20px;font-weight:900;min-height:32px;margin-top:12px
}
.hintBox{
  display:none;margin:14px auto 0;max-width:590px;background:#ffd18a;border-radius:16px;
  padding:12px;text-align:center;font-size:19px;font-weight:800;border:2px dashed #e0bf58
}
.actions{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
  max-width:520px;margin:14px auto 0
}
.actionBtn{
  border:0;border-radius:16px;min-height:54px;font-size:18px;font-weight:900
}
.hint{background:#fff0b8;color:#725000}
.check{background:var(--blue);color:white}
.next{background:#2f9e44;color:white;display:none}
.feedback{min-height:52px;text-align:center;font-size:22px;font-weight:900;margin-top:10px}
.end{justify-content:center;text-align:center;padding:20px}
.stars{font-size:48px}.end h2{font-size:37px;margin:6px 0}.end p{font-size:20px;font-weight:800}
.endBtns{display:grid;gap:9px}
.secondary{
  border:3px solid #b7e1e6;border-radius:17px;padding:13px;background:#ffd18a;
  font-size:18px;font-weight:900;cursor:pointer
}
@media(min-width:650px){
  .levels{grid-template-columns:repeat(4,1fr)}
  .app{box-shadow:0 0 35px rgba(0,0,0,.16)}
}
</style>

<body><nav aria-label="英语游戏" style="display:flex;justify-content:center;padding:10px;background:#173f30"><a href="/zh/?lang=zh" style="padding:10px 18px;border-radius:12px;background:#fff6cf;color:#173f30;text-decoration:none;font:bold 17px Arial,sans-serif">所有游戏</a></nav>
<div class="app">
<header>
  <div class="school">埃米尔纳贝蒂学校</div>
  <h1>数轴挑战</h1>
</header>

<section id="home" class="screen active home">
  <div class="card">
    <div class="hero">📍 ───── 🔢</div>
    <p class="intro">看看这两个贴有标签的数字,然后放上要求的号码。数字可以高达1000。等级使用1、2、5和10级的步数。</p>
    <input id="name" class="nameInput" maxlength="18" placeholder="我姓我的名字">
    <div class="levels">
      <button class="levelBtn selected" data-level="1">1级1级</button>
      <button class="levelBtn" data-level="2">2级2级</button>
      <button class="levelBtn" data-level="3">3级</button>
      <button class="levelBtn" data-level="4">4级</button>
    </div>
    <button id="startBtn" class="startBtn">开始</button>
  </div>
</section>

<section id="game" class="screen game">
  <div class="top">
    <div class="stat">得分<br><span id="score">0</span>/10</div>
    <div class="stat">問題<br><span id="qnum">1</span>/10</div>
    <div class="stat"> ⁇   ⁇ <br><span id="streak">0</span></div>
  </div>

  <div class="progress"><div id="bar" class="bar"></div></div>

  <div class="challenge">
    <div class="prompt">将此数字放在数字行上:</div>
    <div id="target" class="target">14</div>

    <div class="lineCard">
      <div class="numberLine">
        <div class="lineTrack"></div>
        <div id="ticks" class="ticks"></div>
      </div>
    </div>

    <div id="selectedText" class="selectedText">单击数字所属的选项。</div>
    <div id="hintBox" class="hintBox"></div>

    <div class="actions">
      <button id="hintBtn" type="button" class="actionBtn hint">提示</button>
      <button id="checkBtn" type="button" class="actionBtn check">检查答案</button>
      <button id="nextBtn" type="button" class="actionBtn next">下一题</button>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>
</section>

<section id="end" class="screen end">
  <div id="stars" class="stars">⭐⭐⭐</div>
  <h2 id="endTitle">真棒！</h2>
  <p id="endText"></p>
  <div class="endBtns">
    <button class="startBtn" id="replayBtn">再玩一次</button>
    <button class="secondary" id="homeBtn">变化水平</button>
  </div>
<div class="decouvrir-autre-jeu"><strong>准备好再玩一场了吗?</strong><span>谜号线</span><a href="/zh/games/la-droite-graduee-mystere/">发现此游戏  ⁇ </a></div></section>
</div>

<script>function enNumber(n){n=Number(n);const d=['零','一','二','三','四','五','六','七','八','九'];if(n<0)return '负'+enNumber(-n);if(n<10)return d[n];if(n<100)return (n<20?'':d[Math.floor(n/10)])+'十'+(n%10?d[n%10]:'');if(n<1000)return d[Math.floor(n/100)]+'百'+(n%100?(n%100<10?'零':'')+enNumber(n%100):'');if(n===1000)return '一千';return String(n)}

const TOTAL=10;
let level=1, score=0, streak=0, qIndex=0, player="冠军";
let start=0, step=1, target=0, targetIndex=0, selectedIndex=null, locked=false;

const $=id=>document.getElementById(id);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}

document.querySelectorAll(".levelBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".levelBtn").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    level=Number(btn.dataset.level);
  });
});

function randomInt(min,max){
  return min+Math.floor(Math.random()*(max-min+1));
}

function makeQuestion(){
  if(level===1){
    step=1;
    start=randomInt(0,989);
  }else if(level===2){
    step=2;
    start=randomInt(0,978);
    start=start-(start%2);
  }else if(level===3){
    step=5;
    start=randomInt(0,945);
    start=start-(start%5);
  }else{
    step=10;
    start=randomInt(0,890);
    start=start-(start%10);
  }

  // 11 graduations, target always between the two endpoints
  // and the end of the line never exceeds 1000.
  targetIndex=randomInt(1,9);
  target=start+(targetIndex*step);
}

function renderLine(){
  const ticks=$("ticks");
  ticks.innerHTML="";

  for(let i=0;i<=10;i++){
    const col=document.createElement("div");
    col.className="tickCol";

    const btn=document.createElement("button");
    btn.type="button";
    btn.className="tickBtn";
    btn.dataset.index=i;
    btn.setAttribute("aria-label","毕业 "+i);

    const mark=document.createElement("div");
    mark.className="tickMark";
    btn.appendChild(mark);

    const label=document.createElement("div");
    const value = start + (i*step);

    if(i===0 || i===10){
      label.className="tickLabel endpoint";
      const inner=document.createElement("span");
      inner.textContent=value;
      label.appendChild(inner);
    } else {
      label.className="tickLabel blank";
      label.textContent="";
    }

    btn.addEventListener("click",()=>{
      if(locked) return;
      selectedIndex=i;
      document.querySelectorAll(".tickBtn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      $("selectedText").textContent="您选中了此选项 。";
    });

    col.appendChild(btn);
    col.appendChild(label);
    ticks.appendChild(col);
  }
}

function startGame(){
  player=$("name").value.trim()||player||"冠军";
  score=0;streak=0;qIndex=0;
  $("得分").textContent=0;
  $("streak").textContent=0;
  show("game");
  newQuestion();
}

function newQuestion(){
  locked=false;
  selectedIndex=null;
  makeQuestion();
  renderLine();

  $("target").textContent=target;
  $("qnum").textContent=qIndex+1;
  $("bar").style.width=(qIndex/TOTAL*100)+"%";
  $("selectedText").textContent="单击一滴。";
  $("feedback").textContent="";
  $("hintBox").style.display="none";
  $("checkBtn").style.display="block";
  $("nextBtn").style.display="none";
}

$("hintBtn").addEventListener("click",()=>{
  if(locked) return;
  const end=start+10*step;
  $("hintBox").textContent="数字行取自 "+start+" to "+end+"每一刻数增加 "+step+".";
  $("hintBox").style.display="block";
});

$("checkBtn").addEventListener("click",()=>{
  if(locked) return;
  if(selectedIndex===null){
    $("feedback").textContent="请先点击一个滴答。";
    return;
  }

  locked=true;
  const buttons=[...document.querySelectorAll(".tickBtn")];
  const ok=selectedIndex===targetIndex;

  buttons.forEach(btn=>{
    btn.disabled=true;
    const idx=Number(btn.dataset.index);
    if(idx===targetIndex) btn.classList.add("correct");
    if(idx===selectedIndex && !ok) btn.classList.add("wrong");
  });

  if(ok){
    score++;streak++;
    $("feedback").textContent="真棒！ "+target+" 确是在正确的地方。";
    beep(720,.12);
  }else{
    streak=0;
    $("feedback").textContent="Look at the green tick: 那就是你应该放置的地方 "+target+".";
    beep(220,.18);
  }

  $("得分").textContent=score;
  $("streak").textContent=streak;
  $("checkBtn").style.display="none";
  $("nextBtn").style.display="block";
  qIndex++;
  $("bar").style.width=(qIndex/TOTAL*100)+"%";
});

$("nextBtn").addEventListener("click",()=>{
  if(qIndex>=TOTAL) finish();
  else newQuestion();
});

function finish(){
  show("end");
  $("endText").textContent=player+",您正确的位置 "+score+" number"+(score===1?"":"s")+" 10个中";
  if(score===10){
    $("stars").textContent="⭐⭐⭐";
    $("endTitle").textContent="数字队冠军!";
  }else if(score>=7){
    $("stars").textContent="⭐⭐";
    $("endTitle").textContent="干得不错!";
  }else{
    $("stars").textContent="⭐";
    $("endTitle").textContent="继续走,你进步了!";
  }
}

function beep(freq,dur){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.frequency.value=freq;gain.gain.value=.04;
    osc.connect(gain);gain.connect(ctx.destination);osc.start();
    setTimeout(()=>{osc.stop();ctx.close()},dur*1000);
  }catch(e){}
}

$("startBtn").addEventListener("click",startGame);
$("replayBtn").addEventListener("click",startGame);
$("homeBtn").addEventListener("click",()=>show("首页"));
</script>
