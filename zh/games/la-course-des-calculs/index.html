<!doctype html>
<html lang="zh-Hans" translate="no" class="notranslate">
<head><base href="https://bleja972.github.io/HJDZGHJ/">
<meta charset="UTF-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算赛跑</title>
<style>
  :root{
    --bleu-ciel:#82dcff;
    --bleu-ciel2:#dff7ff;
    --mer1:#22c7d9;
    --mer2:#1599c7;
    --sable1:#ffd88b;
    --sable2:#ffc766;
    --vert:#1f9f5c;
    --vert2:#49c774;
    --rouge:#e95e54;
    --jaune:#ffd84d;
    --violet:#8d66da;
    --brun:#6e4b2c;
    --ombre:0 12px 30px rgba(0,0,0,.18);
    --texte:#17324b;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: "Trebuchet MS", Arial, sans-serif;
    color:var(--texte);
    background: linear-gradient(180deg, #a6ecff 0%, #fff2bf 100%);
  }

  .app{
    max-width:1200px;
    margin:0 auto;
    padding:12px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }

  .title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:1.35rem;
    font-weight:900;
    color:#0f4368;
    text-shadow:0 2px 0 rgba(255,255,255,.7);
  }

  .badge-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .badge{
    background:linear-gradient(180deg, #ffffff, #eefaff);
    border:2px solid rgba(15,67,104,.15);
    border-radius:18px;
    padding:8px 14px;
    font-weight:900;
    box-shadow:0 6px 16px rgba(10,80,110,.08);
    min-width:110px;
    text-align:center;
  }

  .game{
    position:relative;
    height:760px;
    overflow:hidden;
    border-radius:28px;
    border:4px solid rgba(255,255,255,.95);
    box-shadow:var(--ombre);
    background:
      linear-gradient(180deg,var(--bleu-ciel2) 0%,var(--bleu-ciel) 33%, #78d0f6 34%, #68d9ea 35%, var(--mer1) 46%, var(--mer2) 61%, var(--sable1) 62%, var(--sable2) 100%);
  }

  /* BACKGROUND */
  .sun{
    position:absolute;
    top:38px;
    right:86px;
    width:92px;
    height:92px;
    border-radius:50%;
    background:radial-gradient(circle, #fff9d9 0 26%, #ffe676 27% 58%, rgba(255,230,118,.18) 59% 100%);
    box-shadow:0 0 36px rgba(255,225,92,.9);
    animation:sunGlow 3s ease-in-out infinite;
    z-index:1;
  }
  @keyframes sunGlow{
    50%{transform:scale(1.06); box-shadow:0 0 54px rgba(255,225,92,1)}
  }

  .cloud{
    position:absolute;
    background:rgba(255,255,255,.95);
    border-radius:40px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.08));
    z-index:1;
    animation:floatCloud 18s linear infinite;
  }
  .cloud::before,.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
  }
  .cloud::before{width:46px;height:46px;left:10px;top:-20px}
  .cloud::after{width:58px;height:58px;right:10px;top:-28px}
  .c1{width:130px;height:42px;left:60px;top:72px}
  .c2{width:150px;height:46px;left:320px;top:122px; animation-duration:23s}
  .c3{width:120px;height:38px;right:230px;top:136px; animation-duration:20s}
  @keyframes floatCloud{
    0%{transform:translateX(0)}
    50%{transform:translateX(18px)}
    100%{transform:translateX(0)}
  }

  .mount{
    position:absolute;
    bottom:300px;
    z-index:1;
  }
  .mount.one{
    left:40px;
    width:320px;
    height:180px;
    background:linear-gradient(180deg,#53b96d,#2f8f55);
    clip-path:polygon(0 100%, 18% 70%, 33% 76%, 52% 18%, 70% 78%, 100% 100%);
  }
  .mount.two{
    right:110px;
    width:330px;
    height:220px;
    background:linear-gradient(180deg,#4ab162,#2d7f4b);
    clip-path:polygon(0 100%, 18% 70%, 40% 12%, 61% 76%, 82% 68%, 100% 100%);
  }
  .mount.two::after{
    content:"";
    position:absolute;
    top:26px; left:127px;
    width:76px; height:24px;
    background:rgba(255,255,255,.95);
    border-radius:40px;
  }

  .village{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:278px;
    display:flex;
    align-items:flex-end;
    gap:18px;
    z-index:2;
  }
  .hut{
    width:58px;height:46px;
    background:#fff8ed;
    border:3px solid #c28a4a;
    border-bottom-width:5px;
    position:relative;
    border-radius:5px;
  }
  .hut::before{
    content:"";
    position:absolute;
    left:-6px; right:-6px; top:-28px;
    height:30px;
    background:linear-gradient(180deg,#bf674d,#a84732);
    clip-path:polygon(50% 0,100% 100%,0 100%);
    border-radius:6px 6px 0 0;
  }
  .hut::after{
    content:"";
    position:absolute;
    left:21px; bottom:0;
    width:14px; height:22px;
    background:#8f6236;
    border-radius:3px 3px 0 0;
  }

  .palm{
    position:absolute;
    z-index:2;
  }
  .palm .trunk{
    position:absolute;
    width:16px;
    height:110px;
    background:linear-gradient(180deg,#a56c3e,#7a4d2b);
    border-radius:10px;
    transform:skew(-8deg);
    bottom:0; left:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.1);
  }
  .palm .leaf{
    position:absolute;
    width:78px;height:20px;
    background:linear-gradient(180deg,#41cc73,#199954);
    border-radius:100px 0 100px 0;
    transform-origin:left center;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }
  .palm.left{left:40px; bottom:240px}
  .palm.right{right:50px; bottom:250px}
  .palm .l1{left:-8px; top:-10px; transform:rotate(-35deg)}
  .palm .l2{left:-6px; top:6px; transform:rotate(-5deg)}
  .palm .l3{left:-4px; top:22px; transform:rotate(24deg)}
  .palm .l4{left:-2px; top:38px; transform:rotate(52deg)}
  .palm .l5{left:-8px; top:7px; transform:scaleX(-1) rotate(10deg)}

  .sea-wave{
    position:absolute;
    left:0; right:0; bottom:275px;
    height:28px;
    z-index:3;
    background:
      radial-gradient(circle at 20px 25px, rgba(255,255,255,.9) 0 15px, transparent 16px) 0 0/60px 28px repeat-x,
      linear-gradient(180deg,#75f6ff,#39cce4);
    opacity:.95;
  }

  .sand-strip{
    position:absolute;
    left:0; right:0; bottom:190px;
    height:90px;
    background:linear-gradient(180deg, #ffe7a6 0%, #ffd16f 100%);
    z-index:2;
  }

  .flowers{
    position:absolute;
    inset:auto 0 170px 0;
    height:50px;
    z-index:2;
    background:
      radial-gradient(circle at 6% 70%, #ff6398 0 8px, transparent 9px),
      radial-gradient(circle at 16% 70%, #ffad3c 0 8px, transparent 9px),
      radial-gradient(circle at 26% 70%, #ef4fff 0 8px, transparent 9px),
      radial-gradient(circle at 71% 70%, #ff6398 0 8px, transparent 9px),
      radial-gradient(circle at 82% 70%, #ffad3c 0 8px, transparent 9px),
      radial-gradient(circle at 92% 70%, #ef4fff 0 8px, transparent 9px);
  }

  /* OPERATIONS */
  .operation{
    position:absolute;
    transform:translateX(-50%);
    padding:12px 18px;
    min-width:176px;
    text-align:center;
    border-radius:22px;
    background:linear-gradient(180deg,#fffaf2,#ffe6a8);
    border:3px solid #f3c155;
    box-shadow:0 10px 22px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.7);
    font-size:2.05rem;
    font-weight:900;
    color:#8f5800;
    text-shadow:0 2px 0 rgba(255,255,255,.6);
    z-index:20;
  }
  .operation::before{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:28px;
    border:2px dashed rgba(255,255,255,.45);
    pointer-events:none;
  }
  .operation.danger{
    background:linear-gradient(180deg,#fff2f2,#ffd1cc);
    border-color:#ef786e;
    color:#b23c34;
    animation:shake .45s linear infinite;
  }
  @keyframes shake{
    0%,100%{transform:translateX(-50%) rotate(0deg)}
    25%{transform:translateX(calc(-50% - 2px)) rotate(-1deg)}
    75%{transform:translateX(calc(-50% + 2px)) rotate(1deg)}
  }

  /* GROUND */
  .pit{
    position:absolute;
    left:0; right:0; bottom:126px;
    height:28px;
    background:
      linear-gradient(-45deg, #381e16 16px, transparent 0) 0 0/28px 28px repeat-x,
      linear-gradient(45deg, #381e16 16px, transparent 0) 14px 0/28px 28px repeat-x;
    z-index:7;
  }
  .floor{
    position:absolute;
    left:0; right:0; bottom:0;
    height:126px;
    background:linear-gradient(180deg,#4f2e1b,#2d180f);
    z-index:6;
    border-top:6px solid #7e4a25;
  }

  .dock{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:18px;
    width:min(92%,700px);
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .dock-label{
    background:rgba(255,255,255,.18);
    color:#fff8e5;
    border:2px solid rgba(255,255,255,.32);
    padding:12px 14px;
    border-radius:16px;
    font-weight:900;
    font-size:1.05rem;
    white-space:nowrap;
  }
  .answer{
    width:min(240px,45vw);
    height:62px;
    border:none;
    border-radius:18px;
    font-size:2rem;
    font-weight:900;
    text-align:center;
    color:#7d2f00;
    background:#ffffff;
    box-shadow:0 8px 20px rgba(0,0,0,.18), inset 0 0 0 3px #ffd470;
    outline:none;
  }
  .answer:focus{box-shadow:0 0 0 4px rgba(255,222,111,.5), 0 8px 20px rgba(0,0,0,.18)}

  /* Race panel */
  .racePanel{
    position:absolute;
    left:18px;
    bottom:138px;
    width:330px;
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,246,221,.94));
    border:3px solid rgba(255,255,255,.9);
    border-radius:24px;
    padding:12px 14px;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
    z-index:35;
  }
  .lane{position:relative;height:64px;margin-top:8px}
  .track{
    position:absolute;left:54px;right:16px;top:34px;height:8px;border-radius:999px;
    background:linear-gradient(90deg,#62cfff,#1ea6e1);
  }
  .track.pink{background:linear-gradient(90deg,#ff5bc3,#cf1d87)}
  .flag{
    position:absolute;right:6px;top:18px;width:12px;height:30px;background:#68411f;border-radius:3px;
  }
  .flag::after{
    content:"";position:absolute;left:10px;top:1px;width:18px;height:12px;
    background:#ff4b4b;clip-path:polygon(0 0,100% 25%,0 100%);
    border-radius:2px;
  }
  .runner{
    position:absolute;left:54px;top:6px;font-size:2.2rem;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.22));
    transition:left .35s ease;
  }
  .runner.jump{animation:jump .35s ease}
  @keyframes jump{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
  }
  .laneLabel{
    position:absolute;left:0;top:22px;width:48px;text-align:center;font-size:1.65rem;
  }

  .feedback{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:92px;
    min-height:30px;
    font-size:1.25rem;
    font-weight:900;
    color:#fff8e2;
    text-shadow:0 2px 6px rgba(0,0,0,.35);
    z-index:45;
  }
  .good{color:#e6ffe8}
  .bad{color:#ffe1de}

  .controls{
    position:absolute;
    left:16px; top:16px;
    display:flex; gap:10px; z-index:60;
  }
  .btnIcon{
    width:62px;height:62px;border:none;border-radius:18px;cursor:pointer;
    font-size:1.9rem;font-weight:900;color:white;
    box-shadow:0 10px 20px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.28);
  }
  .red{background:linear-gradient(180deg,#ff726c,#da3e38)}
  .orange{background:linear-gradient(180deg,#ffcb71,#f1981b)}
  .blue{background:linear-gradient(180deg,#76dbff,#26abe5)}
  .green{background:linear-gradient(180deg,#78e18d,#28ad55)}

  .overlay{
    position:absolute; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(17,83,118,.40), rgba(10,33,55,.52));
    padding:18px;
  }
  .card{
    width:min(92%,680px);
    background:linear-gradient(180deg,#fffef8,#fff2cf);
    border:4px solid white;
    border-radius:30px;
    padding:26px;
    box-shadow:0 18px 38px rgba(0,0,0,.28);
    text-align:center;
  }
  .card h1,.card h2{
    margin:0 0 10px 0;
    color:#0e4f73;
    font-size:2.1rem;
  }
  .card p{
    font-size:1.08rem;
    line-height:1.5;
    margin:10px 0;
  }
  .startBtn{
    margin-top:12px;
    padding:16px 28px;
    border:none; border-radius:18px;
    background:linear-gradient(180deg,#67de83,#1fa455);
    color:white; font-size:1.25rem; font-weight:900;
    cursor:pointer; box-shadow:0 10px 22px rgba(0,0,0,.18);
  }
  .medal{
    font-size:4.5rem;
    margin:6px 0;
  }
  .hidden{display:none!important}

  .spark{
    position:absolute;
    width:10px;height:10px;border-radius:50%;
    background:#fff7b6;
    opacity:.7;
    box-shadow:0 0 14px rgba(255,247,182,.95);
    animation:twinkle 2.8s ease-in-out infinite;
    z-index:4;
  }
  @keyframes twinkle{
    50%{transform:scale(1.7);opacity:1}
  }

  @media (max-width: 820px){
    .game{height:820px}
    .operation{font-size:1.6rem; min-width:140px}
    .racePanel{width:280px}
    .dock{flex-direction:column}
    .dock-label{white-space:normal;text-align:center}
  }

  /* GRAPHISMES RENFORCÉS */
  .game{
    background:
      radial-gradient(circle at 78% 10%, rgba(255,255,255,.34) 0 3%, transparent 4%),
      linear-gradient(180deg,#bff4ff 0%,#79ddff 30%,#58cef0 38%,#26b8d3 48%,#158eb9 60%,#ffe7a0 61%,#f6c75f 100%);
  }

  .game::before{
    content:"";
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      linear-gradient(180deg,rgba(255,255,255,.12),transparent 34%),
      radial-gradient(circle at 50% 56%,rgba(255,255,255,.16),transparent 34%);
  }

  .sea-wave{
    height:34px;
    background:
      radial-gradient(ellipse at 25px 26px,rgba(255,255,255,.96) 0 11px,transparent 12px) 0 0/72px 34px repeat-x,
      linear-gradient(180deg,#8ff9ff,#29c3df);
    filter:drop-shadow(0 4px 4px rgba(0,85,120,.12));
    animation:waterMove 3.4s ease-in-out infinite alternate;
  }
  @keyframes waterMove{to{transform:translateX(18px)}}

  .sand-strip{
    background:
      radial-gradient(circle at 12% 35%,rgba(255,255,255,.22) 0 2px,transparent 3px),
      radial-gradient(circle at 43% 62%,rgba(180,120,50,.12) 0 2px,transparent 3px),
      linear-gradient(180deg,#ffe7a3,#f7cb69);
    background-size:90px 60px,110px 70px,auto;
  }

  .mount.one,.mount.two{
    filter:drop-shadow(0 10px 14px rgba(0,70,70,.14));
  }
  .mount.one{
    background:linear-gradient(180deg,#75cf7d 0%,#3fa860 52%,#2a7d4e 100%);
  }
  .mount.two{
    background:linear-gradient(180deg,#6bca76 0%,#379c59 52%,#236f48 100%);
  }

  .village{
    filter:drop-shadow(0 6px 7px rgba(0,0,0,.12));
  }
  .hut{
    box-shadow:inset 0 -5px 0 rgba(140,90,40,.08);
  }

  .palm .trunk{
    background:repeating-linear-gradient(180deg,#b77c45 0 11px,#935d32 11px 16px);
    box-shadow:inset -4px 0 0 rgba(70,35,10,.12);
  }
  .palm .leaf{
    background:linear-gradient(180deg,#65d77f,#189750);
    box-shadow:inset 0 -3px 0 rgba(0,90,40,.12);
  }

  .flowers{
    height:58px;
    background:
      radial-gradient(circle at 5% 70%,#ff527f 0 8px,#ffd0dc 9px 11px,transparent 12px),
      radial-gradient(circle at 16% 70%,#ff9d2d 0 8px,#ffe0a3 9px 11px,transparent 12px),
      radial-gradient(circle at 27% 70%,#d957ff 0 8px,#efc4ff 9px 11px,transparent 12px),
      radial-gradient(circle at 71% 70%,#ff527f 0 8px,#ffd0dc 9px 11px,transparent 12px),
      radial-gradient(circle at 82% 70%,#ff9d2d 0 8px,#ffe0a3 9px 11px,transparent 12px),
      radial-gradient(circle at 93% 70%,#d957ff 0 8px,#efc4ff 9px 11px,transparent 12px);
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.12));
  }

  .operation{
    background:linear-gradient(180deg,#fffef8 0%,#fff1be 100%);
    border:3px solid #f0b935;
    box-shadow:
      0 12px 22px rgba(78,50,0,.20),
      inset 0 3px 0 rgba(255,255,255,.85),
      inset 0 -4px 0 rgba(223,156,35,.10);
    color:#8b5200;
    border-radius:24px;
  }
  .operation::after{
    content:"";
    position:absolute; left:16px; right:16px; top:5px; height:8px;
    border-radius:999px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  }
  .operation.danger{
    background:linear-gradient(180deg,#fff5f4,#ffcbc6);
    border-color:#eb6a5f;
    box-shadow:0 12px 22px rgba(120,20,10,.22), inset 0 3px 0 rgba(255,255,255,.78);
  }

  .racePanel{
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,245,213,.96));
    border:3px solid rgba(255,255,255,.95);
    box-shadow:0 12px 26px rgba(24,58,65,.18);
  }
  .track{
    box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.12);
  }
  .runner{
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.24));
  }

  .dock-label{
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.10));
    border:2px solid rgba(255,255,255,.42);
    box-shadow:0 7px 18px rgba(0,0,0,.14);
    backdrop-filter:blur(6px);
  }
  .answer{
    background:linear-gradient(180deg,#fff,#fff9e8);
    box-shadow:0 10px 22px rgba(0,0,0,.20), inset 0 0 0 4px #ffd972;
  }

  .badge{
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(232,248,255,.97));
    border:2px solid rgba(12,80,120,.12);
    box-shadow:0 7px 18px rgba(15,80,110,.11);
  }

  .card{
    background:linear-gradient(180deg,#fffefb,#fff3ce);
    border:4px solid rgba(255,255,255,.98);
    box-shadow:0 20px 44px rgba(0,0,0,.28);
  }

  .startBtn{
    background:linear-gradient(180deg,#78e997,#22aa59);
    box-shadow:0 11px 24px rgba(19,120,60,.28), inset 0 2px 0 rgba(255,255,255,.32);
    transition:transform .15s ease, filter .15s ease;
  }
  .startBtn:hover{transform:translateY(-2px);filter:brightness(1.04)}

  .btnIcon{
    transition:transform .15s ease, filter .15s ease;
  }
  .btnIcon:hover{transform:translateY(-2px);filter:brightness(1.05)}

  .speedHint{
    position:absolute;
    right:18px;
    top:18px;
    z-index:65;
    padding:8px 12px;
    border-radius:14px;
    background:rgba(255,255,255,.82);
    border:2px solid rgba(255,255,255,.9);
    font-weight:900;
    color:#14516f;
    box-shadow:0 7px 18px rgba(15,80,110,.11);
  }


  .speedHint.goldMode{
    background:linear-gradient(180deg,#fff8c8,#ffd84d);
    color:#7a5200;
    border-color:#fff3a0;
    box-shadow:0 8px 20px rgba(190,140,0,.20);
  }

</style>
</head>
<body>
<nav id="ce1-blog-navigation" aria-label="所有游戏" style="position:relative;z-index:1000;display:flex;justify-content:center;padding:10px 14px;background:#173f30"><a href="/zh/?lang=zh" target="_top" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;background:#fff6cf;color:#173f30;font:700 17px/1.3 system-ui,sans-serif;text-decoration:none;min-height:46px;box-shadow:0 2px 5px #0002">查看所有游戏</a></nav>

<div class="app">
  <div class="topbar">
    <div class="title">• 计算种族</div>
    <div class="badge-row">
      <div class="badge" id="score">分数:0</div>
      <div class="badge" id="lives">生命:</div>
      <div class="badge" id="level">速度:1</div>
    </div>
  </div>

  <div class="game" id="game">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mount one"></div>
    <div class="mount two"></div>
    <div class="sea-wave"></div>
    <div class="sand-strip"></div>
    <div class="flowers"></div>

    <div class="village">
      <div class="hut"></div>
      <div class="hut" style="transform:scale(1.08)"></div>
      <div class="hut"></div>
    </div>

    <div class="palm left">
      <div class="trunk"></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="leaf l5"></div>
    </div>
    <div class="palm right">
      <div class="trunk"></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="leaf l5"></div>
    </div>

    <div class="spark" style="left:8%;top:18%"></div>
    <div class="spark" style="left:18%;top:45%;animation-delay:.4s"></div>
    <div class="spark" style="left:72%;top:16%;animation-delay:1s"></div>
    <div class="spark" style="left:82%;top:53%;animation-delay:1.5s"></div>
    <div class="spark" style="left:50%;top:9%;animation-delay:.8s"></div>

    <div class="speedHint" id="speedHint">轻缓开始</div>

    <div class="controls">
      <button class="btnIcon red" id="quitBtn" title="重新开始">✕</button>
      <button class="btnIcon blue" id="pauseBtn" title="暂停">❚❚</button>
    </div>

    <div class="racePanel">
      <strong>种族 种族 种族</strong>
      <div class="lane">
        <div class="laneLabel">🐦</div>
        <div class="track"></div>
        <div class="flag"></div>
        <div class="runner" id="player">🐦</div>
      </div>
      <div class="lane">
        <div class="laneLabel">🦎</div>
        <div class="track pink"></div>
        <div class="flag"></div>
        <div class="runner" id="rival">🦎</div>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="pit"></div>
    <div class="floor"></div>

    <div class="dock">
      <div class="dock-label">在计算到达地面之前先输入答案 。</div>
      <input class="answer" id="answer" type="number" inputmode="numeric" autocomplete="off">
    </div>

    <div class="overlay" id="startCover">
      <div class="card">
        <h1>计算赛跑</h1>
        <p><strong>目标:</strong> 数项计算同时下降。键入正确答案,使一个消失。</p>
        <p>计算做法: <strong>双倍,近近两倍,数字债券到10,债券到10,债券到下一个10,加上整几十个</strong>.</p>
        <p>每一个正确的答案都会把你的鸟推向前进如果计算到达地面,蜥蜴向前移动。游戏开始缓慢,逐渐加速。</p>
        <p><strong>勋章:</strong> 铜质解答最多6个正确答案,银质解答7到11,金质解答12,或者你到达终点。</p>
        <p>一旦你挣了 <strong>金金奖章</strong>,计算速度更快地下降 并看起来更接近在一起。</p>
        <button class="startBtn" id="startBtn">开始</button>
      </div>
    </div>

    <div class="overlay hidden" id="endCard">
      <div class="card">
        <h2>游戏结束</h2>
        <div class="medal" id="medal">🥉</div>
        <div style="font-size:2rem;font-weight:900;color:#c05713" id="medalText">铜牌</div>
        <p id="finalText">分数:0</p>
        <button class="startBtn" id="againBtn">再玩一次</button>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
  const $ = id => document.getElementById(id);

  let score = 0;
  let lives = 3;
  let speedLevel = 1;
  let round = 0;
  let running = false;
  let paused = false;
  let active = [];
  let spawnTimer = 0;
  let last = 0;
  let raf = 0;
  let playerProgress = 0;
  let rivalProgress = 0;
  let nextId = 1;

  const MAX_ROUNDS = 28;
  const MAX_ACTIVE = 4;

  function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

  function makeOperation(){
    const type = rnd(1,5);

    // 1. Doubles : 2+2, 3+3 ... 9+9
    if(type === 1){
      const a = rnd(1,9);
      return { text:`${a} + ${a} =`, ans:a+a, skill:"双双" };
    }

    // 2. Presque doubles : n + (n+1) ou (n+1) + n
    if(type === 2){
      const a = rnd(1,8);
      const b = a + 1;
      if(Math.random() < .5){
        return { text:`${a} + ${b} =`, ans:a+b, skill:"近近双双" };
      }
      return { text:`${b} + ${a} =`, ans:a+b, skill:"近近双双" };
    }

    // 3. Compléments à 10
    if(type === 3){
      const a = rnd(1,9);
      return { text:`${a} + ? = 10`, ans:10-a, skill:"至10的债券" };
    }

    // 4. Compléments à la dizaine supérieure
    if(type === 4){
      const tens = rnd(1,8) * 10;
      const unit = rnd(1,9);
      const n = tens + unit;
      const nextTen = tens + 10;
      return { text:`${n} + ? = ${nextTen}`, ans:nextTen-n, skill:"下10个" };
    }

    // 5. Ajouter des dizaines entières à un nombre
    const base = rnd(11,69);
    const tensToAdd = rnd(1,3) * 10;
    return { text:`${base} + ${tensToAdd} =`, ans:base+tensToAdd, skill:"添加 10" };
  }

  function currentSpeed(){
    const speeds = [0, 30, 42, 56, 72, 90, 110];
    let base = speeds[Math.max(1, Math.min(6, speedLevel))];
    // Phase médaille d'or : accélération supplémentaire à partir de 12 bonnes réponses.
    if(score >= 12) base *= 1.35;
    return base;
  }
  function spawnDelay(){
    const delays = [0, 3300, 2850, 2400, 2000, 1650, 1350];
    let delay = delays[Math.max(1, Math.min(6, speedLevel))];
    // En zone "or", les calculs arrivent plus rapprochés.
    if(score >= 12) delay = Math.max(900, delay * 0.72);
    return delay;
  }

  function groundTop(){
    const g = $('game').getBoundingClientRect();
    const f = document.querySelector('.floor').getBoundingClientRect();
    return f.top - g.top;
  }

  function updateHud(){
    $("得分").textContent = `得分 ${score}`;
    $('lives').textContent = `生命: ${'❤️'.repeat(lives) || '—'}`;
    $('level').textContent = `速度 : ${speedLevel}`;
    const labels = ['', "轻缓开始", "再快一点", "中速", "快速快速", "速度很快", "涡轮"];
    if($('speedHint')){
      $('speedHint').textContent = score >= 12 ? "GOLD模式:加速!" : labels[speedLevel];
      $('speedHint').classList.toggle('goldMode', score >= 12);
    }
  }

  function setRacers(){
    const maxLeft = 78;
    $('player').style.left = (54 + playerProgress*maxLeft) + '%';
    $('rival').style.left = (54 + rivalProgress*maxLeft) + '%';
  }

  function bounce(el){
    el.classList.remove('jump');
    void el.offsetWidth;
    el.classList.add('jump');
  }

  function createOpNode(op){
    const el = document.createElement('div');
    el.className = 'operation';
    const skill = document.createElement('div');
    skill.textContent = op.skill;
    skill.style.fontSize = '.62rem';
    skill.style.textTransform = 'uppercase';
    skill.style.letterSpacing = '.05em';
    skill.style.opacity = '.72';
    skill.style.marginBottom = '4px';
    const expr = document.createElement('div');
    expr.textContent = op.text;
    el.appendChild(skill);
    el.appendChild(expr);
    el.dataset.id = op.id;
    el.style.left = op.x + '%';
    el.style.top = op.y + 'px';
    $('game').appendChild(el);
    op.el = el;
  }

  function spawnOperation(){
    if(active.length >= MAX_ACTIVE || round + active.length >= MAX_ROUNDS) return;
    const base = makeOperation();
    const lanes = [18, 38, 60, 81];
    let possible = lanes.filter(x => !active.some(a => Math.abs(a.x-x) < 10));
    if(!possible.length) possible = lanes;
    const op = {
      id: nextId++,
      text: base.text,
      ans: base.ans,
      skill: base.skill,
      x: possible[rnd(0, possible.length-1)],
      y: -80
    };
    active.push(op);
    createOpNode(op);
  }

  function removeOperation(op){
    if(op.el && op.el.parentNode) op.el.parentNode.removeChild(op.el);
    active = active.filter(o => o !== op);
  }

  function markGood(op){
    score++;
    round++;
    playerProgress = Math.min(1, playerProgress + 1/12);
    $('feedback').innerHTML = "<span class=\"good\">真棒！</span>";
    bounce($('player'));
    setRacers();
    removeOperation(op);
    $("答案").value = '';
    if(score > 0 && score % 5 === 0) speedLevel = Math.min(6, speedLevel + 1);
    updateHud();
    if(round >= MAX_ROUNDS || playerProgress >= 1){
      finish();
      return;
    }
    if(active.length < 2) spawnOperation();
  }

  function markMiss(op){
    lives--;
    round++;
    rivalProgress = Math.min(1, rivalProgress + 1/5);
    $('feedback').innerHTML = `<span class="bad">拖着! ${op.text} ${op.ans}</span>`;
    bounce($('rival'));
    setRacers();
    removeOperation(op);
    updateHud();
    if(lives <= 0 || round >= MAX_ROUNDS || rivalProgress >= 1){
      finish();
      return;
    }
    if(active.length < 2) spawnOperation();
  }

  function checkTyped(){
    if(!running || paused) return;
    const raw = $("答案").value.trim();
    if(raw === '') return;
    const n = Number(raw);
    let matches = active.filter(op => op.ans === n);
    if(matches.length){
      matches.sort((a,b)=>b.y-a.y); // remove lowest first
      markGood(matches[0]);
    }
  }

  function loop(t){
    if(!running) return;
    if(paused){
      last = t;
      raf = requestAnimationFrame(loop);
      return;
    }
    if(!last) last = t;
    const dt = Math.min(.04, (t-last)/1000);
    last = t;

    spawnTimer += dt*1000;
    if(spawnTimer >= spawnDelay()){
      spawnTimer = 0;
      spawnOperation();
    }

    const gTop = groundTop();
    [...active].forEach(op=>{
      op.y += currentSpeed()*dt;
      if(op.el){
        op.el.style.top = op.y + 'px';
        if(op.y > gTop - 160) op.el.classList.add('danger');
      }
      if(op.el && op.y + op.el.offsetHeight >= gTop){
        markMiss(op);
      }
    });

    raf = requestAnimationFrame(loop);
  }

  function finish(){
    running = false;
    cancelAnimationFrame(raf);
    [...active].forEach(removeOperation);

    let medal = '🥉', label = "铜牌";
    if(playerProgress >= 1 || score >= 12){
      medal='🥇'; label="金金奖章";
    } else if(score >= 7){
      medal='🥈'; label="银奖章";
    }

    $('medal').textContent = medal;
    $('medalText').textContent = label;
    $('finalText').textContent = `您找到了 ${score} 正确${score>1?'s':''} 答案${score>1?'s':''}.`;
    $('endCard').classList.remove('hidden');
  }

  function startGame(){
    cancelAnimationFrame(raf);
    [...active].forEach(removeOperation);
    active = [];
    score = 0;
    lives = 3;
    speedLevel = 1;
    round = 0;
    running = true;
    paused = false;
    spawnTimer = 0;
    last = 0;
    playerProgress = 0;
    rivalProgress = 0;
    nextId = 1;

    $('startCover').classList.add('hidden');
    $('endCard').classList.add('hidden');
    $('feedback').textContent = '';
    $("答案").value = '';
    $('pauseBtn').textContent = '❚❚';

    updateHud();
    setRacers();

    spawnOperation();
    setTimeout(()=>{ if(running) spawnOperation(); }, 650);
    setTimeout(()=>{ if(running) spawnOperation(); }, 1250);

    $("答案").focus();
    raf = requestAnimationFrame(loop);
  }

  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('quitBtn').addEventListener('click', startGame);
  $('pauseBtn').addEventListener('click', ()=>{
    if(!running) return;
    paused = !paused;
    $('pauseBtn').textContent = paused ? '▶' : '❚❚';
    if(!paused){
      last = performance.now();
      $("答案").focus();
    }
  });
  $("答案").addEventListener('input', checkTyped);

  updateHud();
  setRacers();
})();
</script>
