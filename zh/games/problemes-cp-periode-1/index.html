const voiceSelect=$('voice-choice');let frenchVoices=[];
function voiceRank(v){const n=(v.name+' '+v.lang).toLowerCase();return (/(natural|naturel|neural|premium|enhanced)/.test(n)?100:0)+(/google/.test(n)?35:0)+(/^zh[-_]cn$/i.test(v.lang)?20:0)+(v.localService?4:0)}
function loadFrenchVoices(){if(!('speechSynthesis' in window))return;const previous=voiceSelect.value;frenchVoices=speechSynthesis.getVoices().filter(v=>/^zh(?:[-_]|$)/i.test(v.lang)).sort((a,b)=>voiceRank(b)-voiceRank(a)||a.name.localeCompare(b.name));voiceSelect.replaceChildren();for(const v of frenchVoices){const option=document.createElement('option');option.value=v.voiceURI;option.textContent=v.name;voiceSelect.append(option)}if(previous&&frenchVoices.some(v=>v.voiceURI===previous))voiceSelect.value=previous;$('voice-options').hidden=frenchVoices.length<2}
