<section id="home" class="home"><div class="eyebrow">任务心智微积分</div><h1>银河限时计算 CE2</h1><p>成功完成20项计算 <strong>3分钟3分钟</strong> !</p><div class="picker"><label>选择题组<select id="series" aria-label="选择时钟式"></select></label><button id="start" class="primary" type="button">- 起飞!</button></div><p class="hint">写第一个号码时开始时间 。失败的泡沫稍后会回来:游戏还在继续!</p></section>
<section id="game" hidden><div class="hud"><div><small>题组</small><strong id="series-label"></strong></div><div><small>剩余时间</small><strong id="clock" class="clock">03:00</strong></div><div><small>答对题数</small><strong id="progress">0 / 20</strong></div><button type="button" class="secondary" id="home-button">首页</button></div><div class="game-scene" id="game-scene"><div class="boundary"></div><div id="bubble" class="bubble" aria-live="polite"></div><div id="waiting" class="waiting">先写第一个号码!</div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></div><form class="dock" id="answer-form"><label for="answer">我的答案</label><input id="answer" type="text" inputmode="numeric" autocomplete="off" maxlength="5" aria-label="我的答案"><button class="primary" type="submit">检查答案</button><button class="secondary" id="clear" type="button">清空</button></form></section>

<script>
"严格使用";
const $=id=>document.getElementById(id);let source=[],series=0,queue=[],current=null,solved=[],first=[],attemptCount=[],active=false,started=false,deadline=0,bubbleStarted=0,bubbleDuration=8500,timer=null,noticeTimer=null;
function parse(text){if(text.includes('|')){const [a,b]=text.split('|').map(Number);return{expression:a+' + ? = '+b,answer:b-a,correction:a+' + '+(b-a)+' = '+b}}const match=text.match(/^(\d+)([+*\-])(\d+)$/);if(!match)throw Error("未知计算");const a=Number(match[1]),b=Number(match[3]),op=match[2],sign=op==='*'?'×':op==='-'?'−':'+';return{expression:a+' '+sign+' '+b,answer:op==='+'?a+b:op==='-'?a-b:a*b,correction:a+' '+sign+' '+b+' = '+(op==='+'?a+b:op==='-'?a-b:a*b)}}
function screen(which){for(const x of ["home",'game','result'])$(x).hidden=x!==which;window.scrollTo(0,0)}
function stop(){active=false;clearInterval(timer);clearTimeout(noticeTimer);timer=null}
function goHome(){stop();screen("home")}
function format(ms){const sec=Math.ceil(Math.max(0,ms)/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function message(t){$('feedback').textContent=t;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('feedback').textContent='',1700)}
function next(){if(!active)return;if(queue.length===0){finish(true);return}current=queue.shift();const p=parse(source[series][current]);$('bubble').textContent=p.expression;$('bubble').classList.toggle('small-text',p.expression.length>14);$("answer").value='';bubbleStarted=performance.now();placeBubble(0);$("answer").focus({preventScroll:true})}
function placeBubble(fraction){const scene=$('game-scene'),bubble=$('bubble');const bottom=scene.clientHeight-bubble.offsetHeight-30,top=54;const y=bottom-(bottom-top)*Math.min(1,Math.max(0,fraction));bubble.style.transform="翻译YY("+y+"(px)"}
function tick(){if(!active)return;if(!started){placeBubble(0);return}const left=deadline-Date.now();$('clock').textContent=format(left);$('clock').classList.toggle('urgent',left<=30000);if(left<=0){finish(false);return}const elapsed=performance.now()-bubbleStarted;placeBubble(elapsed/bubbleDuration);if(elapsed>=bubbleDuration){if(first[current]===null)first[current]=false;attemptCount[current]++;queue.push(current);message("泡沫稍后会回来的!");next()}}
function start(){stop();series=Number($('series').value);queue=source[series].map((_,i)=>i);solved=Array(20).fill(false);first=Array(20).fill(null);attemptCount=Array(20).fill(0);active=true;started=false;$('series-label').textContent="时钟现象 "+(series+1);$('clock').textContent='03:00';$('clock').classList.remove('urgent');$('progress').textContent='0 / 20';$('waiting').hidden=false;$('feedback').textContent='';screen('game');next();timer=setInterval(tick,60)}
function startTimer(){if(!active||started||!$("answer").value)return;started=true;deadline=Date.now()+180000;bubbleStarted=performance.now();$('waiting').hidden=true;tick()}
let popAudio=null;
function playBubblePop(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!popAudio)popAudio=new Audio();const ctx=popAudio;if(ctx.state==='suspended')ctx.resume().catch(()=>{});const t=ctx.currentTime,master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);const length=Math.floor(ctx.sampleRate*.12),buffer=ctx.createBuffer(1,length,ctx.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<length;i++)samples[i]=(Math.random()*2-1)*Math.pow(1-i/length,3);const noise=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),ng=ctx.createGain();noise.buffer=buffer;filter.type='bandpass';filter.frequency.setValueAtTime(1500,t);filter.frequency.exponentialRampToValueAtTime(450,t+.11);filter.Q.value=.7;ng.gain.setValueAtTime(.55,t);ng.gain.exponentialRampToValueAtTime(.001,t+.12);noise.connect(filter);filter.connect(ng);ng.connect(master);noise.start(t);noise.stop(t+.13);[1100,1650,2200].forEach((frequency,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),begin=t+.035+i*.035;o.type='sine';o.frequency.setValueAtTime(frequency,begin);o.frequency.exponentialRampToValueAtTime(frequency*.84,begin+.24);g.gain.setValueAtTime(.0001,begin);g.gain.exponentialRampToValueAtTime(.14/(i+1),begin+.012);g.gain.exponentialRampToValueAtTime(.0001,begin+.27);o.connect(g);g.connect(master);o.start(begin);o.stop(begin+.28)});setTimeout(()=>master.disconnect(),800)}catch(e){}}
function check(e){e.preventDefault();if(!active)return;const raw=$("answer").value.trim();if(!/^\d+$/.test(raw)){message("写一个数字回答。");$("answer").focus();return}startTimer();if(Date.now()>=deadline){finish(false);return}const ok=Number(raw)===parse(source[series][current]).answer;if(first[current]===null)first[current]=ok;attemptCount[current]++;if(ok){playBubblePop();solved[current]=true;$('progress').textContent=solved.filter(Boolean).length+' / 20';message("真棒！")}else{queue.push(current);message("再试一次!这次行动会回来的")}next()}
function finish(completed){if(!active)return;stop();const count=solved.filter(Boolean).length,firstCount=first.filter(x=>x===true).length;$('result-title').textContent=completed?"成功的任务!":"三分钟结束了!";$("score").textContent=count+' / 20';$('result-detail').textContent="答对题数 "+Math.round(count/20*100)+" 百分比在第一个测试中: "+firstCount+" 大约20个左右";$('review').innerHTML=source[series].map((q,i)=>'<li>'+(solved[i]?'✅ ':first[i]===null?'⏳ ':'🔁 ')+parse(q).correction+(solved[i]&&attemptCount[i]>1?" (经另一次尝试后成功)":'')+'</li>').join('');screen('result')}
$("answer").addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');startTimer()});$('answer-form').addEventListener('submit',check);$("clear").addEventListener('click',()=>{$("answer").value='';$("answer").focus()});$("start").addEventListener('click',start);$('replay').addEventListener('click',start);$("menu").addEventListener('click',goHome);$('home-button').addEventListener('click',goHome);window.addEventListener('resize',tick);
fetch('./data.json').then(r=>{if(!r.ok)throw Error("无法加载");return r.json()}).then(data=>{if(data.length!==20||data.some(a=>a.length!==20))throw Error("不完整序列");data.flat().forEach(parse);source=data;$('series').innerHTML=data.map((_,i)=>'<option value="'+i+"\">时钟现象 "+(i+1)+'</option>').join('')}).catch(()=>{$("start").disabled=true;document.querySelector('.hint').textContent="无法装入计算 。重新加载页面。"});
</script><script defer src="/assets/statistiques.js"></script><script data-goatcounter="https://lesjeuxdemathsetdefrancais.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script><script src="/assets/catalogue-v2/runtime-zh.js?v=1" defer></script></body></html>
