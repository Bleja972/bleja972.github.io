*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#263e36;font:18px/1.5 Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1.5px solid #bccbbf;border-radius:13px;padding:12px 17px;min-height:48px;background:white;color:#254c3d;font-weight:bold}button:hover{background:#eef4e9}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ac750f;outline-offset:4px}.primary{background:#205944;color:white;border-color:#205944}.primary:hover{background:#2e7158}.top{max-width:980px;margin:auto;padding:24px 20px 10px}.top small{font-weight:bold;letter-spacing:2px;color:#557364}h1{font-size:clamp(27px,5vw,39px);margin:5px 0}h2{font-size:25px;margin:0 0 12px}p{margin:10px 0 18px}main{max-width:980px;margin:10px auto;padding:0 20px 30px}.panel{background:white;border:1px solid #dce4d8;border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:0 8px 24px #3049380b}.levels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.levels button{padding:23px;text-align:left;border:2px solid #d7e2d3}.levels strong{display:block;font-size:23px}.levels span{display:block;font-weight:normal;font-size:16px;margin-top:8px}.levels .example{font-weight:bold;font-size:30px;color:#205944}.rule,.help{border-left:4px solid #dfb64a;background:#faf7e9;border-radius:10px;padding:15px;font-size:16px}.status{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:bold}.status button{font-size:14px;padding:8px 12px}.progress{height:8px;background:#e6ecdf;border-radius:8px;overflow:hidden;margin:17px 0 24px}.progress span{display:block;height:100%;background:#dfb348}.play-layout{display:grid;grid-template-columns:1.05fr 1fr;gap:25px;align-items:center}.operation{--cell:76px;display:grid;grid-template-columns:30px repeat(var(--cols),var(--cell));gap:8px;justify-content:center;align-items:center;text-align:center;margin:8px 0 16px}.colhead{font-size:13px;font-weight:bold;line-height:1.3;padding:9px 1px;border-radius:10px}.colhead strong{display:block;font-size:22px}.c{background:#e3f0df;color:#245e32}.d{background:#fff2bb;color:#745800}.u{background:#fce7e3;color:#a42526}.carry-slot{height:38px;display:flex;align-items:center;justify-content:center}.carry{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid #927000;border-radius:50%;font-size:24px;font-weight:bold;background:#ffe079;color:#4a3900}.carry.consumed{opacity:.45}.digit{font-size:42px;line-height:1.2;font-variant-numeric:tabular-nums;padding:5px 0}.plus{font-size:30px}.sumline{height:3px;background:#344a3d;grid-column:1/-1}.result{height:73px;position:relative;border:2px solid #d6dfd1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:39px;font-variant-numeric:tabular-nums;background:#f8faf5}.result.active{border:3px solid #bd941c;box-shadow:0 0 0 4px #fff1ba}.result.solved{border-color:#3b8453;background:#edf7e8}.result input{width:100%;height:100%;border:0;border-radius:10px;background:transparent;text-align:center;font-size:39px;min-width:0;color:#263e36;font-variant-numeric:tabular-nums;padding:0}.result .units-stay{width:30px;text-align:center;font-size:39px}.result .tens-leave{width:30px;font-size:39px;text-align:center}.result .split{display:flex;align-items:center;justify-content:center;width:100%}.flying-one{position:fixed;z-index:1000;font-size:32px;line-height:36px;width:36px;height:36px;border-radius:50%;background:#ffe079;color:#4a3900;border:2px solid #927000;text-align:center;font-weight:bold;pointer-events:none;box-shadow:0 3px 10px #5d440033}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.feedback{font-size:18px;font-weight:bold;min-height:64px;line-height:1.5}.goodtext{color:#226239}.badtext{color:#a03929}.muted{font-size:14px;color:#647368}.column-note{font-size:15px;font-weight:bold;color:#5d6b60;text-align:center}.help{margin:12px 0;background:#f4f7ed;border-left-color:#87a878}.equivalence{min-height:28px;font-size:16px;font-weight:bold;margin:12px 0;color:#725b13}.big-score{font-size:54px;font-weight:bold;color:#205944}.review-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.review-list div{background:#f2f5ec;padding:12px;border-radius:12px}.review-list small{display:block;font-size:13px;color:#697266}.center{text-align:center}footer{text-align:center;margin:25px 0 0;font-size:14px}footer a{color:#285e47}[hidden]{display:none!important}@media(max-width:740px){.play-layout{grid-template-columns:1fr;gap:6px}.levels{grid-template-columns:1fr}.panel{padding:18px}main{padding:0 12px 25px}.top{padding:20px 16px 8px}.operation{--cell:67px;gap:7px}.actions button{flex:1}.review-list{grid-template-columns:1fr}}@media(max-width:360px){.operation{--cell:58px;grid-template-columns:25px repeat(var(--cols),var(--cell));gap:5px}.digit{font-size:35px}.result,.result input{font-size:34px}.colhead{font-size:11px}.result{height:64px}}
.inline-calculation{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:18px 10px;border:2px solid #b6cbb8;border-radius:15px;background:#f6faef;font-size:clamp(25px,4vw,32px);font-weight:bold}.inline-calculation input{width:85px;height:65px;text-align:center;border:2px solid #b58d19;border-radius:10px;font-size:36px;background:white;color:#263e36;min-width:0}.calculation-history p{margin:8px 0;font-size:15px;font-weight:bold;color:#4f6756}.moving-number{position:fixed;z-index:2000;height:50px;font:700 37px/50px Arial,sans-serif;text-align:center;background:#fff1a7;color:#4a3900;border:2px solid #b2912d;border-radius:10px;pointer-events:none;box-shadow:0 3px 12px #0002}.result.active{cursor:text}.carry-hundred{background:#c3e7b3!important;color:#245e32!important;border-color:#3c8446!important}.carry-ten{background:#ffe079!important;color:#4a3900!important;border-color:#927000!important}.posed-answer{width:100%;height:100%;font:inherit!important;font-size:37px!important;text-align:center;border:0!important;border-radius:10px;background:transparent;color:inherit;min-width:0;padding:0}.result.active:focus-within{outline:3px solid #b78e1e;outline-offset:3px}</style><style id="decouvrir-autre-jeu-style">.decouvrir-autre-jeu{margin:20px 0 8px;padding:16px;border:2px solid #cde9dc;border-radius:16px;background:#f0faf3;color:#163f31;text-align:center;font-family:Arial,sans-serif}.decouvrir-autre-jeu strong{display:block;font-size:17px;line-height:1.35;margin-bottom:6px}.decouvrir-autre-jeu span{display:block;font-size:15px;margin-bottom:11px}.decouvrir-autre-jeu a{display:inline-block;background:#f9bb3d!important;color:#332300!important;border:2px solid #b97b10;border-radius:11px;padding:10px 15px;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #ac750f}.decouvrir-autre-jeu a:focus-visible{outline:3px solid #1769aa;outline-offset:3px}[data-end]>.panel{max-height:95%;overflow-y:auto}</style></head><body><header class="top"><small>MATH − CE1</small><h1>进位竖式加法</h1><p>我用列数计算,然后移动数字。</p></header><main><section id="menu" class="panel"><h2>选择您的级别</h2><p>每场比赛增加10个一次计算一列。</p><div class="levels"><button data-level="0"><strong>一次重新集结</strong><span class="example">27 + 35</span><span>从1到10个</span></button><button data-level="1"><strong>两个重新集结</strong><span class="example">157 + 265</span><span>从一到十,然后从几十到几百。</span></button></div><div class="rule"><strong>示例:</strong> 7 1 + 5 1 = 12 1。<br>写入 <strong>水平计算或列中的 12</strong>,然后按 <strong>检查答案</strong>答案只停留在其中 <strong>1</strong> 移动到 10。下一列自动生效。</div></section><section id="play" class="panel" hidden><div class="status"><span id="round"></span><span id="score"></span><button id="menuButton">变化水平</button></div><div class="progress" role="progressbar" aria-label="完成的添加" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span id="bar"></span></div><div class="play-layout"><div><div id="operation" class="operation"></div><p id="columnNote" class="column-note"></p><p id="equivalence" class="equivalence center" role="status"></p></div><div><h2 id="stageTitle"></h2><p id="instruction"></p><div id="calculation" class="inline-calculation"></div><div id="history" class="calculation-history" aria-label="已完成计算"></div><div class="actions"><button id="verify" class="primary" type="button">检查答案</button><button id="erase" type="button">清空</button></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="helpButton" aria-expanded="false" aria-controls="help">提示</button><button id="solutionButton">显示列解答</button></div><div id="help" class="help" hidden></div><button id="advance" class="primary" hidden>下一列</button></div></div></section><section id="end" class="panel center" hidden><h2>练习做得好!</h2><div id="finalScore" class="big-score"></div><p id="finalPercent"></p><p class="muted">在第一次尝试时完全正确的添加,没有给出答案,就赢得了一分。</p><div id="review" class="review-list"></div><div class="actions"><button id="again" class="primary">再次播放此关</button><button id="back">选择难度</button></div><div class="decouvrir-autre-jeu"><strong>准备好再玩一场了吗?</strong><span>加列,无重新组合</span><a href="/zh/games/additions-posees-sans-echange/">发现此游戏  ⁇ </a></div></section><footer><span>第6版——每一正确答复的赞美</span><br><a href="/zh/?lang=zh" target="_top">在博客上看到所有游戏</a></footer></main><script>
const $=id=>document.getElementById(id);let level=0,list=[],index=0,place=0,cols=2,carry=0,points=0,roundFirst=true,busy=false,columnDone=false,log=[],run=0;const names=["个位","十位","百位"];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function makeTask(l){let au=rand(1,9),bu=rand(10-au,9),ad,bd,ac=0,bc=0;if(l===0){ad=rand(1,7);bd=rand(1,8-ad)}else{ad=rand(0,9);bd=rand(Math.max(0,9-ad),9);ac=rand(1,7);bc=rand(1,8-ac)}return {a:ac*100+ad*10+au,b:bc*100+bd*10+bu}}
function makeList(l){let first=l===0?{a:27,b:35}:{a:157,b:265};let out=[first],seen=new Set([first.a+','+first.b]);while(out.length<10){let t=makeTask(l),key=t.a+','+t.b;if(!seen.has(key)){seen.add(key);out.push(t)}}return out}
function columnTotal(a,b,p,c){return Math.floor(a/10**p)%10+Math.floor(b/10**p)%10+c}
function start(l){run++;level=l;cols=l===0?2:3;list=makeList(l);index=0;points=0;log=[];$("menu").hidden=true;$('end').hidden=true;$("play").hidden=false;renderRound()}
function score(){$("score").textContent=`得分 ${points} / 10 · ${points*10} %`}
function renderRound(){place=0;carry=0;roundFirst=true;busy=false;const t=list[index];$('round').textContent=`${level===0?"一次重新集结":"两个重新集结"} · 增加 ${index+1} / 10`;score();$('bar').style.width=index*10+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',index);const op=$('operation');op.replaceChildren();op.style.setProperty('--cols',cols);const blank=()=>{const s=document.createElement('span');s.setAttribute('aria-hidden','true');return s};op.append(blank());for(let p=cols-1;p>=0;p--){let d=document.createElement('div');d.className='colhead '+['u','d','c'][p];d.innerHTML='<strong>'+['O','T','H'][p]+'</strong>'+["个位","十位","百位"][p];op.append(d)}op.append(blank());for(let p=cols-1;p>=0;p--){let d=document.createElement('div');d.className='carry-slot';d.id='carry-'+p;d.setAttribute('aria-label',"数字为 "+names[p]);op.append(d)}for(const [k,n] of [t.a,t.b].entries()){let sign=blank();if(k===1){sign.className='plus';sign.textContent='+'}op.append(sign);String(n).padStart(cols,' ').split('').forEach(ch=>{let d=document.createElement('span');d.className='digit';d.textContent=ch;op.append(d)})}let line=document.createElement('div');line.className='sumline';op.append(line,blank());for(let p=cols-1;p>=0;p--){let d=document.createElement('div');d.className='result '+['u','d','c'][p];d.id='result-'+p;d.setAttribute('aria-label',"答复者的答复 "+names[p]);op.append(d)}$('equivalence').textContent='';$('history').replaceChildren();activateColumn()}
function activeInput(){return $('columnAnswer')}
function activateColumn(){columnDone=false;busy=false;document.querySelectorAll('.result').forEach(d=>d.classList.remove('active'));const cell=$('result-'+place);cell.classList.add('active');cell.replaceChildren();cell.onclick=null;const {a,b}=list[index],da=Math.floor(a/10**place)%10,db=Math.floor(b/10**place)%10;const calc=$('calculation');calc.replaceChildren();let prefix=document.createElement('span');prefix.textContent=da+' + '+db+(carry?' + 1':'')+' = ';let input=document.createElement('input');input.id='columnAnswer';input.type='text';input.inputMode='numeric';input.maxLength=2;input.autocomplete='off';input.setAttribute('aria-label',"第1栏共计 "+names[place]);input.oninput=()=>{input.value=input.value.replace(/[^0-9]/g,'').slice(0,2)};input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();verify()}};calc.append(prefix,input);let posed=input.cloneNode(false);posed.id='posedAnswer';posed.setAttribute('aria-label',"一栏中的答复 "+names[place]);posed.className='posed-answer';cell.append(posed);const sync=(from,to)=>{from.value=from.value.replace(/[^0-9]/g,'').slice(0,2);to.value=from.value;from.removeAttribute('aria-invalid');to.removeAttribute('aria-invalid')};input.oninput=()=>sync(input,posed);posed.oninput=()=>sync(posed,input);posed.onkeydown=input.onkeydown;$('stageTitle').textContent=["1. 任务这些人","2. 2 点几十个","3 个数百人"][place];$('instruction').textContent="计算 "+names[place]+" horizontally"+(carry?" 包括承载 1":'')+"水平或列中填入总计,即使它有两个位数。";$('columnNote').textContent="我计算 "+names[place]+'.';$('feedback').textContent=place?"轮到你了!您可以在框中直接写入 "+names[place]+'.':'';$('feedback').className='feedback';$('advance').hidden=true;$('help').hidden=true;$('helpButton').setAttribute('aria-expanded','false');$('helpButton').textContent="提示";$('help').textContent=carry?"在列中添加两位数,并携带1。将总计写到 = 符号右侧。":"在列中添加两个数字,并将总计写到 = 符号的右侧。然后看着它移动。";setControls(false);input.focus()}
function setControls(disabled){for(const id of ['verify','erase','solutionButton','menuButton'])$(id).disabled=disabled;if(activeInput())activeInput().disabled=disabled;if($('posedAnswer'))$('posedAnswer').disabled=disabled}
function verify(){if(busy||columnDone)return;let input=activeInput();if(!input.value.trim()){$('feedback').className='feedback badtext';$('feedback').textContent="检查前先写一栏总数。";input.focus();return}const {a,b}=list[index],total=columnTotal(a,b,place,carry);if(Number(input.value)!==total){roundFirst=false;$('feedback').className='feedback badtext';$('feedback').textContent=carry?"再试一次加上两位数和随身携带的1。":"再试一次在此列中仅添加两个位数 。";input.setAttribute('aria-invalid','true');input.focus();return}accept(total)}
async function moveToken(text,from,to,duration,destination=-1){const f=document.createElement('span');f.className='moving-number'+(destination===2?' carry-hundred':destination===1?' carry-ten':'');f.textContent=text;f.setAttribute('aria-hidden','true');const fw=Math.max(44,text.length*29),x=from.left+(from.width-fw)/2,y=from.top+(from.height-50)/2,dx=to.left+(to.width-fw)/2-x,dy=to.top+(to.height-50)/2-y;Object.assign(f.style,{left:x+'px',top:y+'px',width:fw+'px'});document.body.append(f);try{if(f.animate){const reduced=window.matchMedia("(优惠降降调:减)").matches;const ms=reduced?100:duration;const anim=f.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}(px, px),${dy}(px)`,opacity:1}],{duration:ms,easing:'ease-in-out',fill:'forwards'});await Promise.race([anim.finished.catch(()=>{}),new Promise(resolve=>setTimeout(resolve,ms+250))]);anim.cancel()}}finally{f.remove()}}
async function pauseForExchange(){if(!window.matchMedia("(优惠降降调:减)").matches)await new Promise(resolve=>setTimeout(resolve,650))}
async function accept(total){if(busy)return;busy=true;columnDone=true;setControls(true);const token=run,p=place,cell=$('result-'+p),input=activeInput();$('feedback').className='feedback goodtext';try{const {a,b}=list[index],da=Math.floor(a/10**p)%10,db=Math.floor(b/10**p)%10,expression=da+' + '+db+(carry?' + 1':'')+' = '+total;let line=document.createElement('p');line.className='goodtext';line.textContent="真棒！ "+names[p].charAt(0).toUpperCase()+names[p].slice(1)+' : '+expression;$('history').append(line);$('feedback').textContent="干得不错!总计是 "+total+'.';cell.textContent=String(total);await pauseForExchange();if(carry){const old=$('carry-'+p).querySelector('.carry');if(old)old.classList.add('consumed')}if(total>=10){cell.innerHTML='<span class="split"><span class="tens-leave">1</span><span class="units-stay">'+total%10+'</span></span>';const source=cell.querySelector('.tens-leave'),target=$('carry-'+(p+1)),from=source.getBoundingClientRect();source.style.visibility='hidden';$('equivalence').textContent=total+' '+names[p]+' = 1 '+(p===0?"十":"hundred")+' et '+total%10+' '+names[p]+'.';$('feedback').textContent="干得不错!1 成为 "+(p===0?"十":"hundred")+" :它移到左边的柱子上。";await moveToken('1',from,target.getBoundingClientRect(),1600,p+1);if(token!==run)return;cell.textContent=String(total%10);let badge=document.createElement('span');badge.className='carry '+(p===0?'carry-ten':'carry-hundred');badge.textContent='1';badge.setAttribute('aria-label',"数字: 1 "+(p===0?"十":"hundred"));target.replaceChildren(badge);carry=1;await pauseForExchange()}else carry=0;cell.classList.remove('active');cell.classList.add('solved');if(p===cols-1){if(roundFirst)points++;log.push({...list[index],first:roundFirst});score();$('feedback').textContent="干得不错!添加完成 : "+list[index].a+' + '+list[index].b+' = '+(list[index].a+list[index].b)+'.';$('advance').textContent=index===9?"查看成绩 ★":"下一道加法";$('advance').hidden=false}else{place++;activateColumn()}}catch(error){$('feedback').className='feedback badtext';$('feedback').textContent="该运动被打断。点击恢复继续 。";$('advance').textContent="继续";$('advance').hidden=false}finally{busy=false;$('menuButton').disabled=false}}
$('verify').onclick=verify;$('erase').onclick=()=>{if(busy||columnDone)return;activeInput().value='';if($('posedAnswer'))$('posedAnswer').value='';activeInput().removeAttribute('aria-invalid');$('feedback').textContent='';activeInput().focus()};$('helpButton').onclick=()=>{let show=$('help').hidden;$('help').hidden=!show;$('helpButton').setAttribute('aria-expanded',String(show));$('helpButton').textContent=show?"隐藏提示":"提示"};$('solutionButton').onclick=()=>{if(busy||columnDone)return;roundFirst=false;let t=list[index];activeInput().value=String(columnTotal(t.a,t.b,place,carry));if($('posedAnswer'))$('posedAnswer').value=activeInput().value;$('feedback').className='feedback';$('feedback').textContent="这是水平总计。按下检查将它放在柱子上,并观看重新组合。"};$('advance').onclick=()=>{if(busy||!columnDone)return;if(place<cols-1){activateColumn()}else if(++index<10)renderRound();else finish()};
function finish(){$("play").hidden=true;$('end').hidden=false;$('finalScore').textContent=points+' / 10';$('finalPercent').textContent=points*10+" % 纠正了第一次尝试";$('review').replaceChildren();log.forEach(t=>{let d=document.createElement('div');d.textContent=(t.first?'✓ ':"审查: ")+t.a+' + '+t.b+' = '+(t.a+t.b);let s=document.createElement('small');s.textContent=t.first?"第一次尝试时正确":"再试一次再练习";d.append(s);$('review').append(d)})}
function menu(){if(busy)return;run++;$("menu").hidden=false;$("play").hidden=true;$('end').hidden=true}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(Number(b.dataset.level)));$('menuButton').onclick=menu;$('again').onclick=()=>start(level);$("back").onclick=menu;
</script><script src="/assets/catalogue-v2/runtime-zh.js?v=1" defer></script></body></html>
