<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数一数物品 — 小学二年级</title>
<style>

:root{--b:#163a59;--g:#2c9b58;--o:#ed8a2f;--v:#7355c8;--r:#d94b4b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#dff5ff,#fff0bd);color:#243746}
.app{max-width:1080px;margin:auto;padding:16px}.card{background:#fff;border:2px solid #cbdde8;border-radius:20px;padding:18px;box-shadow:0 8px 22px #17405a14}
h1{margin:5px 0;color:var(--b)}.brand{font-weight:900;color:#8b5b2d}.muted{color:#657785}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.skill{border:3px solid #d6e1e8;border-radius:17px;background:#fff;padding:15px;text-align:left;cursor:pointer;min-height:120px}.skill strong{display:block;color:var(--b);margin-bottom:6px}.skill.eval{background:#fff3c7;border-color:#d9b345}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badges{display:flex;gap:8px}.badge{background:#eef5f8;border-radius:10px;padding:8px 10px;font-weight:900}
.progress{height:9px;background:#e6ecef;border-radius:99px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:var(--g);width:0}
.game{margin-top:14px;min-height:500px}.title{text-align:center;font-size:1.25rem;font-weight:900;color:var(--b)}.prompt{text-align:center;font-size:1.35rem;font-weight:900;margin:18px}
.answer{height:58px;width:min(240px,80vw);font-size:1.45rem;font-weight:900;text-align:center;border:3px solid var(--v);border-radius:12px;background:#fff;color:#12324a}.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer}.orange{background:var(--o);color:white}.green{background:var(--g);color:white}.navy{background:var(--b);color:white}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}.feedback{min-height:34px;text-align:center;font-weight:900;margin-top:12px}.good{color:var(--g)}.bad{color:var(--r)}
.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px;margin:auto}.choice,.sign{border:3px solid #b9c7d0;border-radius:13px;background:#fff;padding:15px;font-size:1.25rem;font-weight:900;cursor:pointer}.selected{border-color:var(--v)!important;background:#f0ecff!important}
.order,.seq,.parts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px}.chip,.slot{min-width:76px;height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}.chip{border:3px solid #77a9cc;background:#eef8ff;cursor:pointer;color:#12324a}.slot{border:3px dashed #adbcc5;background:#fff;color:#12324a}
.block100{width:86px;height:86px;border:3px solid #68756b;background:repeating-linear-gradient(0deg,transparent 0 7px,#7a866f 7px 8px),repeating-linear-gradient(90deg,#f1d56d 0 7px,#7a866f 7px 8px)}.block10{width:16px;height:86px;border:3px solid #68756b;background:repeating-linear-gradient(0deg,#f1d56d 0 7px,#7a866f 7px 8px)}.block1{width:18px;height:18px;border:3px solid #68756b;background:#f1d56d}
.speaker{width:72px;height:72px;border-radius:50%;border:0;background:#ed8a2f;color:white;font-size:2rem;cursor:pointer}
.smallin{width:88px;height:48px;border:2px solid #acbbc4;border-radius:9px;text-align:center;font-size:1.2rem;font-weight:900;background:#fff;color:#12324a}
@media(max-width:720px){.menu,.choicegrid{grid-template-columns:1fr}}

.grouped-material{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;align-items:flex-end;margin:20px auto}
.mat-cat{display:flex;align-items:flex-end;gap:clamp(18px,3vw,32px);flex-wrap:wrap;justify-content:center}
.five-group{display:flex;gap:5px}
.remainder-group{display:flex;gap:5px}
.five-group .block100,.remainder-group .block100{margin-right:1px}
.five-group .block10,.remainder-group .block10{margin-right:1px}
.five-group .block1,.remainder-group .block1{margin-right:1px}

@media(max-width:680px){
 .grouped-material{flex-direction:column;align-items:center}
 .mat-cat{max-width:100%}
}
.answer{max-width:100%}
#menu .seq-list{grid-template-columns:minmax(0,1fr)}
#game .actions .btn{width:auto}
.successPct{display:inline-block;margin-left:.75rem;padding:.25rem .55rem;border-radius:8px}
.finalPct{text-align:center;font-size:1.4rem;font-weight:900}
</style>
<link rel="stylesheet" href="https://bleja972.github.io/evaluation_periode1_numeration/arcade.css?v=mission-orbitale-1">
<style>
#jeux-conseilles .jc-links { display: grid; gap: 12px; }
#jeux-conseilles .jc-home { margin-top: 14px; }
#jeux-conseilles a { display:flex; align-items:center; justify-content:center; min-height:48px; padding:12px; border-radius:12px; text-align:center; text-decoration:none; }
#jeux-conseilles p { margin:0 0 14px; }
body.orbital-counting #jeux-conseilles {
  margin: 18px 0;
  padding: clamp(14px, 3vw, 22px);
  border: 1px solid #49dcff;
  border-radius: 16px;
  background: radial-gradient(ellipse at top left, #10263a, transparent 68%), #070b14;
  box-shadow: 0 5px 0 #000, 0 0 18px #20d8ff45, inset 0 0 14px #26c6ff18;
  color: #e6f7ff;
  font: inherit;
}
body.orbital-counting #jeux-conseilles h2 {
  color: var(--gold);
  font: 850 clamp(1.15rem, 3vw, 1.5rem)/1.2 system-ui, sans-serif;
  text-shadow: 0 0 10px #ffc74055;
}
body.orbital-counting #jeux-conseilles .jc-links {
  grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
}
body.orbital-counting #jeux-conseilles a {
  --neon: #42e7ff;
  --glow: #26ddff65;
  border: 1px solid var(--neon);
  background: linear-gradient(150deg, #172b44, #060912);
  color: #f3fbff;
  font: 800 1rem/1.4 system-ui, sans-serif;
  box-shadow: 0 4px 0 #000, 0 0 12px var(--glow), inset 0 1px #ffffff35;
  transition: transform .15s, box-shadow .15s, filter .15s;
}
body.orbital-counting #jeux-conseilles .jc-links a:nth-child(2) {
  --neon: #ff79ce;
  --glow: #ff59bd60;
}
body.orbital-counting #jeux-conseilles .jc-home {
  --neon: #ffd45f;
  --glow: #ffca4960;
  color: #ffdf82;
}
body.orbital-counting #jeux-conseilles a:hover {
  filter: brightness(1.22);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #000, 0 0 18px var(--glow), inset 0 1px #ffffff45;
}
body.orbital-counting #jeux-conseilles a:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #000, 0 0 10px var(--glow);
}
body.orbital-counting #jeux-conseilles a:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
  body.orbital-counting #jeux-conseilles a { transition: none; }
  body.orbital-counting #jeux-conseilles a:is(:hover, :active) { transform: none; }
}
</style>
</head><body class="orbital-counting">
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
<header class="mast"><div class="mastbar"><div class="masttext">
<span class="eyebrow">轨道实验室 · 小学二年级 · 数的认识</span>
<h1>数的认识<em>任务</em></h1>
<p>数一数物品 · 2 个关卡，每关 18 题</p>
</div><a class="status-pill" href="https://bleja972.github.io/?lang=zh" target="_top"><i></i> 所有游戏</a></div></header>
<div class="layout">
<aside id="menu" class="menu" aria-label="选择任务">
<h2>选择关卡</h2><div class="seq-list">
<button type="button" class="seq-btn" id="start" aria-pressed="false"><span class="seq-num">01</span><span class="seq-title"><small>第 1 关</small>按顺序排列</span></button>
<button type="button" class="seq-btn" id="startMixed" aria-pressed="false"><span class="seq-num">02</span><span class="seq-title"><small>第 2 关</small>打乱排列</span></button>
</div></aside>
<main id="game" class="arena">
<div class="arena-head"><div class="arena-top"><div>
<h2 id="skillName" tabindex="-1"></h2><p class="sub">数的认识练习 · 小学二年级</p>
</div><button class="btn ghost" id="sound" aria-pressed="true" type="button">♫ 音效：开</button></div>
<div class="hud">
<div class="hud-box"><span>关卡</span><strong id="level">—</strong></div>
<div class="hud-box"><span>题目</span><strong id="count"></strong></div>
<div class="hud-box timer"><span>计时</span><strong>不限时</strong></div>
<div class="hud-box"><span>答对题数</span><strong id="score"></strong></div>
</div><div class="progressrail"><div class="progressbar" id="prog"></div></div></div>
<div class="panel">
<div class="mission" id="exTitle"></div><div class="problem" id="ex"></div>
<section id="jeux-conseilles" class="hidden" aria-labelledby="jeux-conseilles-title">
<h2 id="jeux-conseilles-title">继续练习</h2><p>选择另一个游戏继续练习。</p>
<div class="jc-links"><a href="/zh/games/comparer-deux-nombres/" target="_top">比较两个数</a><a href="/zh/games/ranger-des-nombres/" target="_top">给数字排序</a></div>
<a class="jc-home" href="/?lang=zh" target="_top">🏠 所有游戏</a>
</section>
<div class="feedback" id="fb" role="status" aria-live="polite"></div>
<div class="actions"><button class="btn primary" id="check" type="button">✓ 检查</button><button class="btn ghost" id="clear" type="button">清空</button><button class="btn orange hidden" id="next" type="button">下一题 →</button><button class="btn ghost" id="back" type="button">游戏菜单</button></div>
</div>
</main></div></div>
<script>
(()=>{
const $ = id => document.getElementById(id);
const levelValues = [
  [215,310,153,300,251,305,531,150,124,408,562,607,690,724,785,836,907,999],
  [132,267,394,420,506,681,743,875,960,109,284,357,470,591,603,718,852,986]
];
let values = levelValues[0];
const levelButtons = [$("start"), $("startMixed")];
let level = 0;
let i = 0;
let score = 0;
let current;
let answered = false;

function home() {
  $('skillName').textContent = '数一数物品';
  $('exTitle').textContent = '观察积木，想一想它们表示哪个数。';
  $('ex').textContent = '例如：2 个百、4 个十和 3 个一组成 243。';
  $('fb').textContent = '';
  $('count').textContent = '18 题';
  $('score').textContent = '得分：0';
  $('prog').style.width = '0%';
  $('jeux-conseilles').classList.add('hidden');
  setLevel(0);
  for (const id of ['check','clear','next','back']) $(id).classList.add('hidden');
}
function render() {
  answered = false;
  current = mn1();
  $('exTitle').textContent = current.t;
  $('ex').innerHTML = current.h;
  $('count').textContent = `题目 ${i+1} / ${values.length}`;
  $('fb').textContent = '';
  $('prog').style.width = `${i / values.length * 100}%`;
  for (const id of ['check','clear','back']) $(id).classList.remove('hidden');
  $('next').classList.add('hidden');
  $('a').addEventListener('keydown',event => { if (event.key === 'Enter') $('check').click(); });
  if (matchMedia('(pointer: fine)').matches) $('a').focus({preventScroll:true});
}
function setLevel(nextLevel) {
  level = nextLevel;
  $('level').textContent = level || '—';
  levelButtons.forEach((button, index) => {
    const active = index + 1 === level;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
  });
}
function startLevel(nextLevel) {
  $('jeux-conseilles').classList.add('hidden');
  setLevel(nextLevel);
  values = levelValues[nextLevel - 1];
  i = 0;
  score = 0;
  $('score').textContent = '得分：0';
  sound('tap');
  render();
  $('game').scrollIntoView({block:'start'});
}
levelButtons.forEach((button, index) => { button.onclick = () => startLevel(index + 1); });
$('check').onclick = () => {
  if (answered || !$('a').value.trim()) return;
  answered = true;
  $('a').readOnly = true;
  const ok = current.c();
  if (ok) score++;
  const pct = Math.round(score / (i+1) * 100);
  $('fb').innerHTML = ok ? '<span class="good">真棒！</span>' : `<span class="bad">正确答案：${current.a}</span>`;
  $('fb').insertAdjacentHTML('beforeend',`<span class="successPct">正确率：${pct} %</span>`);
  $('score').textContent = `得分：${score}`;
  $('check').classList.add('hidden');
  $('clear').classList.add('hidden');
  $('next').classList.remove('hidden');
  $('next').focus({preventScroll:true});
  sound(ok ? 'good' : 'bad');
};
$('clear').onclick = () => { $('a').value = ''; $('a').focus(); };
$('next').onclick = () => {
  i++;
  if (i < values.length) {
    render();
    return;
  }
  $('prog').style.width = '100%';
  $('exTitle').textContent = '关卡完成';
  $('ex').innerHTML = `<div class="prompt">得分：${score} / ${values.length}</div><div class="finalPct">正确率：${Math.round(score / values.length * 100)} %</div>`;
  $('fb').textContent = '';
  $('next').classList.add('hidden');
  $('jeux-conseilles').classList.remove('hidden');
  sound('end');
};
$('back').onclick = () => { const previousLevel = level; home(); levelButtons[previousLevel - 1].focus(); };
function matGroup(cls,count){
  if (count <= 0) return '';
  const labels = { block100: '百格板', block10: '十格长条', block1: '个位小方块' };
  const block = `<span class="${cls}" role="img" aria-label="${labels[cls]}"></span>`;
  if (count <= 5) return `<div class="remainder-group">${block.repeat(count)}</div>`;
  return `<div class="five-group">${block.repeat(5)}</div><div class="remainder-group">${block.repeat(count-5)}</div>`;
}
function mn1(){
  const n=values[i];
  const h=Math.floor(n/100), d=Math.floor((n%100)/10), u=n%10;
  let groups = [['block100', h], ['block10', d], ['block1', u]];
  if (level === 2) {
    groups = groups.filter(([, count]) => count > 0);
    if (groups.length === 2) {
      groups.reverse();
    } else if (groups.length === 3) {
      // Les cinq permutations qui diffèrent de l’ordre centaines, dizaines, unités.
      const orders = [[0,2,1], [1,0,2], [1,2,0], [2,0,1], [2,1,0]];
      groups = orders[Math.floor(Math.random() * orders.length)].map(index => groups[index]);
    }
  }
  const blocks = '<div class="grouped-material">' + groups.map(([kind, count]) =>
    `<div class="mat-cat">${matGroup(kind, count)}</div>`
  ).join('') + '</div>';
  return{
    t:'这些积木表示哪个数？',
    h:blocks+'<div class="center"><input id="a" class="answer" inputmode="numeric" aria-label="输入答案" autocomplete="off" placeholder="输入答案"></div>',
    c:()=>+$('a').value===n,
    a:n
  }
}
let audioCtx, muted = false;
function audioStart(){if(muted)return null;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}
function beep(freq,dur,type='sine',gain=.07,delay=0,slide=0){const a=audioStart();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function sound(kind){if(kind==='good'){beep(490,.12,'triangle',.055);beep(740,.14,'sine',.065,.105);beep(988,.2,'triangle',.055,.22)}else if(kind==='bad'){beep(235,.16,'sawtooth',.035,0,-105);beep(140,.2,'triangle',.043,.14,-60)}else if(kind==='end'){[440,587,740,988].forEach((f,i)=>beep(f,.15,'triangle',.065,i*.105))}else beep(360,.08,'sine',.033,0,105)}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♫ 音效：关':'♫ 音效：开';$('sound').setAttribute('aria-pressed',String(!muted));if(!muted)sound('tap')};
const canvas=$('stars'),ctx=canvas.getContext('2d');if(ctx&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){let stars=[],w=0,h=0;function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;stars=Array.from({length:Math.min(95,Math.max(25,Math.floor(w*h/11000)))},()=>({x:Math.random()*w,y:Math.random()*h,r:.4+Math.random()*1.25,s:.15+Math.random()*.45,p:Math.random()*6.28}))}window.addEventListener('resize',resize,{passive:true});resize();function draw(now){ctx.clearRect(0,0,w,h);stars.forEach(s=>{s.y+=s.s;if(s.y>h+3)s.y=-3;const alpha=.18+.35*(1+Math.sin(now*.001+s.p))/2;ctx.fillStyle=`rgba(118,232,255,${alpha})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(draw)}requestAnimationFrame(draw)}
home();
})();
</script>

</body></html>
