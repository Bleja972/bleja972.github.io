<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#2d3748;--accent:#f28c28;--accent2:#6b8cff;--ok:#1f9d55;--bad:#e53e3e;--line:#e6d3bd}

body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fffaf5 0%,#fff3e4 100%);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:24px 18px 40px}
.hero{background:#fff;border:3px solid #ffd8a8;border-radius:18px;padding:18px 20px;box-shadow:0 8px 22px rgba(0,0,0,.06);margin-bottom:18px}

button{border:none;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:1rem}
.btn-primary{background:#f28c28;color:#fff}.btn-secondary{background:#6b8cff;color:#fff}.btn-ghost{background:#fff;border:2px solid #ffd8a8;color:#b85c00}

.fish-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.chip{background:#fff3cd;border:2px solid #f2d58a;border-radius:10px;padding:8px 10px;font-weight:700;min-width:54px;text-align:center}

.fish .inner{position:relative;z-index:2;width:86px;height:48px;background:#fff;border:2px solid rgba(0,0,0,.16);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}

.fish input{width:100%;height:100%;text-align:center;border:none;outline:none;border-radius:10px;background:#fff;font-size:1.45rem;font-weight:700;color:#3b3b3b}

<div class="hero">
<h1>数字小鱼</h1>
<p class="subtitle">沿着箭头完成鱼群有 <strong>8套8套</strong>使用建议的数字来帮助。</p>
<div class="toolbar">
<button class="btn-primary" onclick="checkAll()">检查答案</button>
<button class="btn-secondary" onclick="showAnswers()">显示答案</button>
<button class="btn-ghost" onclick="newGame()">新游戏</button>
<div class="score" id="scoreBox">得分:0/40</div>
</div>
</div>
<div class="grid" id="game"></div>
</div>
<script>
const patterns=[
['+10','+100','-1','-10','-100'],
['+100','-10','+1','-100','+10'],
['+10','+10','-1','+100','-10'],
['+1','+10','+100','-10','-100'],
['+100','-1','-10','+10','+1'],
['+10','-10','+100','-100','+1'],
['+1','+1','+10','-1','+100'],
['+100','+10','-10','-1','-100'],
['+10','+100','-10','+1','-1'],
['+1','+10','-1','+100','-100']
];
let seriesData=[];
function applyOp(n,op){
 if(op==='+1') return n+1;
 if(op==='+10') return n+10;
 if(op==='+100') return n+100;
 if(op==='-1') return n-1;
 if(op==='-10') return n-10;
 if(op==='-100') return n-100;
 return n;
}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function makeSeries(index){
 for(let tries=0;tries<300;tries++){
   const ops=patterns[(index+tries)%patterns.length].slice();
   let start=randInt(120,780);
   let nums=[start];
   let valid=true;
   for(const op of ops){
     const next=applyOp(nums[nums.length-1],op);
     if(next<0 || next>999){valid=false;break;}
     nums.push(next);
   }
   if(!valid) continue;
   const answers=nums.slice(1);
   let bank=[...answers];
   while(bank.length<8){
     const base=answers[randInt(0,answers.length-1)];
     const deltas=[-100,-10,-1,1,10,100];
     const n=base+deltas[randInt(0,deltas.length-1)];
     if(n>=0 && n<=999 && !bank.includes(n)) bank.push(n);
   }
   bank.sort(()=>Math.random()-0.5);
   return {start,ops,answers,bank};
 }
 throw new Error("无法生成");
}
function makeFish(content,isFirst){
 const fish=document.createElement('div');
 fish.className='fish'+(isFirst?' first':'');
 const inner=document.createElement('div');
 inner.className='inner';
 if(isFirst){inner.textContent=content;}
 else{
   const input=document.createElement('input');
   input.type='text'; input.inputMode='numeric'; input.maxLength=3; input.autocomplete='off';
   inner.appendChild(input);
 }
 fish.appendChild(inner);
 return fish;
}
function buildGame(){
 const game=document.getElementById('game');
 game.innerHTML='';
 seriesData=[];
 for(let i=0;i<8;i++){
   const serie=makeSeries(i);
   seriesData.push(serie);
   const card=document.createElement('section');
   card.className='serie';
   const h=document.createElement('h2'); h.textContent="设置套设 "+(i+1);
   const p=document.createElement('p'); p.className='consigne'; p.textContent="尾随操作完成鱼群";
   const row=document.createElement('div'); row.className='fish-row';
   row.appendChild(makeFish(serie.start,true));
   for(let j=0;j<serie.ops.length;j++){
     const op=document.createElement('div'); op.className='op'; op.textContent=serie.ops[j];
     row.appendChild(op);
     row.appendChild(makeFish('',false));
   }
   const bank=document.createElement('div'); bank.className='bank';
   for(const n of serie.bank){
     const chip=document.createElement('div'); chip.className='chip'; chip.textContent=n; bank.appendChild(chip);
   }
   const actions=document.createElement('div');
   actions.className='series-actions';
   const checkBtn=document.createElement('button');
   checkBtn.type='button';
   checkBtn.className='series-check';
   checkBtn.textContent="检查此集";
   checkBtn.addEventListener('click',()=>checkSeries(i));
   const fb=document.createElement('div');
   fb.className='feedback';
   fb.id='feedback-'+i;
   fb.setAttribute('aria-live','polite');
   actions.append(checkBtn,fb);
   card.append(h,p,row,bank,actions);
   game.appendChild(card);
 }
 document.getElementById('scoreBox').textContent="得分:0/40";
}

let audioCtx=null;

function getAudioContext(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  if(!audioCtx) audioCtx=new AC();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

function makeImpulseResponse(ctx,duration=1.1,decay=2.8){
  const length=Math.floor(ctx.sampleRate*duration);
  const impulse=ctx.createBuffer(2,length,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const data=impulse.getChannelData(ch);
    for(let i=0;i<length;i++){
      const env=Math.pow(1-i/length,decay);
      data[i]=(Math.random()*2-1)*env;
    }
  }
  return impulse;
}

function playRealisticErrorBeep(){
  const ctx=getAudioContext();
  if(!ctx) return;

  const master=ctx.createGain();
  master.gain.value=0.23;
  master.connect(ctx.destination);

  function tone(freq,start,duration){
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const filter=ctx.createBiquadFilter();

    osc.type='sine';
    osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
    osc.frequency.exponentialRampToValueAtTime(freq*0.96,ctx.currentTime+start+duration);

    filter.type='lowpass';
    filter.frequency.value=1800;

    gain.gain.setValueAtTime(0.0001,ctx.currentTime+start);
    gain.gain.exponentialRampToValueAtTime(0.72,ctx.currentTime+start+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+duration);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(master);

    osc.start(ctx.currentTime+start);
    osc.stop(ctx.currentTime+start+duration+0.03);
  }

  // Deux bips courts type erreur électronique, plus naturels qu'un son carré.
  tone(560,0.00,0.16);
  tone(430,0.22,0.20);
}

function playRealisticApplause(){
  const ctx=getAudioContext();
  if(!ctx) return;

  const master=ctx.createGain();
  master.gain.value=0.50;

  const compressor=ctx.createDynamicsCompressor();
  compressor.threshold.value=-18;
  compressor.knee.value=20;
  compressor.ratio.value=4;
  compressor.attack.value=0.003;
  compressor.release.value=0.16;

  const convolver=ctx.createConvolver();
  convolver.buffer=makeImpulseResponse(ctx,1.25,3.1);

  const dry=ctx.createGain();
  dry.gain.value=0.90;
  const wet=ctx.createGain();
  wet.gain.value=0.22;

  master.connect(compressor);
  compressor.connect(dry);
  compressor.connect(convolver);
  convolver.connect(wet);
  dry.connect(ctx.destination);
  wet.connect(ctx.destination);

  const duration=1.85;
  const clapCount=34;

  for(let n=0;n<clapCount;n++){
    const t=(n/clapCount)*duration + Math.random()*0.055;

    const clapLen=Math.floor(ctx.sampleRate*(0.045+Math.random()*0.035));
    const buffer=ctx.createBuffer(1,clapLen,ctx.sampleRate);
    const data=buffer.getChannelData(0);

    for(let i=0;i<clapLen;i++){
      const x=i/clapLen;
      const envelope=Math.exp(-11*x);
      data[i]=(Math.random()*2-1)*envelope;
    }

    const src=ctx.createBufferSource();
    src.buffer=buffer;

    const band=ctx.createBiquadFilter();
    band.type='bandpass';
    band.frequency.value=900+Math.random()*1400;
    band.Q.value=0.7+Math.random()*0.8;

    const high=ctx.createBiquadFilter();
    high.type='highpass';
    high.frequency.value=450+Math.random()*250;

    const gain=ctx.createGain();
    gain.gain.value=0.10+Math.random()*0.15;

    const pan=ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if(pan) pan.pan.value=(Math.random()*2-1)*0.75;

    src.connect(band);
    band.connect(high);
    high.connect(gain);

    if(pan){
      gain.connect(pan);
      pan.connect(master);
    }else{
      gain.connect(master);
    }

    src.start(ctx.currentTime+t);

    // Quelques doubles claquements rendent l'ensemble plus humain.
    if(Math.random()<0.28){
      const src2=ctx.createBufferSource();
      src2.buffer=buffer;
      const gain2=ctx.createGain();
      gain2.gain.value=gain.gain.value*0.55;
      src2.connect(gain2);
      gain2.connect(master);
      src2.start(ctx.currentTime+t+0.025+Math.random()*0.035);
    }
  }

  // Fond très léger de foule/applaudissement continu.
  const crowdLen=Math.floor(ctx.sampleRate*duration);
  const crowd=ctx.createBuffer(1,crowdLen,ctx.sampleRate);
  const crowdData=crowd.getChannelData(0);
  for(let i=0;i<crowdLen;i++){
    const x=i/crowdLen;
    const fade=Math.sin(Math.PI*x);
    crowdData[i]=(Math.random()*2-1)*0.13*fade;
  }
  const crowdSrc=ctx.createBufferSource();
  crowdSrc.buffer=crowd;
  const crowdFilter=ctx.createBiquadFilter();
  crowdFilter.type='bandpass';
  crowdFilter.frequency.value=1250;
  crowdFilter.Q.value=0.45;
  const crowdGain=ctx.createGain();
  crowdGain.gain.value=0.18;
  crowdSrc.connect(crowdFilter);
  crowdFilter.connect(crowdGain);
  crowdGain.connect(master);
  crowdSrc.start(ctx.currentTime);
}

function checkSeries(i){
  const cards=[...document.querySelectorAll('.serie')];
  const card=cards[i];
  const serie=seriesData[i];
  let good=0; let filled=0;
  const fishes=[...card.querySelectorAll('.fish')].slice(1);
  fishes.forEach((fish,idx)=>{
    fish.classList.remove('good','bad');
    const input=fish.querySelector('input');
    const raw=input.value.trim();
    if(raw!=='') filled++;
    const val=Number(raw);
    const expected=serie.answers[idx];
    if(raw!=='' && val===expected){ fish.classList.add('good'); good++; }
    else if(raw!==''){ fish.classList.add('bad'); }
  });
  const fb=document.getElementById('feedback-'+i);
  if(filled<5){ fb.innerHTML="<span class=\"bad\">在检查之前 完成所有5条鱼</span>"; playRealisticErrorBeep(); return false; }
  if(good===5){ fb.innerHTML="<span class=\"ok\">真棒！本组完成：5 / 5 👏</span>"; playRealisticApplause(); return true; }
  fb.innerHTML='<span class="bad">'+good+" / 5 correct answers. Fix your answers and try again.</span>"; playRealisticErrorBeep(); return false;
}
function checkAll(show=false){
 let totalGood=0;
 document.querySelectorAll('.serie').forEach((card,i)=>{
   const serie=seriesData[i]; let good=0;
   const fishes=[...card.querySelectorAll('.fish')].slice(1);
   fishes.forEach((fish,idx)=>{
     fish.classList.remove('good','bad');
     const input=fish.querySelector('input');
     const val=Number(input.value.trim());
     const expected=serie.answers[idx];
     if(val===expected){fish.classList.add('good'); good++; totalGood++;}
     else{ fish.classList.add('bad'); if(show) input.value=expected; }
   });
   const fb=document.getElementById('feedback-'+i);
   fb.innerHTML=(good===5) ? "<span class=\"ok\">干得不错!5/5/5</span>" : '<span class="bad">'+good+" / 5 correct answers</span>";
 });
 document.getElementById('scoreBox').textContent="得分 "+totalGood+' / 40';
}
function showAnswers(){checkAll(true);}
function newGame(){buildGame();}
buildGame();
</script>
