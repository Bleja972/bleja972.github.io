const chartData={animals:{names:["盐水鳄","斑鲸","露鲸","象体","大象海豹","绿海龟","企鹅"],values:[120,90,80,40,30,20,8],max:130,step:10,title:"潜水时间(分钟)"},temperature:{names:["星期一,星期一","星期二 星期二","星期三","星期四","星期五,星期五","星期六 星期六","星期日星期日"],values:[8,10,12,13,10,9],max:15,step:1,title:"上午温度(°C)"},horse:{names:['0','6','12','18','24','30','36'],values:[50,250,350,400,450,450,500],max:500,step:50,title:"龙卷风质量(公斤)"}};
function chart(kind,sunday=false){const d=chartData[kind],left=60,bottom=305,height=240,step=92;let s='<svg class="graph" viewBox="0 0 760 415" role="img" aria-label="'+esc(d.title)+'"><text x="60" y="28" font-size="20" font-weight="bold">'+esc(d.title)+'</text>';for(let v=0;v<=d.max;v+=d.step){let y=bottom-v/d.max*height;s+='<line x1="60" y1="'+y+'" x2="715" y2="'+y+'" stroke="#d7dce5"/><text x="48" y="'+(y+5)+'" text-anchor="end" font-size="14">'+v+'</text>'}let pts=[];d.names.forEach((name,i)=>{let x=left+35+i*step,y=bottom-(d.values[i]||0)/d.max*height;if(kind==='animals')s+='<rect x="'+(x-20)+'" y="'+y+'" width="40" height="'+(bottom-y)+'" fill="'+(['#eea02e','#3b9b87','#8c6abe'][i%3])+'" rx="3"/>';else if(i<d.values.length)pts.push(x+','+y);s+='<text transform="translate('+x+' 327) rotate(-35)" text-anchor="end" font-size="14">'+esc(name)+'</text>'});if(pts.length)s+='<polyline points="'+pts.join(' ')+'" stroke="'+(kind==='horse'?'#22866b':'#ed8c35')+'" stroke-width="3" fill="none"/>'+pts.map(pt=>{let [x,y]=pt.split(',');return '<circle cx="'+x+'" cy="'+y+'" r="5" fill="#7351b5"/>'}).join('');if(sunday)s+='<circle id="sundayPoint" cx="647" cy="305" r="7" fill="#1685ac"/>';s+='</svg>';return s}
function drawSunday(v){$('sundayPoint').setAttribute('cy',305-v/15*240);$('sundayValue').textContent=v+' °C'}
function support(p){let h='';if(p.image)h+='<img src="'+p.image+'" alt="Problem picture: '+(aidx===4?"木板周围的蚂蚁":"五箱瓶子")+'">';if(p.table)h+='<div class="tablewrap"><table><thead><tr>'+p.table.headers.map(t=>'<th>'+esc(t)+'</th>').join('')+'</tr></thead><tbody>'+p.table.rows.map(r=>'<tr>'+r.map((v,i)=>'<'+(i?'td':'th')+'>'+esc(v)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</tbody></table></div>';if(p.chart){h+=chart(p.chart,p.graphSunday);if(p.graphSunday)h+="<div class=\"graph-control\"><label for=\"sunday\">星期日点的位置 : <strong id=\"sundayValue\">0°C</strong></label><input id=\"sunday\" type=\"range\" min=\"0\" max=\"15\" step=\"1\" value=\"0\"></div>"}return h}
