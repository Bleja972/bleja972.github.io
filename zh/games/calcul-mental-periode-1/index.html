<style>
:root{--navy:#102a43;--green:#2f855a;--orange:#ed8936;--red:#c53030;--violet:#6b46c1;--text:#172033;--muted:#5f6b7a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#f8fbff,#fffaf4);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:0 auto;padding:20px 14px 40px}.header,.game-top{background:#fff;border:2px solid #dce4ee;border-radius:20px;padding:18px;box-shadow:0 8px 22px rgba(20,40,70,.06)}.brand{font-size:.88rem;font-weight:800;color:#7a5d00;letter-spacing:.03em}h1{margin:5px 0 6px;color:var(--navy);font-size:2rem}.subtitle{margin:0;color:var(--muted);line-height:1.45}.menu{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.skill{background:#fff;border:2px solid #dbe4ee;border-radius:16px;padding:16px;text-align:left;min-height:104px;transition:.15s}.skill:hover{border-color:#8bb7df;transform:translateY(-1px)}.skill strong{display:block;color:var(--navy);font-size:1.02rem;margin-bottom:6px}.skill span{display:block;color:#51606f;line-height:1.35;font-size:.94rem}.skill .num{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;background:var(--navy);color:#fff;margin-right:8px}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fff8e8;border:1px solid #f2d18b;color:#6b4b00;line-height:1.45}.hidden{display:none!important}.game{margin-top:18px}.game-top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.game-title{font-size:1.2rem;font-weight:800;color:var(--navy)}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#eef4fa;border:1px solid #d4dfeb;border-radius:12px;padding:9px 12px;font-weight:800;color:var(--navy)}.timer{min-width:90px;text-align:center;font-size:1.25rem;background:#fff5f5;border-color:#f2b8b8;color:#9b2c2c}.timer.running{background:#fff9db;border-color:#f3d36e;color:#7a5d00}.timer.done{background:#ffe5e5;border-color:#ef9a9a;color:#a61b1b}.instructions{margin:12px 0;text-align:center;color:#4a5968;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.calc{background:#fff;border:2px solid #dde5ee;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center;gap:9px;min-height:90px}.expr{font-size:1.45rem;font-weight:800;color:#26384d;white-space:nowrap}.inline-answer{width:76px;height:50px;border:3px solid #7651b9;border-radius:11px;background:#fff;color:#6b46c1;text-align:center;font-size:1.35rem;font-weight:800;outline:none}.inline-answer:focus{box-shadow:0 0 0 4px rgba(118,81,185,.14)}.answer{width:86px;height:54px;border:3px solid #7651b9;border-radius:11px;background:#fff;color:var(--violet);text-align:center;font-size:1.45rem;font-weight:800;outline:none}.answer:focus{box-shadow:0 0 0 4px rgba(118,81,185,.14)}.calc.correct{border-color:#79c99e;background:#f0fff6}.calc.wrong{border-color:#f3a0a0;background:#fff5f5}.bottom-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.action{border:0;border-radius:12px;padding:12px 17px;min-height:46px;font-weight:800}.primary{background:var(--orange);color:#fff}.secondary{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}.result{margin-top:14px;text-align:center;font-size:1.15rem;font-weight:800;min-height:30px}.small{font-size:.88rem;color:var(--muted)}@media(max-width:800px){.menu{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){h1{font-size:1.55rem}.grid{grid-template-columns:1fr}.calc{min-height:78px}.expr{font-size:1.3rem}}
</style>

<body>
<nav id="ce1-blog-navigation" aria-label="所有游戏" style="position:relative;z-index:1000;display:flex;justify-content:center;padding:10px 14px;background:#173f30"><a href="/zh/?lang=zh" target="_top" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;background:#fff6cf;color:#173f30;font:700 17px/1.3 system-ui,sans-serif;text-decoration:none;min-height:46px;box-shadow:0 2px 5px #0002">查看所有游戏</a></nav>

<div class="app">
<section id="menuPage">
<div class="header">
<div class="brand">小CE1挑战</div>
<h1>心算 — 第1阶段</h1>
<p class="subtitle">选择一个技能。每一组每组包含 <strong>15计算</strong> 持续时间 <strong>3分钟3分钟</strong>.</p>
<div class="note"><strong>当您开始输入第一个答案时, 计时器会自动启动 。</strong></div>
</div>
<div class="menu" id="skillsMenu">
<button class="skill" data-skill="1"><strong><span class="num">1</span>双双</strong><span>了解双重补充事实。</span></button>
<button class="skill" data-skill="2"><strong><span class="num">2</span>近近双双</strong><span>了解近乎双重的附加事实。</span></button>
<button class="skill" data-skill="3"><strong><span class="num">3</span>至10的债券</strong><span>完全加到十号</span></button>
<button class="skill" data-skill="4"><strong><span class="num">4</span>整个 几十</strong><span>从一个数字中添加或减去整数 10。</span></button>
<button class="skill" data-skill="5"><strong><span class="num">5</span>低于10的总数</strong><span>计算或查找缺失的数字。</span></button>
<button class="skill" data-skill="6"><strong><span class="num">6</span>搭桥 10</strong><span>知道10号桥的更多事实</span></button>
<button class="skill" data-skill="7"><strong><span class="num">7</span>减去10</strong><span>计算10减去一个数字。</span></button>
</div>
</section>
<section id="gamePage" class="game hidden">
<div class="game-top"><div><div class="small">技能技能</div><div class="game-title" id="gameTitle"></div></div><div class="badges"><div class="badge">15计算</div><div class="badge timer" id="timer">3:00</div><div class="badge" id="scoreBadge">得分</div></div></div>
<div class="instructions" id="batchInfo">第3组第1组——完成5项计算。定时器从第一个类型开始 。</div>
<div class="grid" id="calcGrid"></div>
<div class="bottom-actions"><button class="action primary hidden" id="checkBtn">检查答案</button><button class="action green" id="newBtn">新题组</button><button class="action secondary" id="menuBtn">返回菜单</button></div>
<div class="result" id="result" aria-live="polite"></div>
</section>
</div>
<script>
const SKILLS={1:{title:"双双"},2:{title:"近近双双"},3:{title:"至10的债券"},4:{title:"添加或减去 10"},5:{title:"低于10的总数"},6:{title:"以桥接10加"},7:{title:"减去10"}};
let currentSkill=null,exercises=[],answers=[],currentBatch=0,started=false,ended=false,remaining=180,timerId=null,fifthAnswerTimer=null,fifthSecondsLeft=0;
const menuPage=document.getElementById('menuPage'),gamePage=document.getElementById('gamePage'),gameTitle=document.getElementById('gameTitle'),grid=document.getElementById('calcGrid'),timerEl=document.getElementById('timer'),scoreBadge=document.getElementById('scoreBadge'),result=document.getElementById('result');
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}function choice(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function keyOf(e){return e.text+'='+e.answer}
function generateOne(skill){
if(skill===1){const a=randInt(1,10);return{text:`${a} + ${a}`,answer:a+a}}
if(skill===2){const a=randInt(1,9);let b=a+(Math.random()<.5?-1:1);if(b<1)b=a+1;if(b>10)b=a-1;return Math.random()<.5?{text:`${a} + ${b}`,answer:a+b}:{text:`${b} + ${a}`,answer:a+b}}
if(skill===3){const a=randInt(1,9),b=10-a,t=randInt(1,3);if(t===1)return{text:`${a} + □ = 10`,answer:b};if(t===2)return{text:`□ + ${b} = 10`,answer:a};return{text:`10 = ${a} + □`,answer:b}}
if(skill===4){const n=randInt(10,89);if(Math.random()<.55){const t=choice([10,20,30,40,50]);return{text:`${n} + ${t}`,answer:n+t}}const opts=[10,20,30,40,50].filter(x=>x<=Math.floor(n/10)*10);const t=choice(opts.length?opts:[10]);return{text:`${n} − ${t}`,answer:n-t}}
if(skill===5){const a=randInt(0,8),b=randInt(0,9-a),sum=a+b,t=randInt(1,3);if(t===1)return{text:`${a} + ${b}`,answer:sum};if(t===2)return{text:`${a} + □ = ${sum}`,answer:b};return{text:`${sum} = □ + ${b}`,answer:a}}
if(skill===6){let a,b;do{a=randInt(4,9);b=randInt(2,9)}while(a+b<=10||a+b>18);return{text:`${a} + ${b}`,answer:a+b}}
const a=randInt(0,10);return{text:`10 − ${a}`,answer:10-a}}
function generateBatch(skill){
  const arr=[],seen=new Set();
  let guard=0;
  while(arr.length<5 && guard<1000){
    guard++;
    const ex=generateOne(skill),k=keyOf(ex);
    if(!seen.has(k)){seen.add(k);arr.push(ex)}
  }
  return shuffle(arr);
}
function generateExercises(skill){
  return [...generateBatch(skill),...generateBatch(skill),...generateBatch(skill)];
}
function resetTimer(){clearInterval(timerId);timerId=null;clearInterval(fifthAnswerTimer);fifthAnswerTimer=null;fifthSecondsLeft=0;started=false;ended=false;remaining=180;timerEl.textContent='3:00';timerEl.classList.remove('running','done')}
function updateTimer(){timerEl.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function startTimer(){if(started||ended)return;started=true;timerEl.classList.add('running');timerId=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timerId);timerId=null;endRound(true)}},1000)}
function renderGame(){
  resetTimer();
  scoreBadge.textContent="得分";
  result.textContent='';
  exercises=generateExercises(currentSkill);
  answers=Array(15).fill('');
  currentBatch=0;
  gameTitle.textContent=SKILLS[currentSkill].title;
  renderBatch();
}

function renderBatch(){
  if(ended)return;
  clearInterval(fifthAnswerTimer);
  fifthAnswerTimer=null;
  fifthSecondsLeft=0;

  grid.innerHTML='';
  const startIndex=currentBatch*5;
  const batchInfo=document.getElementById('batchInfo');
  batchInfo.textContent=`设置套设 ${currentBatch+1} 3——完成5项计算。`;

  exercises.slice(startIndex,startIndex+5).forEach((ex,localIndex)=>{
    const i=startIndex+localIndex;
    const card=document.createElement('div');
    card.className='calc';

    if(ex.text.includes('□')){
      const parts=ex.text.split('□');
      card.innerHTML=`<span class="expr">${parts[0]}</span><input class="answer inline-answer" data-index="${i}" data-local="${localIndex}" inputmode="numeric" autocomplete="off" aria-label="Answer to calculation ${i+1}" value="${answers[i]}"><span class="expr">${parts[1]||''}</span>`;
    }else{
      card.innerHTML=`<span class="expr">${ex.text} =</span><input class="answer" data-index="${i}" data-local="${localIndex}" inputmode="numeric" autocomplete="off" aria-label="Answer to calculation ${i+1}" value="${answers[i]}">`;
    }

    grid.appendChild(card);
  });

  const inputs=[...document.querySelectorAll('.answer')];

  function advanceBatch(){
    clearInterval(fifthAnswerTimer);
    fifthAnswerTimer=null;
    fifthSecondsLeft=0;
    inputs.forEach(x=>x.disabled=true);

    if(currentBatch<2){
      currentBatch++;
      renderBatch();
    }else{
      endRound(false);
    }
  }

  function startFifthGracePeriod(){
    if(fifthAnswerTimer || ended) return;

    fifthSecondsLeft=15;
    batchInfo.textContent=`第五答案:另一个 ${fifthSecondsLeft} s 完成打字。`;

    fifthAnswerTimer=setInterval(()=>{
      fifthSecondsLeft--;
      if(fifthSecondsLeft>0){
        batchInfo.textContent=`第五答案:另一个 ${fifthSecondsLeft} s 完成打字。`;
      }else{
        clearInterval(fifthAnswerTimer);
        fifthAnswerTimer=null;
        batchInfo.textContent="移动到下一组...";
        advanceBatch();
      }
    },1000);
  }

  inputs.forEach((inp,localIdx)=>{
    inp.addEventListener('input',()=>{
      const i=Number(inp.dataset.index);
      answers[i]=inp.value.trim();

      if(answers[i]!==''&&!started&&!ended) startTimer();

      const batchStart=currentBatch*5;
      const firstFourComplete=answers.slice(batchStart,batchStart+4).every(v=>v!=='');
      const fifthHasStarted=answers[batchStart+4]!==''; 

      if(firstFourComplete && fifthHasStarted && !ended){
        const fifthIndex=batchStart+4;
        const fifthValue=Number(answers[fifthIndex]);

        // Si la 5e réponse est juste, on passe immédiatement à la série suivante.
        if(fifthValue===exercises[fifthIndex].answer){
          clearInterval(fifthAnswerTimer);
          fifthAnswerTimer=null;
          fifthSecondsLeft=0;
          advanceBatch();
        }else{
          // Sinon, on laisse jusqu'à 15 secondes pour terminer/corriger la saisie.
          startFifthGracePeriod();
        }
      }
    });

    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();

        // Sur la 5e opération, Entrée permet de valider sans attendre les 15 secondes.
        if(localIdx===4 && inp.value.trim()!==''){
          answers[Number(inp.dataset.index)]=inp.value.trim();
          advanceBatch();
          return;
        }

        const next=inputs[localIdx+1];
        if(next) next.focus();
      }
    });
  });

  if(inputs[0]) inputs[0].focus();
}
function endRound(fromTimer=false){
  if(ended)return;
  ended=true;
  clearInterval(timerId);
  timerId=null;
  clearInterval(fifthAnswerTimer);
  fifthAnswerTimer=null;
  timerEl.classList.remove('running');

  if(fromTimer){
    remaining=0;
    updateTimer();
    timerEl.classList.add('done');
  }

  // Save whatever is currently visible before grading.
  document.querySelectorAll('.answer').forEach(inp=>{
    answers[Number(inp.dataset.index)]=inp.value.trim();
    inp.disabled=true;
  });

  let score=0;
  answers.forEach((val,i)=>{
    if(val!=='' && Number(val)===exercises[i].answer) score++;
  });

  scoreBadge.textContent=`得分 ${score} / 15`;
  result.textContent=fromTimer
    ? `时间到了!你有过 ${score} 答案${score>1?'s':''} 正确${score>1?'s':''} 15个中`
    : `设置完整 : ${score} / 15.`;

  const batchInfo=document.getElementById('batchInfo');
  batchInfo.textContent="所有15项计算都完成了";
}
function openSkill(skill){currentSkill=Number(skill);menuPage.classList.add('hidden');gamePage.classList.remove('hidden');renderGame();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.skill').forEach(btn=>btn.addEventListener('click',()=>openSkill(btn.dataset.skill)));document.getElementById('checkBtn').addEventListener('click',()=>endRound(false));document.getElementById('newBtn').addEventListener('click',renderGame);document.getElementById('menuBtn').addEventListener('click',()=>{clearInterval(timerId);timerId=null;gamePage.classList.add('hidden');menuPage.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})});
</script>
