<header><a href="/zh/?lang=zh" style="display:inline-block;color:inherit;margin-bottom:12px">所有数学游戏</a><h1>心算 CP</h1><div>我以自己的速度学习!</div></header><main><section id="home"><div class="panel"><h2>选择挑战</h2><div class="bar"><strong>计时器:3分钟</strong><span>每项挑战最多计算12次</span></div><p>阅读计算结果,输入答案并检查它。使用屏幕上的数字键盘或键盘。</p></div><div id="levels" class="grid"></div></section>
<section id="play" class="hidden"><div class="panel"><div class="bar"><button id="back">首页</button><strong id="clock" aria-live="off"></strong><span id="count"></span></div><h2 id="leveltitle"></h2><progress id="progress" value="0" max="12"></progress><form id="form"><div class="equation" id="equation"></div><div style="text-align:center"><input id="answer" class="answer" inputmode="numeric" autocomplete="off" aria-label="你的答案" type="text" maxlength="3"><button class="primary" id="validate" type="button">检查答案</button></div></form><div class="keys" id="keys"></div><div class="bar"><button id="help">提示</button><button id="speak">监听计算</button></div><div id="hint" class="hint hidden"></div><p id="feedback" class="feedback" role="status"></p><div style="text-align:center"><button id="next" class="primary hidden">下一道计算</button></div></div></section>
<section id="result" class="hidden"><div class="panel"><h2 id="resulttitle"></h2><p id="score"></p><p id="timeinfo"></p><div class="bar"><button id="again" class="primary">再次播放新计算</button><button id="return">菜单</button></div></div><div class="panel"><h2>我的答案</h2><table><thead><tr><th>计算计算</th><th>我的答案</th><th>解决方案</th></tr></thead><tbody id="review"></tbody></table></div><div class="decouvrir-autre-jeu"><strong>准备好再玩一场了吗?</strong><span>简单添加</span><a href="/zh/games/les-petites-additions/">发现此游戏  ⁇ </a></div></section></main><script>
const titles=["加或减1", "加或减2", "双双", "近近双双", "加加总额低于10", "添加或减去 10", "加或减1或2", "10 make 10", "减去10", "数字翻倍,最多10", "十倍的双倍倍数", "由搭桥10加", "下个乘以 10", "添加小于 9 的数", "将2到20之间的数字甚至减半", "添加或减去 10", "加上或减去20、30、40、50、60、70、80或90", "混合计算", "混合计算", "添加9", "从乘以 10 中减去", "从乘以 10 中减去", "接近双倍的操作", "10以下的总加总总数", "总桥 10", "总桥 10", "混合计算", "混合计算", "混合计算", "加上或减去10、20、30、40、50、60、70、80或90", "了解从1到10的附加事实", "添加小于 9 的数", "混合计算", "混合计算"];
const $=id=>document.getElementById(id);let pool,questions,current=0,level=0,records=[],locked=false,interval,startTime=null,limit=180,retryDeadline=null,active=false;let saved={};try{saved=JSON.parse(localStorage.getItem('calculCPscoresEnglish')||'{}')}catch(e){}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makePool(n){let out=[];const add=(a,b,op='+',hole=false)=>{let r=op==='+'?a+b:a-b;if(r<0||r>100)return;out.push({a,b,op,r,hole,answer:hole?b:r,text:hole?`${a} ${op} ? = ${r}`:`${a} ${op} ${b} = ?`})};
for(let a=0;a<=100;a++)for(let b=1;b<=90;b++){
if(n===0&&a>=1&&a<=9&&b===1){add(a,b);add(a,b,'−')}
if(n===1&&a>=2&&a<=8&&b===2){add(a,b);add(a,b,'−')}
if(n===2&&a>=1&&a<=5&&a===b)add(a,b);
if([3,22].includes(n)&&a>=1&&a<=(n===3?4:9)&&Math.abs(a-b)===1){add(a,b);if(n===3)add(a,b,'+',true)}
if([4,23].includes(n)&&a>=1&&a+b<10){add(a,b);if(n===4)add(a,b,'+',true)}
if(n===5&&((a===10&&b<=9)||(a<=9&&b===10)))add(a,b);
if(n===5&&a>=11&&a<=19&&b===10)add(a,b,'−');
if(n===6&&a>=11&&a<=19&&b<=2){add(a,b);add(a,b,'−')}
if(n===7&&a>=1&&a<=9&&a+b===10)add(a,b,'+',true);
if(n===8&&a===10&&b<=9)add(a,b,'−');
if(n===9&&a>=1&&a<=10&&a===b)add(a,b);
if(n===10&&a>=10&&a<=50&&a%10===0&&a===b)add(a,b);
if([11,24,25].includes(n)&&a>=2&&a<=9&&b<=9&&a+b>10)add(a,b);
if(n===12&&a>=11&&a<=89&&a%10>0&&b===10-a%10)add(a,b,'+',true);
if([13,31].includes(n)&&a>=11&&a<=89&&b<9)add(a,b);
if(n===14&&a>=2&&a<=20&&a%2===0&&b===a/2)out.push({a,b,op:"基本基础设施",r:b,answer:b,text:`半数半 ${a} = ?`});
if(n===15&&a>=11&&a<=99&&b===10){add(a,b);add(a,b,'−')}
if([16,29].includes(n)&&a>=10&&a<=99&&b%10===0&&b>=(n===16?20:10)){add(a,b);add(a,b,'−')}
if(n===19&&a>=11&&a<=90&&b===9)add(a,b);
if([20,21].includes(n)&&a>=10&&a<=90&&a%10===0&&b<=9)add(a,b,'−');
if(n===30&&a>=1&&a<=10&&b<=10){add(a,b);add(a,b,'+',true)}
if([17,18,26,27,28,32,33].includes(n)){
if(a>=1&&a<=9&&b<=9)add(a,b);
if(n!==26&&a>=11&&a<=89&&((b<=9)||(b%10===0))){add(a,b);if(b===1||b===2||b%10===0)add(a,b,'−');if(a%10&&b===10-a%10)add(a,b,'+',true)}
}}
return [...new Map(out.map(q=>[q.text,q])).values()]}
function home(){active=false;retryDeadline=null;clearInterval(interval);if(window.speechSynthesis)speechSynthesis.cancel();$("home").classList.remove('hidden');$("play").classList.add('hidden');$('result').classList.add('hidden');$('levels').innerHTML='';titles.forEach((t,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<small>挑战挑战挑战 ${i+1}</small><strong>${t}</strong><small>${saved[i]!==undefined?"最佳得分 : "+saved[i]+' %':"试试这个挑战"}</small>`;b.onclick=()=>begin(i);$('levels').append(b)})}
function begin(i){level=i;pool=makePool(i);questions=shuffle(pool).slice(0,12);records=[];current=0;limit=180;startTime=null;retryDeadline=null;active=true;$("home").classList.add('hidden');$('result').classList.add('hidden');$("play").classList.remove('hidden');$('leveltitle').textContent=titles[i];clearInterval(interval);tick();render()}
function startClock(){if(startTime!==null)return;startTime=Date.now();tick();interval=setInterval(tick,250)}
function tick(){if(!active)return;const s=startTime===null?0:Math.floor((Date.now()-startTime)/1000);let t=limit?Math.max(0,limit-s):s;$('clock').textContent=(limit?"剩余时间 : ":"时间 : ")+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(startTime===null)$('clock').textContent+=" 轮到你了!";if(startTime!==null&&s>=limit){finish(true);return}if(retryDeadline!==null){const remaining=Math.max(0,Math.ceil((retryDeadline-Date.now())/1000));if(remaining===0){advance();if(active){$('feedback').className='feedback error';$('feedback').textContent="继续下一个计算。轮到你了!"}return}$('feedback').textContent="再试一次!剩余时间 : "+remaining+" S. 秒"}}
function render(){retryDeadline=null;locked=false;$("answer").value='';$("answer").disabled=false;$('validate').disabled=false;$('count').textContent=`${current+1} / ${questions.length}`;$('progress').max=questions.length;$('progress').value=current;$('equation').textContent=questions[current].text;$('feedback').textContent='';$('feedback').className='feedback';$("hint").classList.add('hidden');$("next").classList.add('hidden');$("next").textContent=current===questions.length-1?"见我的成绩":"下一道计算";if(matchMedia("(pointer:fine)").matches)$("answer").focus()}
function validateAnswer(){
if(locked||!/^\d+$/.test($("answer").value)){if(!locked)$('feedback').textContent="在检查前输入数字 。";return}
startClock();const q=questions[current],v=+$("answer").value,ok=v===q.answer;
if(!records[current])records[current]={q,v,ok};
if(!ok){if(retryDeadline===null)retryDeadline=Date.now()+15000;$('feedback').className='feedback error';$('feedback').textContent="再试一次！";$('feedback').style.color='#934910';$("answer").value='';$("answer").focus();return}
advance();if(!active)return;
$('feedback').className='feedback success';$('feedback').textContent="干得不错!没错!";$('feedback').style.color='#146d5b';
}
$('validate').onclick=validateAnswer;
$('form').onsubmit=e=>{e.preventDefault();validateAnswer()};
function advance(){retryDeadline=null;locked=true;current++;if(current===questions.length)finish(false);else render()}
$("next").onclick=advance;
function finish(expired){active=false;retryDeadline=null;clearInterval(interval);$("play").classList.add('hidden');$('result').classList.remove('hidden');const good=records.filter(r=>r.ok).length,pct=Math.round(good/questions.length*100);$('resulttitle').textContent=expired?"时间到了!":"练习做得好!";$("score").textContent=`${good} 校正第一解答 ${questions.length} 计算: ${pct} 成功百分率`;$('timeinfo').textContent=`${records.length} 已解答计算 / ${(startTime===null?0:Math.floor((Date.now()-startTime)/1000))} 秒 □ ${titles[level]}`;$('review').innerHTML=questions.map((q,i)=>{let r=records[i];return `<tr><td>${q.text}</td><td>${r?(r.ok?'✓ ':'')+r.v:"未答复"}</td><td>${q.answer}</td></tr>`}).join('');saved[level]=Math.max(saved[level]||0,pct);try{localStorage.setItem('calculCPscoresEnglish',JSON.stringify(saved))}catch(e){}}
$('help').onclick=()=>{let q=questions[current],h;if(q.op==="基本基础设施")h="将数字分成两个等式组。";else if(q.hole)h=`查找您需要添加的内容 ${q.a} 要做出 ${q.r}.`;else if(q.a===q.b)h="乘以两倍,乘以相同数量两次";else if(q.b===9&&q.op==='+')h="加10,再减去1。";else if(q.b%10===0)h="使用十。都一样";else if(q.op==='−')h=`开始于 ${q.a} 返回计数 ${q.b}.`;else if(q.a%10+q.b>10&&q.b<10)h=`添加首加 ${10-q.a%10} 以达到下一个乘以10,然后加上其余的。`;else h=`开始于 ${q.a} 并依赖 ${q.b}.`;$("hint").textContent=h;$("hint").classList.toggle('hidden')};
$('speak').onclick=()=>{if(!window.speechSynthesis){$('feedback').textContent="此设备上无法提供语音 。";return}speechSynthesis.cancel();let q=questions[current];let text=q.op==="基本基础设施"?`何为 ${q.a} ?`:q.hole?`${q.a} 加什么等于什么 ${q.r} ?`:`${q.a} ${q.op==='+'?'plus':'minus'} ${q.b} 等于什么?`;let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)};
for(let v of ['1','2','3','4','5','6','7','8','9',"清空",'0','⌫']){let b=document.createElement('button');b.textContent=v;b.type='button';b.setAttribute('aria-label',v==='⌫'?"删除最后一个数字":v);b.onclick=()=>{if(locked)return;if(v==="清空")$("answer").value='';else if(v==='⌫')$("answer").value=$("answer").value.slice(0,-1);else if($("answer").value.length<3){$("answer").value+=v;startClock()}};$('keys').append(b)}
$("answer").oninput=()=>{$("answer").value=$("answer").value.replace(/\D/g,'');if($("answer").value)startClock()};$("back").onclick=home;$('return').onclick=home;$('again').onclick=()=>begin(level);home();
</script><script src="/assets/catalogue-v2/runtime-zh.js?v=1" defer></script></body></html>
