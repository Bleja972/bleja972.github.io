<html lang="zh-Hans" translate="no" class="notranslate"><head><base href="https://bleja972.github.io/additions_posees_sans_echange/"><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Jeu CE1 pour apprendre les additions posées sans échange à deux et trois chiffres. Colonnes colorées, aide, correction et score."><title>不进位竖式加法</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#263e36;font:18px/1.5 Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1.5px solid #bccbbf;border-radius:13px;padding:12px 18px;min-height:48px;background:white;color:#254c3d;font-weight:700}button:hover{background:#edf4e9}button:disabled{opacity:.6;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b87d15;outline-offset:4px}.primary{background:#205944;color:white;border-color:#205944}.primary:hover{background:#2e7158}.top{max-width:960px;margin:auto;padding:24px 20px 10px}.top small{font-weight:bold;letter-spacing:2px;color:#557364}h1{font-size:clamp(27px,5vw,39px);margin:5px 0}h2{font-size:25px;margin:0 0 12px}p{margin:10px 0 18px}main{max-width:960px;margin:10px auto;padding:0 20px 30px}.panel{background:white;border:1px solid #dce4d8;border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:0 8px 24px #3049380b}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.levels button{padding:22px 15px;text-align:left;border:2px solid #d7e2d3}.levels strong{display:block;font-size:21px}.levels span{display:block;font-weight:normal;font-size:16px;margin-top:9px}.level-number{font-weight:bold!important;color:#767048;font-size:13px!important;letter-spacing:1px}.example{font-size:27px!important;font-weight:bold!important;color:#205944}.rule{border-left:4px solid #dbb854;background:#faf7e9;border-radius:8px;padding:13px 16px;font-size:16px}.status{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px;font-weight:bold}.status button{font-size:14px;padding:8px 12px}.progress{height:8px;background:#e6ecdf;border-radius:8px;overflow:hidden;margin:17px 0 25px}.progress span{display:block;height:100%;background:#dfb348}.play-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}.operation{--cell:72px;display:grid;grid-template-columns:34px repeat(var(--cols),var(--cell));justify-content:center;gap:8px;margin:12px auto 22px;text-align:center;align-items:center}.colhead{font-size:13px;line-height:1.3;font-weight:bold;padding:10px 1px;border-radius:10px}.colhead strong{display:block;font-size:22px}.c{background:#e3f0df;color:#245e32}.d{background:#fff2bb;color:#745800}.u{background:#fce7e3;color:#a42526}.digit{font-size:43px;line-height:1.25;font-variant-numeric:tabular-nums;padding:6px 0}.plus{font-size:32px}.sumline{height:3px;background:#344a3d;grid-column:1/-1}.result-input{width:100%;height:69px;border:2px solid #adc1af;border-radius:12px;text-align:center;font-size:39px;color:#213f32;min-width:0;background:#fffcf5;font-variant-numeric:tabular-nums}.result-input[data-place="0"]{background:#fff3f0}.result-input[data-place="1"]{background:#fff9dc}.result-input[data-place="2"]{background:#f0f7ec}.result-input.good{border-color:#308448;background:#ecf7e7}.result-input.bad{border-color:#bb4535;background:#fff1e9}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.feedback{font-size:18px;font-weight:bold;min-height:58px;line-height:1.5}.goodtext{color:#226239}.badtext{color:#a03929}.muted{font-size:14px;color:#647368}.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.legend span{padding:4px 10px;border-radius:8px;font-size:13px;font-weight:bold}.help{background:#f4f7ed;border:1px solid #dce6d3;padding:16px;border-radius:14px;font-size:16px}.help ol{padding-left:22px;margin:8px 0}.help li{margin:8px 0}.big-score{font-size:54px;font-weight:bold;color:#205944;margin:16px 0}.review-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.review-list div{background:#f2f5ec;padding:12px;border-radius:12px}.review-list small{display:block;font-size:13px;color:#697266}.center{text-align:center}footer{text-align:center;margin:26px 0 0;font-size:14px}footer a{color:#285e47}[hidden]{display:none!important}@media(max-width:720px){.play-layout{grid-template-columns:1fr;gap:4px}.levels{grid-template-columns:1fr;gap:12px}.levels button{padding:16px}.levels .example{float:right;margin:0}.panel{padding:18px}main{padding:0 12px 25px}.operation{--cell:66px;gap:7px}.actions button{flex:1}.review-list{grid-template-columns:1fr}.top{padding:20px 16px 8px}}@media(max-width:360px){.operation{--cell:58px;grid-template-columns:26px repeat(var(--cols),var(--cell));gap:5px}.digit{font-size:36px}.result-input{font-size:34px;height:60px}.colhead{font-size:11px}}
</style><style id="decouvrir-autre-jeu-style">.decouvrir-autre-jeu{margin:20px 0 8px;padding:16px;border:2px solid #cde9dc;border-radius:16px;background:#f0faf3;color:#163f31;text-align:center;font-family:Arial,sans-serif}.decouvrir-autre-jeu strong{display:block;font-size:17px;line-height:1.35;margin-bottom:6px}.decouvrir-autre-jeu span{display:block;font-size:15px;margin-bottom:11px}.decouvrir-autre-jeu a{display:inline-block;background:#f9bb3d!important;color:#332300!important;border:2px solid #b97b10;border-radius:11px;padding:10px 15px;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #ac750f}.decouvrir-autre-jeu a:focus-visible{outline:3px solid #1769aa;outline-offset:3px}[data-end]>.panel{max-height:95%;overflow-y:auto}</style></head><body><header class="top"><small>MATH − CE1</small><h1>不进位竖式加法</h1><p>我把数字排成一行,加个字,不重新组合</p></header><main><section class="panel" id="menu"><h2>选择您的级别</h2><p>每场比赛增加10个慢慢来,从那些开始</p><div class="levels"><button data-level="0"><span class="level-number">1级</span><strong>两位数</strong><span class="example">24 + 35</span><span>10个和1个</span></button><button data-level="1"><span class="level-number">2级</span><strong>三位数</strong><span class="example">243 + 125</span><span>数以百计,几十个和几个。</span></button><button data-level="2"><span class="level-number">3级</span><strong>排队</strong><span class="example">243 + 35</span><span>3位数和2位数</span></button></div><div class="rule"><strong>在不重组的情况下:</strong> 每栏的总和小于10。不需要携带。</div></section><section class="panel" id="play" hidden><div class="status"><span id="round"></span><span id="score"></span><button id="menuButton">变化水平</button></div><div class="progress" role="progressbar" aria-label="完成的添加" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span id="bar"></span></div><div class="play-layout"><div><div id="operation" class="operation"></div><div class="legend"><span class="c" id="legendC">H:数百</span><span class="d">T:十</span><span class="u">O:一</span></div><p class="muted center">每个盒子写一个数字<br>从右边的盒子开始</p></div><div><h2>轮到你计算了!</h2><p id="instruction">添加那些,然后是十。</p><form id="form"><div class="actions"><button class="primary" id="verify" type="button">检查答案</button><button id="erase" type="button">清空</button></div></form><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="helpButton" aria-expanded="false" aria-controls="help">提示</button><button id="solutionButton">显示解答</button></div><div id="help" class="help" hidden></div><button class="primary" id="next" hidden>下一道加法</button></div></div></section><section class="panel center" id="end" hidden><h2>练习做得好!</h2><div class="big-score" id="finalScore"></div><p id="finalPercent"></p><p class="muted">在未显示解决方案的情况下,在第一次尝试时添加正确字句可赚到一分。</p><div class="review-list" id="review"></div><div class="actions"><button class="primary" id="again">再次播放此关</button><button id="back">选择难度</button></div><div class="decouvrir-autre-jeu"><strong>准备好再玩一场了吗?</strong><span>加上重新组合的列</span><a href="/zh/games/additions-posees-avec-echanges/">发现此游戏  ⁇ </a></div></section><footer><span>更新版本 * 2</span><br><a href="/zh/?lang=zh" target="_top">在博客上看到所有游戏</a></footer></main><script>
const $=id=>document.getElementById(id);const labels=["两位数","三位数","排队"];let level=0,list=[],index=0,points=0,attempted=false,locked=false,log=[];
function shuffle(a){const b=[...a];for(let k=b.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[b[k],b[j]]=[b[j],b[k]]}return b}
function noExchange(a,b){while(a||b){if(a%10+b%10>=10)return false;a=Math.floor(a/10);b=Math.floor(b/10)}return true}
function generate(l){const amin=l===0?10:100,amax=l===0?99:999,bmin=l===1?100:10,bmax=l===1?999:99;const pool=[];for(let a=amin;a<=amax;a++){for(let b=bmin;b<=bmax;b++){if(noExchange(a,b))pool.push({a,b})}}return shuffle(pool).slice(0,10)}
function start(l){level=l;list=generate(l);index=0;points=0;log=[];$("菜单").hidden=true;$('end').hidden=true;$("开始游戏").hidden=false;render()}
function inputs(){return [...document.querySelectorAll('.result-input')]}
function updateScore(){$("得分").textContent=`得分 ${points} / 10 · ${points*10} %`}
function render(){locked=false;attempted=false;const {a,b}=list[index],cols=level===0?2:3;$('round').textContent=`${labels[level]} · 增加 ${index+1} / 10`;updateScore();$('bar').style.width=index*10+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',index);$('operation').style.setProperty('--cols',cols);$('operation').replaceChildren();const blank=()=>{const s=document.createElement('span');s.setAttribute('aria-hidden','true');return s};$('operation').append(blank());const names=cols===3?["百位","十位","个位"]:["十位","个位"];names.forEach(n=>{let s=document.createElement('div');s.className='colhead '+n[0].toLowerCase();s.innerHTML='<strong>'+n[0]+'</strong>'+n;$('operation').append(s)});for(const [k,n] of [a,b].entries()){$('operation').append(k===0?blank():Object.assign(document.createElement('span'),{className:'plus',textContent:'+'}));String(n).padStart(cols,' ').split('').forEach(d=>{let s=document.createElement('span');s.className='digit';s.textContent=d;$('operation').append(s)})}let line=document.createElement('div');line.className='sumline';$('operation').append(line,blank());names.forEach((n,k)=>{let input=document.createElement('input');input.className='result-input';input.type='text';input.inputMode='numeric';input.maxLength=1;input.autocomplete='off';input.setAttribute('aria-label',"数码 "+n.toLowerCase());input.setAttribute('form','form');input.dataset.place=cols-1-k;input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'').slice(-1);input.classList.remove('bad','good');input.removeAttribute('aria-invalid');if(input.value&&k>0)inputs()[k-1].focus()});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verifyAnswer();return}if(e.key==='ArrowLeft'&&k>0){e.preventDefault();inputs()[k-1].focus()}if(e.key==='ArrowRight'&&k<cols-1){e.preventDefault();inputs()[k+1].focus()}});$('operation').append(input)});$('legendC').hidden=cols===2;$('instruction').textContent=cols===2?"添加那些,然后是十。":"加上那些,再加几十和几百个";$('feedback').textContent='';$('feedback').className='feedback';$('help').hidden=true;$('helpButton').setAttribute('aria-expanded','false');$('helpButton').textContent="提示";$("下一题").hidden=true;$("下一题").textContent=index===9?"查看成绩 ★":"下一道加法";$('verify').disabled=false;$('erase').disabled=false;$('solutionButton').disabled=false;$('help').innerHTML="<strong>正确的方法</strong><ol><li>看看这些: "+a%10+' + '+b%10+"把他们的总数写进红箱里</li><li>移动到十: "+Math.floor(a/10)%10+' + '+Math.floor(b/10)%10+'.</li>'+(cols===3?"<li>以百计结束: "+Math.floor(a/100)+' + '+Math.floor(b/100)+"空列值为零 。</li>":'')+"</ol><span>每栏中的总数维持在10以下。</span>";inputs().at(-1).focus()}
function finishRound(first){locked=true;if(first)points++;log.push({...list[index],first});updateScore();inputs().forEach(i=>i.disabled=true);$('verify').disabled=true;$('erase').disabled=true;$('solutionButton').disabled=true;$("下一题").hidden=false;}
function verifyAnswer(){if(locked)return;const cells=inputs(),empty=cells.filter(i=>!i.value);if(empty.length){$('feedback').className='feedback badtext';$('feedback').textContent="检查前填满所有箱子";empty.at(-1).focus();return}const {a,b}=list[index],expected=String(a+b);let correct=true;cells.forEach((input,k)=>{const good=input.value===expected[k];input.classList.toggle('good',good);input.classList.toggle('bad',!good);input.setAttribute('aria-invalid',String(!good));if(!good)correct=false});if(correct){const first=!attempted;finishRound(first);$('feedback').className='feedback goodtext';$('feedback').textContent=`真棒！ ${a} + ${b} = ${a+b}.`+(first?" 你赚了一分!":" 你纠正了你的补充!")}else{attempted=true;$('feedback').className='feedback badtext';$('feedback').textContent="用橙色盒子重新计算柱子。先从那些开始";cells.filter(c=>c.classList.contains('bad')).at(-1).focus()}};
$('verify').onclick=verifyAnswer;$('form').onsubmit=e=>{e.preventDefault();verifyAnswer()};
$('erase').onclick=()=>{if(locked)return;inputs().forEach(c=>{c.value='';c.classList.remove('bad','good');c.removeAttribute('aria-invalid')});$('feedback').textContent='';inputs().at(-1).focus()};$('helpButton').onclick=()=>{const open=$('help').hidden;$('help').hidden=!open;$('helpButton').setAttribute('aria-expanded',String(open));$('helpButton').textContent=open?"隐藏提示":"提示"};
$('solutionButton').onclick=()=>{if(locked)return;attempted=true;const {a,b}=list[index];inputs().forEach((c,k)=>{c.value=String(a+b)[k];c.classList.add('good')});finishRound(false);$('feedback').className='feedback';$('feedback').textContent=`解决办法: ${a} + ${b} = ${a+b}逐列检查计算栏。`};
$("下一题").onclick=()=>{if(!locked)return;if(++index<10)render();else finish()};function finish(){$("开始游戏").hidden=true;$('end').hidden=false;$('finalScore').textContent=points+' / 10';$('finalPercent').textContent=points*10+" % 纠正了第一次尝试";$('review').replaceChildren();log.forEach(r=>{const d=document.createElement('div');d.textContent=(r.first?'✓ ':"审查: ")+r.a+' + '+r.b+' = '+(r.a+r.b);const small=document.createElement('small');small.textContent=r.first?"第一次尝试时正确":"实践期间纠正";d.append(small);$('review').append(d)})}
function menu(){$("菜单").hidden=false;$("开始游戏").hidden=true;$('end').hidden=true}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(Number(b.dataset.level)));$('menuButton').onclick=menu;$('again').onclick=()=>start(level);$("返回").onclick=menu;
</script><script src="/assets/catalogue-v2/runtime-zh.js?v=1" defer></script></body></html>
