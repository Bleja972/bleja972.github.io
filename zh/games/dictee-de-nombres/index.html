  const series=[

    {asc:false, nums:[498,489,948,849,894]}
  ];
  const item=series[i % series.length];
  const nums=[...item.nums];
  const target=[...nums].sort((a,b)=>item.asc?a-b:b-a);
  const order=[];
  return{
    t:`命令从 ${item.asc?"最小至最大":"最大至最小"}.`,
    h:`<div class="order">${nums.map(n=>`<button class="chip" style="color:#12324a" data-n="${n}">${n}</button>`).join('')}</div>
       <div class="order">${target.map(()=>'<div class="slot">?</div>').join('')}</div>
       <div class="mn3tools"><button type="button" class="eraseBtn" id="eraseOrder">清空</button></div>`,
    s:()=>{
      current.order=order;
      const slots=[...document.querySelectorAll('.slot')];
      const chips=[...document.querySelectorAll('.chip')];
      const refresh=()=>{
        slots.forEach((slot,k)=>slot.textContent=order[k]??'?');
        chips.forEach(btn=>{
          const used=order.includes(+btn.dataset.n);
          btn.disabled=used;
          btn.style.opacity=used?'.35':'1';
        });
      };
      chips.forEach(b=>b.onclick=()=>{
        if(b.disabled || order.length>=slots.length)return;
        order.push(+b.dataset.n);
        refresh();
      });
      const erase=$('eraseOrder');
      if(erase) erase.onclick=()=>{
        order.length=0;
        refresh();
      };
    },
    c:()=>JSON.stringify(order)===JSON.stringify(target),
    a:target.join(' – ')
  }
}

function parityModel(n){
  let remaining=n;
  const rows=[];
  while(remaining>0){
    const take=Math.min(5,remaining);
    rows.push(`<div class="parityRow">${'<span class="paritySquare"></span>'.repeat(take)}</div>`);
    remaining-=take;
  }
  return `<div class="parityBlocks">${rows.join('')}</div>`;
}
function pairUnitRows(n){
  const top=Math.ceil(n/2);
  const bottom=Math.floor(n/2);
  const row=(count)=>`<div class="unitRow">${'<span class="unitSquare"></span>'.repeat(count)}</div>`;
  return `<div class="pairModel">
    ${row(top)}
    ${row(bottom)}
  </div>`;
}
