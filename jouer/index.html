<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#000000">
  <title>Jeux éducatifs</title>
  <link rel="icon" href="/assets/accueil-arcade/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/accueil-arcade/home.css?v=2">
  <link rel="stylesheet" href="/assets/accueil-arcade/player.css?v=1">
  <script>const selectedLanguage=new URLSearchParams(location.search).get('lang');if(['fr','en','es','zh'].includes(selectedLanguage))document.documentElement.lang=selectedLanguage;</script>
  <script defer src="/assets/affichage-horizontal.js?v=arcade-player-1"></script>
  <script defer src="/assets/landscape-game-frame.js?v=arcade-player-2"></script>
</head>
<body class="arcade-player">
  <header class="horizontal-tools arcade-player-bar" data-landscape-in-flow>
    <span class="arcade-sparks" aria-hidden="true"></span>
    <a class="arcade-player-home" href="/?lang=fr" aria-label="Accueil">
      <img src="/assets/accueil-arcade/logo.svg" alt="" width="38" height="38">
    </a>
    <h1 id="game-title" class="arcade-player-title">Jeux éducatifs</h1>
    <nav class="game-links arcade-player-links" aria-label="Navigation du jeu">
      <a id="catalogue-link" class="control control-outline"></a>
      <a id="direct-link" hidden target="_blank" rel="noopener" class="control control-outline">Ouvrir le jeu seul</a>
      <a id="game-pdf-link" hidden download class="control control-primary arcade-player-sheet">PDF à imprimer</a>
      <button class="control control-primary" id="horizontal-toggle" type="button" aria-pressed="false">Affichage horizontal</button>
    </nav>
    <p id="horizontal-status" role="status" aria-live="polite" hidden></p>
  </header>
  <main id="game-container"><p id="missing" role="status"></p></main>
</body>
</html>
