*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff8ef,#f8dfbd);color:#222}
.app{max-width:1020px;margin:0 auto;padding:18px}
.shell{background:#fff;border:3px solid #efdbc0;box-shadow:0 10px 28px rgba(0,0,0,.10);overflow:hidden}
header{text-align:center;padding:18px;background:linear-gradient(135deg,#ffe7bd,#ffd49b 55%,#fff0d3);border-bottom:3px solid #efd4ad}
.brand{color:var(--navy);font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
h1{margin:8px 0 4px;font-size:clamp(29px,4vw,44px)}
.subtitle{margin:0;color:#5b5b5b;font-size:18px}
main{padding:20px}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.level-btn{min-height:76px;border:3px solid var(--navy);background:var(--navy);color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.level-btn small{display:block;font-size:13px;margin-top:5px}
.level-btn.active{background:var(--green);border-color:var(--green)}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:#eefcff;border:2px solid #b8e0e8;padding:12px;margin-bottom:16px;color:var(--navy);font-weight:900}
.fritz{display:inline-block;width:96px;height:64px;background-image:var(--fritz);background-repeat:no-repeat;background-size:200% 100%;vertical-align:middle}
.fritz.mouth-right{background-position:left center}
.fritz.mouth-left{background-position:right center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}
.stat{background:#fff8ef;border:2px solid var(--border);padding:10px;text-align:center;color:var(--navy);font-weight:900}
.stat strong{display:block;font-size:28px;margin-top:4px}
.progress{height:14px;background:#f1e4d2;border:1px solid #dfc7a5;margin-bottom:18px;overflow:hidden}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--navy),#52799c);transition:width .25s}
.card{background:linear-gradient(180deg,#fffdf9,#fff5e8);border:2px solid #ecd4b3;padding:22px 18px;text-align:center}
.direction{display:inline-block;background:#ffe4ae;border:2px solid #efc46e;color:var(--navy);padding:8px 15px;font-weight:900;font-size:19px;margin-bottom:14px}
.question{font-size:clamp(24px,4vw,34px);font-weight:900;color:var(--navy);margin-bottom:18px}
.number-pool{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.num-btn{min-width:112px;min-height:78px;border:3px solid #d89b55;background:#fffaf3;color:var(--navy);font-size:34px;font-weight:900;cursor:pointer}
.num-btn:nth-child(5n+1){background:var(--blue)} .num-btn:nth-child(5n+2){background:var(--pink)}
.num-btn:nth-child(5n+3){background:var(--mint)} .num-btn:nth-child(5n+4){background:var(--yellow)} .num-btn:nth-child(5n){background:var(--lav)}
.num-btn.used{opacity:.25;cursor:default}
.answer-title{font-weight:900;color:var(--navy);font-size:20px;margin-bottom:10px}
.answer-row{min-height:92px;border:3px dashed #b9c9d7;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:10px}
.answer-num{min-width:86px;padding:12px 8px;background:#f5f8fb;border:2px solid #aebfcf;color:var(--navy);font-size:28px;font-weight:900}
.sep{width:76px;display:flex;justify-content:center;align-items:center}
.sep .fritz{width:72px;height:48px}
.feedback{min-height:38px;margin:18px 0 8px;font-size:23px;font-weight:900}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.action{border:none;color:#fff;padding:14px 24px;font-size:20px;font-weight:900;cursor:pointer}
.undo{background:#d08a2d} .check{background:var(--green)} .next{background:var(--purple);display:none} .replay{background:var(--navy)}
.end{display:none;text-align:center;padding:30px 12px 14px}
.end h2{font-size:42px;color:var(--navy);margin:0 0 10px} .end p{font-size:24px;font-weight:900}
@media(max-width:700px){.levels{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.num-btn{min-width:90px}.sep{width:56px}.sep .fritz{width:54px;height:36px}}
</style>
</head>

<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions">
<button class="action undo" id="undoBtn" type="button">↩ Undo last</button>
<button class="action check" id="checkBtn" type="button">✅ Check</button>
<button class="action next" id="nextBtn" type="button">Next question</button>
</div>
</div>
</section>

<section class="end" id="end">
<h2>Well done!</h2>
<p id="finalText"></p>
<button class="action replay" id="replayBtn" type="button">Play this level again</button>
</section>
</main>
</div></div>

<script>function enNumber(n){if(n<0)return 'minus '+enNumber(-n);const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];if(n<20)return ones[n];if(n<100)return ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'][Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' and '+enNumber(n%100):'');if(n===1000)return 'one thousand';return String(n)}

const TOTAL=10;
let level=1,current=0,score=0,good=0,locked=false;
let numbers=[],selected=[],ascending=true,usedQuestions=new Set();

const levelBtns=[...document.querySelectorAll(".level-btn")];
const qnum=document.getElementById("qnum"),scoreEl=document.getElementById("score"),goodEl=document.getElementById("good");
const bar=document.getElementById("bar"),directionEl=document.getElementById("direction"),questionEl=document.getElementById("question");
const pool=document.getElementById("pool"),answerRow=document.getElementById("answerRow"),feedback=document.getElementById("feedback");
const undoBtn=document.getElementById("undoBtn"),checkBtn=document.getElementById("checkBtn"),nextBtn=document.getElementById("nextBtn");
const game=document.getElementById("game"),end=document.getElementById("end"),finalText=document.getElementById("finalText"),replayBtn=document.getElementById("replayBtn");

function randint(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeNumbers(){
  let arr,key;
  do{
    const set=new Set();
    const min=level===1?1:10;
    const max=level===1?99:999;
    while(set.size<5) set.add(randint(min,max));
    arr=[...set];
    ascending=Math.random()<0.5;
    key=(ascending?"A":"D")+"-"+[...arr].sort((a,b)=>a-b).join(",");
  }while(usedQuestions.has(key));
  usedQuestions.add(key);
  return shuffle(arr);
}

function expectedOrder(){
  return [...numbers].sort((a,b)=>ascending?a-b:b-a);
}

function render(){
  locked=false;selected=[];numbers=makeNumbers();
  qnum.textContent=`${current+1} / ${TOTAL}`;scoreEl.textContent=score;goodEl.textContent=good;
  bar.style.width=`${current/TOTAL*100}%`;
  directionEl.textContent=ascending?"From smallest to greatest ⬆":"From greatest to smallest ⬇";
  questionEl.textContent=ascending?"Order the 5 numbers from smallest to greatest.":"Order the 5 numbers from greatest to smallest.";
  feedback.textContent="";nextBtn.style.display="none";checkBtn.disabled=false;undoBtn.disabled=false;
  pool.innerHTML="";
  numbers.forEach((n,i)=>{
    const b=document.createElement("button");b.type="button";b.className="num-btn";b.textContent=n;b.dataset.index=i;
    b.addEventListener("click",()=>selectNumber(i,n,b));pool.appendChild(b);
  });
  renderAnswer();
}

function selectNumber(index,n,btn){
  if(locked || btn.classList.contains("used"))return;
  selected.push({index,n});
  btn.classList.add("used");
  renderAnswer();
}

function renderAnswer(showFritz=false){
  answerRow.innerHTML="";
  if(selected.length===0){
    const d=document.createElement("div");d.style.color="#7a8792";d.style.fontWeight="800";d.textContent="Your answer will appear here.";
    answerRow.appendChild(d);return;
  }
  selected.forEach((item,i)=>{
    const d=document.createElement("div");d.className="answer-num";d.textContent=item.n;answerRow.appendChild(d);
    if(i<selected.length-1){
      const sep=document.createElement("div");sep.className="sep";
      const f=document.createElement("span");
      const left=item.n,right=selected[i+1].n;
      f.className="fritz "+(right>left?"mouth-right":"mouth-left");
      f.title="Fritz eats the greater number";
      sep.appendChild(f);
      answerRow.appendChild(sep);
    }
  });
}

function undo(){
  if(locked || selected.length===0)return;
  const last=selected.pop();
  const btn=pool.querySelector(`[data-index="${last.index}"]`);
  if(btn)btn.classList.remove("used");
  renderAnswer();
}

function check(){
  if(locked)return;
  if(selected.length!==numbers.length){
    feedback.style.color="var(--red)";feedback.textContent="Place all 5 numbers first.";return;
  }
  locked=true;checkBtn.disabled=true;undoBtn.disabled=true;
  [...pool.querySelectorAll(".num-btn")].forEach(b=>b.disabled=true);
  const exp=expectedOrder();
  const got=selected.map(x=>x.n);
  const ok=got.every((n,i)=>n===exp[i]);
  renderAnswer(true);
  if(ok){
    score++;good++;feedback.style.color="var(--green)";
    feedback.textContent="Well done! Fritz always eats the greater number.";
  }else{
    feedback.style.color="var(--red)";
    feedback.textContent="Look carefully: "+exp.join(" → ");
  }
  scoreEl.textContent=score;goodEl.textContent=good;bar.style.width=`${(current+1)/TOTAL*100}%`;nextBtn.style.display="inline-block";
}

function next(){
  current++;
  if(current>=TOTAL){
    game.style.display="none";end.style.display="block";
    let t=`You got ${score} correct answer${score===1?"":"s"} out of ${TOTAL}.`;
    if(score===10)t+=" A perfect score!";else if(score>=8)t+=" Excellent work!";else if(score>=6)t+=" Good work!";else t+=" Keep practising.";
    finalText.textContent=t;return;
  }
  render();
}

function startLevel(n){
  level=n;current=0;score=0;good=0;usedQuestions.clear();game.style.display="block";end.style.display="none";
  levelBtns.forEach((b,i)=>b.classList.toggle("active",i===n-1));render();
}

levelBtns.forEach((b,i)=>b.addEventListener("click",()=>startLevel(i+1)));
undoBtn.addEventListener("click",undo);checkBtn.addEventListener("click",check);nextBtn.addEventListener("click",next);
replayBtn.addEventListener("click",()=>startLevel(level));
startLevel(1);
</script>
</body>
</html>
