const TITLES={tout:"Find the whole",partie:"Find a missing part",ajouter:"Add / gain / move forward",soustraire:"Subtract / lose / move back",deux:"Two-step word problems",compare:"Compare two quantities",all:"All word problems"};
let list=[],idx=0,score=0,answered=false;
const menuPage=document.getElementById('menuPage'),gamePage=document.getElementById('gamePage'),barArea=document.getElementById('barArea'),problemText=document.getElementById('problemText'),answerZone=document.getElementById('answerZone'),feedback=document.getElementById('feedback'),nextBtn=document.getElementById('nextBtn'),checkBtn=document.getElementById('checkBtn');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeLabel(txt){return String(txt||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function getPartClass(label,index){
  const t=normalizeLabel(label);

  // Couleurs explicitement indiquées dans l'énoncé.
  if(/yellow|vanilla|jaune|vanille/.test(t))return 'yellow';
  if(/red|rouge/.test(t))return 'red';
  if(/blue|bleu/.test(t))return 'blue';
  if(/green|vert/.test(t))return 'green';
  if(/chocolate|chocolat/.test(t))return 'brown';
  if(/violet|mauve|pourpre/.test(t))return 'purple';
  if(/orange/.test(t))return 'orangefill';

  // Catégories faciles à distinguer visuellement.
  if(/girl|fille/.test(t))return 'pink';
  if(/boy|garcon/.test(t))return 'blue';
  if(/cat|chat/.test(t))return 'orangefill';
  if(/dog|chien/.test(t))return 'brown';
  if(/boat|bateau/.test(t))return 'cyan';
  if(/dinosaur|dinosaure/.test(t))return 'green';
  if(/cow|vache/.test(t))return 'beige';
  if(/horse|cheval/.test(t))return 'brown';
  if(/sheep|mouton/.test(t))return 'gray';
  if(/absent/.test(t))return 'red';
  if(/present/.test(t))return 'green';
  if(/new|nouveau/.test(t))return 'lime';

  // Objets / personnes : couleurs distinctes mais stables.
  if(/lina/.test(t))return 'pink';
  if(/theo|timeo|thimeo/.test(t))return 'blue';
  if(/sam|sacha/.test(t))return 'purple';
  if(/zoe/.test(t))return 'cyan';
  if(/school bag|cartable/.test(t))return 'blue';
  if(/pencil sharpener|taille-crayon/.test(t))return 'orangefill';
  if(/ruler|regle/.test(t))return 'yellow';
  if(/pencil case|trousse/.test(t))return 'purple';
  if(/book|comic|livre|bd|bande dessinee/.test(t))return 'green';

  // Pour les autres parties, alternance douce afin de bien les distinguer.
  const fallback=['gray','blue','green','yellow','pink'];
  return fallback[index%fallback.length];
}
function orderParts(parts){
  const copy=[...parts];

  // Pour les poches : gauche toujours à gauche, droite toujours à droite.
  if(copy.some(p=>normalizeLabel(p[1]).includes("left pocket")) &&
     copy.some(p=>normalizeLabel(p[1]).includes("right pocket"))){
    copy.sort((a,b)=>{
      const A=normalizeLabel(a[1]),B=normalizeLabel(b[1]);
      if(A.includes("left pocket"))return -1;
      if(B.includes("left pocket"))return 1;
      if(A.includes("right pocket"))return 1;
      if(B.includes("right pocket"))return -1;
      return 0;
    });
  }
  return copy;
}
function numberValue(v){
  const m=String(v).replace(',','.').match(/\d+(?:\.\d+)?/);
  return m ? Number(m[0]) : null;
}
function proportionalParts(total,parts){
  const vals=parts.map(p=>numberValue(p[0]));
  const totalNum=numberValue(total);

  // Si une seule partie est inconnue et que le tout est connu, on la déduit.
  const unknowns=vals.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  if(totalNum!==null && unknowns.length===1){
    const known=vals.reduce((s,v)=>s+(v||0),0);
    vals[unknowns[0]]=Math.max(0,totalNum-known);
  }

  // Si le tout est inconnu, la somme des parties connues sert de référence.
  let reference=totalNum;
  if(reference===null){
    const sum=vals.reduce((s,v)=>s+(v||0),0);
    if(sum>0) reference=sum;
  }

  // Sécurité : si les données ne permettent pas un calcul, on revient à des parts égales.
  if(!reference || vals.some(v=>v===null)){
    return parts.map(()=>100/parts.length);
  }

  return vals.map(v=>(v/reference)*100);
}
function partsBar(total,parts){
  const ordered=orderParts(parts);
  const widths=proportionalParts(total,ordered);
  return `The whole${esc(total)}</div>
    <div class="parts">${ordered.map((p,i)=>`<div class="part ${getPartClass(p[1],i)}" style="width:${widths[i].toFixed(2)}%"><div class="val">${esc(p[0])}</div><div class="lab">${esc(p[1])}</div></div>`).join('')}</div>
  </div>`;
}

function numericValue(v){
  const m=String(v).replace(',','.').match(/\d+(?:\.\d+)?/);
  return m ? Number(m[0]) : 0;
}
function transformWord(p,plus){const t=p.text.toLowerCase();if(plus){if(t.includes('win'))return 'wins';if(t.includes('forward'))return 'moves forward';if(t.includes('get on'))return 'get on';if(t.includes('join'))return 'join';if(t.includes('give'))return 'receives';return 'added'}if(t.includes('los'))return 'loses';if(t.includes('back'))return 'moves back';if(t.includes('sold'))return 'sells';if(t.includes('buy'))return 'spends';if(t.includes('get off'))return 'get off';return 'removed'}function renderTransformation(p,plus){
  const start=numericValue(p.start);
  const change=numericValue(p.change);
  const finalVal=plus ? start+change : Math.max(0,start-change);

  // Une seule échelle pour les trois lignes :
  // une même valeur numérique = une même longueur de barre.
  const scaleMax=Math.max(start, finalVal, 1);
  const pct=v=>Math.max(0,Math.min(100,(v/scaleMax)*100));

  if(plus){
    const startPct=pct(start);
    const changePct=pct(change);
    const finalPct=pct(finalVal);

    return `<div class="transform-model">
      <div class="transform-row">
        <div class="transform-label">Situation initiale</div>
        <div class="transform-track">
          <div class="transform-segment transform-initial" style="width:${startPct.toFixed(2)}%">${esc(p.start)}</div>
        </div>
      </div>

      <div class="transform-arrow">↓</div>

      <div class="transform-row">
        <div class="transform-label">Transformation</div>
        <div class="transform-track">
          <div class="transform-segment transform-initial" style="width:${startPct.toFixed(2)}%">${esc(p.start)}</div>
          <div class="transform-segment transform-added" style="width:${changePct.toFixed(2)}%">${esc(p.change)}</div>
        </div>
      </div>
      <div class="transform-word">${esc(transformWord(p,true))} ${esc(p.change)}</div>

      <div class="transform-arrow">↓</div>

      <div class="transform-row">
        <div class="transform-label">Final amount</div>
        <div class="transform-track">
          <div class="transform-segment transform-final" style="width:${finalPct.toFixed(2)}%">?</div>
        </div>
      </div>
    </div>`;
  }

  const startPct=pct(start);
  const finalPct=pct(finalVal);
  const changePct=pct(change);

  return `<div class="transform-model">
    <div class="transform-row">
      <div class="transform-label">Situation initiale</div>
      <div class="transform-track">
        <div class="transform-segment transform-initial" style="width:${startPct.toFixed(2)}%">${esc(p.start)}</div>
      </div>
    </div>

    <div class="transform-arrow">↓</div>

    <div class="transform-row">
      <div class="transform-label">Transformation</div>
      <div class="transform-track">
        <div class="transform-segment transform-initial" style="width:${finalPct.toFixed(2)}%">?</div>
        <div class="transform-segment transform-removed" style="width:${changePct.toFixed(2)}%">${esc(p.change)}</div>
      </div>
    </div>
    <div class="transform-word">${esc(transformWord(p,false))} ${esc(p.change)}</div>

    <div class="transform-arrow">↓</div>

    <div class="transform-row">
      <div class="transform-label">Final amount</div>
      <div class="transform-track">
        <div class="transform-segment transform-final" style="width:${finalPct.toFixed(2)}%">?</div>
      </div>
    </div>
  </div>`;
}


function twoStepQuestions(p){
  return TWO_STEP_QUESTIONS[p.text] || [
    "What do you need to calculate first?",
    "What do you need to calculate next?"
  ];
}
function renderTwoStepQuestions(p){
  const qs=twoStepQuestions(p);
  return `<div class="seq">
    ${qs.map((q,i)=>`<div class="step-propose ${i===0?'neutral':'plus'}">
      <div class="inter-question">${esc(q)}Calculation ${i+1} :</label>
        <input type="text" placeholder="Write your calculation" aria-label="Calculation ${i+1}">
      </div>
    </div>`).join('')}
  </div>`;
}


function renderCompareQuestions(p){
  const qs=COMPARE_QUESTIONS[p.text] || [
    "What is the first quantity to compare?",
    "What is the second quantity to compare?",
    "Which is greater?"
  ];
  return `<div class="compare-questions">
    ${qs.map((q,i)=>`<div class="compare-question">
      <strong>${esc(q)}</strong>
      <input id="compareAnswer${idx}_${i}" type="text" inputmode="${i<2?'numeric':'text'}"
             placeholder="${i<2?"Write your answer":"Write the name"}"
             aria-label="${esc(q)}" autocomplete="off">
    </div>`).join('')}
  </div>`;
}

function renderBar(p){
if(p.cat==='deux'){
  let visual='';
  if(p.kind==='parts') visual=`<div class="two-step-visual">${partsBar(p.total,p.parts)}</div>`;
  return `<div style="display:grid;gap:18px;width:100%">${visual}${renderTwoStepQuestions(p)}</div>`;
}
if(p.kind==='parts')return partsBar(p.total,p.parts);
if(p.kind==='changePlus')return renderTransformation(p,true);
if(p.kind==='changeMinus')return renderTransformation(p,false);
if(p.kind==='sequence')return renderTwoStepQuestions(p);
if(p.kind==='compare')return `<div class="compare-wide"><div class="compare-grid">${p.bars.map(b=>`<div class="compare-row"><div class="compare-name">${esc(b[0])}</div>${partsBar('?',b[1])}</div>`).join('')}</div>${renderCompareQuestions(p)}</div>`;
if(p.kind==='compareSeq')return `<div class="compare-wide"><div class="compare-grid">${p.bars.map(b=>{const cls=String(b[1]).includes('−')?'minus':'plus';return `<div class="step ${cls}" style="width:100%"><strong>${esc(b[0])}</strong><div class="calc"></div><div class="res"></div></div>`}).join('')}</div>${renderCompareQuestions(p)}</div>`;
if(p.kind==='target')return `Target${esc(p.target)} points</div><div class="cards">${p.cards.map(c=>`<span class="mini-card">${esc(c)}</span>`).join('')}</div></div>`;
return '';
}

function compactCalc(s){
  return String(s)
    .toLowerCase()
    .replace(/€/g,'')
    .replace(/\s+/g,'')
    .replace(/×/g,'*')
    .replace(/,/g,'.');
}
function isValidFinalAnswer(p,got){
  const raw=compactCalc(got);

  if(p.text==="Hugo bought 3 pens at 5 euros each and a comic book for 7 euros. How much did he spend?"){
    const accepted=[
      "22",
      "15+7",
      "15+7=22",
      "5+5+5+7",
      "5+5+5+7=22",
      "3*5+7",
      "3*5+7=22"
    ];
    return accepted.includes(raw);
  }

  return normalize(got)===normalize(p.answer);
}

function normalize(s){return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/€/g,'').trim()}
function renderAnswer(p){
if(p.choices){answerZone.innerHTML=p.choices.map(c=>`<button class="btn navy choice" data-value="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(x=>{x.classList.remove('green');x.dataset.selected=''});b.classList.add('green');b.dataset.selected='1'}));}
else{const ph=p.kind==='target'?"e.g. 10 + 7 + 4":(p.cat==='deux'?"Answer or calculation":"Write your answer");answerZone.innerHTML=`<input id="answer" class="answer" autocomplete="off" inputmode="${(p.kind==='target'||p.cat==='deux')?'text':'numeric'}" placeholder="${ph}">`;}
}
function currentAnswer(){const p=list[idx];if(p.choices){const b=document.querySelector('.choice[data-selected="1"]');return b?b.dataset.value:''}const a=document.getElementById('answer');return a?a.value:''}
function render(){answered=false;feedback.textContent='';nextBtn.classList.add('hidden');checkBtn.classList.remove('hidden');const p=list[idx];document.getElementById('counter').textContent=`Problem ${idx+1} / ${list.length}`;document.getElementById('atelier').textContent=`Workshop ${p.atelier}`;document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('prog').style.width=`${(idx/list.length)*100}%`;problemText.textContent=p.text;barArea.innerHTML=renderBar(p);renderAnswer(p);
document.querySelectorAll('.compare-question input').forEach(inp=>{
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('mousedown',e=>e.stopPropagation());
  inp.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
});
}
function check(){if(answered)return;const p=list[idx],got=currentAnswer();if(!got){feedback.innerHTML="Write or choose an answer.";return}let ok=isValidFinalAnswer(p,got);answered=true;if(ok){score++;feedback.innerHTML="<span class=\"ok\">Well done! Correct answer.</span>"}else{feedback.innerHTML=`Expected answer: ${esc(p.answer)}.</span>`}document.getElementById('score').textContent=`Score: ${score}`;checkBtn.classList.add('hidden');nextBtn.classList.remove('hidden')}
function start(cat){list=cat==='all'?[...ALL]:ALL.filter(p=>p.cat===cat);idx=0;score=0;document.getElementById('catTitle').textContent=TITLES[cat];menuPage.classList.add('hidden');gamePage.classList.remove('hidden');render()}
document.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>start(b.dataset.cat)));
checkBtn.addEventListener('click',check);
nextBtn.addEventListener('click',()=>{if(idx<list.length-1){idx++;render()}else{document.getElementById('prog').style.width='100%';feedback.innerHTML=`Category finished: ${score} / ${list.length}.</span>`;nextBtn.classList.add('hidden')}});
document.getElementById('menuBtn').addEventListener('click',()=>{gamePage.classList.add('hidden');menuPage.classList.remove('hidden')});
</script>
</body>
</html>
