  <h1>Mental maths <span>· Term 2</span></h1>
  <div class="sub">3 minutes per exercise • the timer starts with the first answer entered</div>
  <a class="sound" href="/en/">English blog</a>
</header>

<section id="menuView" class="menuview">
  <h2 id="menuTitle" tabindex="-1">Choose a skill</h2>
  <div id="exerciseMenu" class="exercise-menu"></div>
</section>

<section id="gameView" class="hidden">
  <div class="topbar">
    <div class="box">Exercise<strong id="num">1 / 14</strong></div>
    <div class="box">Time<strong id="timer" class="timer">3:00</strong></div>
    <div class="box">Score<strong id="score">0 / 0</strong></div>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
  <div class="content">
    <div class="titleline">
      <div class="exercise-title" id="exerciseTitle"></div>
      <div class="skill" id="skill"></div>
    </div>
    <div class="notice">Complete as many calculations as you can.</div>
    <div class="startnote" id="startNote">The timer will start when you type your first answer.</div>
    <div class="grid" id="grid"></div>
    <div class="feedback" id="feedback" role="status"></div>
    <div class="actions">
      <button class="check" id="checkBtn" type="button">Check now</button>
      <button class="restart" id="restartBtn" type="button">Restart</button>
      <button class="menu" id="menuBtn" type="button">Choose an exercise</button>
      <button class="next" id="nextBtn" type="button">Next exercise</button>
    </div>
  </div>
</section>

<section id="endView" class="end">
  <h2>Well done!</h2>
  <p id="endText"></p>
  <button class="menu" id="endMenuBtn" type="button">Back to exercises</button>
</section>

 items:[

  E("36 - 7 =","",29),E("63 - 6 =","",57),E("31 - 5 =","",26),E("77 - 8 =","",69),E("42 - 3 =","",39),
  E("83 - 5 =","",78),E("75 - 8 =","",67),E("54 - 6 =","",48),E("72 - 4 =","",68),E("91 - 7 =","",84)
 ]}
];

let exIndex=0;
let seconds=180;
let timerId=null;
let started=false;
let locked=false;

const menuView=document.getElementById("menuView");
const gameView=document.getElementById("gameView");
const endView=document.getElementById("endView");
const exerciseMenu=document.getElementById("exerciseMenu");
const num=document.getElementById("num");
const timer=document.getElementById("timer");
const score=document.getElementById("score");
const progressBar=document.getElementById("progressBar");
const exerciseTitle=document.getElementById("exerciseTitle");
const skill=document.getElementById("skill");
const grid=document.getElementById("grid");
const feedback=document.getElementById("feedback");
const startNote=document.getElementById("startNote");

function menu(){
  stopTimer();
  gameView.classList.add("hidden");
  endView.style.display="none";
  menuView.classList.remove("hidden");
  document.getElementById("menuTitle").focus();
}
function buildMenu(){
  const accents = ["cyan","mint","violet","amber","cyan","violet","mint"];
  for(let index=0; index<exercises.length; index+=2){
    const first = exercises[index];
    const card = document.createElement("section");
    const heading = document.createElement("h3");
    const options = document.createElement("div");
    card.className = "skill-card";
    card.dataset.accent = accents[index/2];
    heading.textContent = first.title;
    options.className = "series";
    [first, exercises[index+1]].forEach((exercise, series)=>{
      const button = document.createElement("button");
      const count = document.createElement("span");
      button.className = "exbtn";
      button.type = "button";
      button.textContent = `Series ${series+1}`;
      button.setAttribute("aria-label",`${first.title}, series ${series+1}, ${exercise.items.length} calculations`);
      count.className = "series-count";
      count.textContent = `${exercise.items.length} calculations`;
      button.append(count);
      button.addEventListener("click",()=>startExercise(index+series));
      options.append(button);
    });
    card.append(heading,options);
    exerciseMenu.append(card);
  }
}
function startExercise(i){
  exIndex=i;
  menuView.classList.add("hidden");
  endView.style.display="none";
  gameView.classList.remove("hidden");
  renderExercise();
}
function renderExercise(){
  stopTimer();
  seconds=180;started=false;locked=false;
  updateTimer();
  const ex=exercises[exIndex];
  num.textContent=`${exIndex+1} / ${exercises.length}`;
  exerciseTitle.textContent=`${ex.title} · Series ${exIndex%2+1}`;
  skill.textContent=ex.skill;
  score.textContent=`0 / ${ex.items.length}`;
  progressBar.style.width=`${(exIndex/exercises.length)*100}%`;
  feedback.textContent="";
  delete feedback.dataset.result;
  startNote.textContent="The timer will start when you type your first answer.";
  grid.innerHTML="";
  ex.items.forEach((item,idx)=>{
    const card=document.createElement("div");
    card.className="calc answer-entry";
    const row=document.createElement("div");
    row.className="equation-row";
    const left=item.left.match(/\d+|[+=-]/g) || [];
    const right=item.right.match(/\d+|[+=-]/g) || [];
    // Estimate the row's width in em so longer equations also fit on narrow cards.
    const terms=[...left,...right];
    const termsWidth=terms.reduce((width,term)=>width+(/^[0-9]/.test(term)?term.length*.79:.86),0);
    row.style.setProperty("--equation-width",String(4.2 + termsWidth + terms.length*.17));
    function appendTerms(terms){
      for(const term of terms){
        const span=document.createElement("span");
        span.textContent=term === "-" ? "−" : term;
        if(/^[0-9]/.test(term)) span.className="operand";
        row.appendChild(span);
      }
    }
    appendTerms(left);
    const input=document.createElement("input");
    input.type="text";
    input.inputMode="numeric";
    input.autocomplete="off";
    input.maxLength=4;
    input.dataset.index=idx;
    input.setAttribute("aria-label",`Answer ${idx+1} : ${item.left} … ${item.right}`.trim());
    input.addEventListener("input",()=>{
      input.value=input.value.replace(/[^0-9]/g,"");
      input.classList.remove("good","bad");
      if(!started && input.value!=="") startTimer();
    });
    input.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        const inputs=[...grid.querySelectorAll("input")];
        const pos=inputs.indexOf(input);
        if(pos<inputs.length-1) inputs[pos+1].focus();
      }
    });
    row.appendChild(input);
    appendTerms(right);
    card.appendChild(row);
    grid.appendChild(card);
  });
  const first=grid.querySelector("input");
  if(first)setTimeout(()=>first.focus(),50);
}
function startTimer(){
  if(started||locked)return;
  started=true;
  startNote.textContent="Timer running.";
  timerId=setInterval(()=>{
    seconds--;
    updateTimer();
    if(seconds<=0){
      seconds=0;
      updateTimer();
      finishExercise(true);
    }
  },1000);
}
function stopTimer(){
  if(timerId){clearInterval(timerId);timerId=null}
}
function updateTimer(){
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  timer.textContent=`${m}:${String(s).padStart(2,"0")}`;
  timer.classList.remove("warn","danger");
  if(seconds<=30)timer.classList.add("danger");
  else if(seconds<=60)timer.classList.add("warn");
}
function finishExercise(timeUp=false){
  if(locked)return;
  locked=true;
  stopTimer();
  const ex=exercises[exIndex];
  const inputs=[...grid.querySelectorAll("input")];
  let good=0,answered=0;
  inputs.forEach((inp,i)=>{
    inp.disabled=true;
    if(inp.value!=="")answered++;
    if(inp.value!==""&&Number(inp.value)===ex.items[i].ans){
      good++;inp.classList.add("good");
    }else if(inp.value!==""){
      inp.classList.add("bad");
    }
  });
  score.textContent=`${good} / ${ex.items.length}`;
  feedback.dataset.result=good===ex.items.length?"correct":"error";
  feedback.textContent=(timeUp?"Time is up! ":"")+`${good} correct answer${good===1?"":"s"} out of ${ex.items.length}. ${answered} calculation${answered===1?"":"s"} answered.`;
  startNote.textContent="Exercise complete.";
  progressBar.style.width=`${((exIndex+1)/exercises.length)*100}%`;
}
document.getElementById("checkBtn").addEventListener("click",()=>finishExercise(false));
document.getElementById("restartBtn").addEventListener("click",renderExercise);
document.getElementById("menuBtn").addEventListener("click",menu);
document.getElementById("nextBtn").addEventListener("click",()=>{
  if(exIndex<exercises.length-1)startExercise(exIndex+1);
  else{
    gameView.classList.add("hidden");
    endView.style.display="block";
    document.getElementById("endText").textContent="You have completed all 14 review exercises for Term 2.";
  }
});
document.getElementById("endMenuBtn").addEventListener("click",menu);
buildMenu();
</script>
</body>
