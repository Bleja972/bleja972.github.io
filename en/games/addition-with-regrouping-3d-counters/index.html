.separator{height:18px;display:flex;align-items:center;justify-content:center;pointer-events:none}.separator::before{content:'';width:75%;border-top:3px dashed #8c9ab0}.tenpack{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:7px;width:100%;border:4px dotted transparent;border-radius:35px;padding:7px;position:relative;transition:background .3s}.tenpack.active{border-color:#e33242;background:#ffe9eb;animation:ring .6s ease-in-out infinite alternate}.tenpack.vanish{animation:collapse .75s forwards}.remaining{display:contents}@keyframes ring{from{box-shadow:0 0 0 0 #ed294555}to{box-shadow:0 0 0 7px #ed294500}}@keyframes collapse{to{transform:scale(.08);opacity:0}}.newten{animation:born 1s ease-out}.circled-ten::after{content:"";position:absolute;inset:-8px;border:3px dashed #e12637;border-radius:50%;pointer-events:none;animation:redRing 1s ease-out both}@keyframes redRing{0%{transform:scale(1.4);opacity:0}45%{opacity:1}100%{transform:scale(1);opacity:1}}@keyframes born{0%{transform:translateX(90px) scale(.1);opacity:0}50%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}.notice{min-height:55px;font-size:18px;font-weight:bold;text-align:center;padding:12px;color:#254068}.panel2{background:#eef4fb;border-radius:14px;padding:12px;margin:8px 0 10px}.steps{display:flex;flex-direction:column;gap:10px}.step{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-weight:bold}.stepLabel{color:#1e3f69}.expr{font-size:26px;min-width:140px;text-align:center}.expr .first.u{color:#a83248}.expr .second.u{color:#5555a4}.expr .first.t{color:#98650b}.expr .second.t{color:#a96328}.expr .carry{color:#98650b}.expr .colored-digit{font-weight:900;text-shadow:0 1px 0 #fff}.colored-digit.first.u{color:#bd3d55}.colored-digit.second.u{color:#797dda}.colored-digit.first.t{color:#b57d12}.colored-digit.second.t{color:#a96328}.colored-digit.carry{color:#b57d12}.step input{width:78px;height:50px;font-size:28px;text-align:center;border:2px solid #75859a;border-radius:10px;background:white}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}button{font-size:17px;font-weight:bold;border:none;border-radius:12px;padding:12px 18px;background:#1765c1;color:white;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button.alt{background:#58677b}button.good{background:#177f48}.answer{display:flex;gap:8px;justify-content:center;align-items:end;flex-wrap:wrap;padding:10px}.digit{text-align:center}.digit label{display:block;font-weight:bold;font-size:14px;margin-bottom:4px}.digit input{width:65px;height:58px;font-size:32px;text-align:center;border:2px solid #75859a;border-radius:10px}.legend{text-align:center;font-size:14px;color:#516175}.summary{font-size:22px;text-align:center;font-weight:bold}.hidden{display:none!important}@media(max-width:460px){main{padding:8px}.panel{padding:9px}.panel2{padding:8px}.expr{font-size:22px;min-width:110px}.step input{width:70px;height:44px;font-size:24px}.tokens{gap:3px;padding:6px 2px;min-height:225px;grid-template-rows:minmax(74px,1fr) 14px minmax(74px,1fr)}.group{gap:3px}.separator{height:14px}.separator::before{width:82%}.tenpack{gap:3px;padding:3px;border-width:3px}.token{width:29px;height:29px}.digit input{width:58px}button{font-size:15px;padding:11px}}
</style></head><body><nav aria-label="Blog navigation" style="text-align:center;padding:12px"><a href="/en/" style="display:inline-block;padding:10px 18px;border-radius:12px;background:#17664e;color:white;font:bold 16px Arial,sans-serif;text-decoration:none">⌂ English blog</a></nav><main><div class="top"><h1>Addition with regrouping</h1><div class="info"><span id="progress">Addition 1 / 8</span><span id="score">Correct answers : 0</span></div></div><div class="panel"><div class="operation" id="operation"></div><div class="mat"><section class="place" data-col="h"><div class="heading">Hundreds</div><div class="tokens" id="hundreds"></div></section><section class="place" data-col="t"><div class="heading">Tens</div><div class="tokens" id="tens"></div></section><section class="place" data-col="u"><div class="heading">Ones</div><div class="tokens" id="units"></div></section></div><div class="notice" id="notice" aria-live="polite"></div><div class="steps panel2" id="steps"><div class="step" id="stepUnits"><span class="stepLabel">Horizontal addition of the ones :</span><span id="unitsExpr" class="expr"></span><input id="unitsSum" inputmode="numeric" maxlength="2" aria-label="Answer for the ones"><button id="checkUnits" class="good">Check</button></div><div class="step hidden" id="stepTens"><span class="stepLabel">Horizontal addition of the tens :</span><span id="tensExpr" class="expr"></span><input id="tensSum" inputmode="numeric" maxlength="2" aria-label="Answer for the tens"><button id="checkTens" class="good">Check</button></div></div><div class="controls"><button id="exchange">Circle 10 ones and exchange</button><button id="exchangeTens" class="hidden">Exchange 10 tens</button><button id="restart" class="alt">New game</button></div><div class="answer" id="answer"><div class="digit"><label for="rh">Hundreds</label><input id="rh" inputmode="numeric" maxlength="1" aria-label="Digit for the hundreds"></div><div class="digit"><label for="rt">Tens</label><input id="rt" inputmode="numeric" maxlength="1" aria-label="Digit for the tens"></div><div class="digit"><label for="ru">Ones</label><input id="ru" inputmode="numeric" maxlength="1" aria-label="Digit for the ones"></div><button class="good" id="verify">Check</button></div><div id="end" class="summary hidden"></div></div></main><script>
const $=id=>document.getElementById(id);const pause=ms=>new Promise(r=>setTimeout(r,ms));let games=[],pos=0,success=0,phase='unitsInput',locked=false,h=0,t=0,u=0,current={};
function token(n,which='first',extra=''){const e=document.createElement('span');e.className=`token ${n===100?'h':n===10?'t':'u'} ${which} ${extra}`;e.textContent=n;return e}
function generate(){const seen=new Set();let out=[];while(out.length<8){let a=Math.floor(Math.random()*170)+110,b=Math.floor(Math.random()*180)+100;if((a%10+b%10)<10||a+b>899||seen.has(a+'-'+b))continue;seen.add(a+'-'+b);out.push({a,b});}return out}
function setNotice(s){$('notice').textContent=s}
function setupColumn(target){target.replaceChildren();const first=document.createElement('div');first.className='group first-group';const sep=document.createElement('div');sep.className='separator';const second=document.createElement('div');second.className='group second-group';target.append(first,sep,second);return {first,second}}
function coloredExpression(id,parts){const el=$(id);el.replaceChildren();for(const [value,cls] of parts){const span=document.createElement('span');span.textContent=value;if(cls)span.className='colored-digit '+cls;el.append(span)}}
function show(el,yes=true){$(el).classList.toggle('hidden',!yes)}
function resetInputs(){for(let id of ['rh','rt','ru','unitsSum','tensSum']){$(id).value='';$(id).disabled=false}}
function buildCurrent(a,b){const au=a%10, bu=b%10, at=Math.floor(a/10)%10, bt=Math.floor(b/10)%10, ah=Math.floor(a/100), bh=Math.floor(b/100);const unitsTotal=au+bu;const unitsCarry=unitsTotal>=10?1:0;const tensBase=at+bt+unitsCarry;const tensCarry=tensBase>=10?1:0;const hundredsTotal=ah+bh+tensCarry;return {a,b,au,bu,at,bt,ah,bh,unitsTotal,unitsCarry,tensBase,tensCarry,hundredsTotal};}
function render(){current=buildCurrent(games[pos].a,games[pos].b);let {a,b}=current;phase='unitsInput';locked=false;$('progress').textContent=`Addition ${pos+1} / 8`;$('score').textContent=`Correct answers : ${success}`;$('operation').textContent=`${a} + ${b} = ?`;const H=setupColumn($('hundreds')),T=setupColumn($('tens')),U=setupColumn($('units'));for(let i=0;i<current.ah;i++)H.first.append(token(100,'first'));for(let i=0;i<current.at;i++)T.first.append(token(10,'first'));for(let i=0;i<current.au;i++)U.first.append(token(1,'first'));for(let i=0;i<current.bh;i++)H.second.append(token(100,'second'));for(let i=0;i<current.bt;i++)T.second.append(token(10,'second'));for(let i=0;i<current.bu;i++)U.second.append(token(1,'second'));h=current.ah+current.bh;t=current.at+current.bt;u=current.unitsTotal;coloredExpression('unitsExpr',[[current.au,'first u'],[' + ',''],[current.bu,'second u'],[' =','']]);coloredExpression('tensExpr',[[current.at,'first t'],[' + ',''],[current.bt,'second t'],...(current.unitsCarry?[[' + ',''],['1','carry']]:[]),[' =','']]);show('stepUnits',true);show('stepTens',false);show('exchange',false);show('exchangeTens',false);$('exchange').disabled=false;$('exchangeTens').disabled=false;$('checkUnits').disabled=false;$('checkTens').disabled=false;$('verify').disabled=false;$('answer').classList.remove('hidden');$('end').classList.add('hidden');resetInputs();setNotice("Start by completing the horizontal addition of the ones. Example: 9 + 6 = 15.");}
function checkUnits(){if(locked||phase!=='unitsInput')return;const v=$('unitsSum').value.trim();if(!/^\d{1,2}$/.test(v)){setNotice("Complete the ones answer.");return}if(Number(v)!==current.unitsTotal){setNotice("That is not the correct answer for the ones.");return}$('unitsSum').disabled=true;$('checkUnits').disabled=true;if(current.unitsCarry){phase='unitsExchange';show('exchange',true);setNotice(`Well done! ${current.au} + ${current.bu} = ${current.unitsTotal}. Now exchange 10 ones for 1 ten.`);}else{phase='tensInput';show('stepTens',true);setNotice(`Well done! ${current.au} + ${current.bu} = ${current.unitsTotal}. Move on to the tens.`);}}
async function exchangeUnits(){if(locked||phase!=='unitsExchange')return;locked=true;$('exchange').disabled=true;setNotice("I circle 10 ones…");const wrap=document.createElement('div');wrap.className='tenpack active';const targets=Array.from($('units').querySelectorAll('.group .token')).slice(0,10);$('units').querySelector('.first-group').prepend(wrap);targets.forEach(x=>wrap.append(x));await pause(1250);setNotice("10 ones = 1 ten!");wrap.classList.remove('active');wrap.classList.add('vanish');await pause(730);wrap.remove();$('tens').querySelector('.first-group').append(token(10,'first','newten circled-ten'));u-=10;t++;await pause(900);phase='tensInput';locked=false;show('exchange',false);show('stepTens',true);setNotice("Now complete the horizontal addition of the tens.");}
function checkTens(){if(locked||phase!=='tensInput')return;const v=$('tensSum').value.trim();if(!/^\d{1,2}$/.test(v)){setNotice("Complete the tens answer.");return}if(Number(v)!==current.tensBase){setNotice("That is not the correct tens answer. Remember to include the carried digit if needed.");return}$('tensSum').disabled=true;$('checkTens').disabled=true;if(current.tensCarry){phase='tensExchange';show('exchangeTens',true);setNotice(`Well done! ${$('tensExpr').textContent} ${current.tensBase}. Now exchange 10 tens for 1 hundred.`);}else{phase='final';setNotice(`Well done! ${$('tensExpr').textContent} ${current.tensBase}. You can now write the final answer.`);}}
async function exchangeTens(){if(locked||phase!=='tensExchange')return;locked=true;$('exchangeTens').disabled=true;setNotice("I circle 10 tens…");const wrap=document.createElement('div');wrap.className='tenpack active';const targets=Array.from($('tens').querySelectorAll('.group .token')).slice(0,10);$('tens').querySelector('.first-group').prepend(wrap);targets.forEach(x=>wrap.append(x));await pause(1250);setNotice("10 tens = 1 hundred!");wrap.classList.remove('active');wrap.classList.add('vanish');await pause(730);wrap.remove();$('hundreds').querySelector('.first-group').append(token(100,'first','newten circled-ten'));t-=10;h++;await pause(900);phase='final';locked=false;show('exchangeTens',false);setNotice("Well done! You can now write the final answer.");}
async function verify(){if(locked)return;if(phase!=='final'){setNotice("First complete the horizontal additions and the exchanges.");return}const a=$('rh').value.trim(),b=$('rt').value.trim(),c=$('ru').value.trim();if(!/^\d$/.test(b)||!/^\d$/.test(c)||(a!==''&&!/^\d$/.test(a))){setNotice("Fill in the tens and ones, and the hundreds if needed.");return}const value=Number((a||'0')+b+c),goal=current.a+current.b;if(value!==goal){setNotice("Try again! Use the counters and horizontal additions to help.");return}locked=true;success++;$('score').textContent=`Correct answers : ${success}`;setNotice("🎉 Well done! That is correct!");$('verify').disabled=true;await pause(1300);pos++;if(pos<8)render();else finish()}
function finish(){$('progress').textContent="Game complete";$('operation').textContent="Well done!";$('answer').classList.add('hidden');show('stepUnits',false);show('stepTens',false);show('exchange',false);show('exchangeTens',false);$('end').classList.remove('hidden');$('end').textContent=`You solved ${success} additions out of 8, or ${Math.round(success/8*100)} % !`;$('notice').textContent="Click New game to play again."}
function restart(){games=generate();pos=0;success=0;render()}
$('exchange').addEventListener('click',exchangeUnits);$('exchangeTens').addEventListener('click',exchangeTens);$('checkUnits').addEventListener('click',checkUnits);$('checkTens').addEventListener('click',checkTens);$('verify').addEventListener('click',verify);$('restart').addEventListener('click',restart);for(let id of ['rh','rt','ru','unitsSum','tensSum'])$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,e.target.maxLength||2)});restart();</script></body></html>
