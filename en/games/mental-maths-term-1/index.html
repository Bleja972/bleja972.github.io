<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CE1 Mental maths - Term 1</title>
<link rel="stylesheet" href="/jeux/calcul-mental-periode-2/jouer/orbite.css?v=4">
<script defer data-numeric-pad data-game-numeric-pad data-numeric-pad-theme="orbite" src="/assets/pave-numerique.js?v=20261111-tactile"></script>
<style>
  .blog-nav { display: flex; justify-content: center; padding: 10px 14px; }
  .blog-nav a {
    padding: 9px 15px;
    border: 1px solid var(--edge);
    border-radius: 9px;
    background: #102c42db;
    color: var(--ink);
    text-decoration: none;
    font-weight: 750;
  }
  .blog-nav a:hover { border-color: #9be8ff; }
  .skill-card { color: var(--ink); text-align: left; }
  .skill-card strong { color: var(--neon); font-size: 1.04rem; }
  .skill-card span { color: var(--muted); line-height: 1.35; font-size: .92rem; }
  .game-header { border-bottom: 1px solid var(--edge); padding: 16px 14px 0; }
  .game-header .topbar { padding-inline: 0; }
  .box strong { white-space: nowrap; }
  .box:has(.timer.running) { border-color: #ffe08b; }
  .box:has(.timer.done) { border-color: #ff858a; background: #40222c; }
  .calc input { flex-basis: 3.1em; width: 3.1em; }
  .calc input:focus { border-color: var(--focus); }
  .actions { margin-top: 15px; }
  .actions button:disabled { opacity: .6; cursor: default; }
  .feedback:empty { min-height: 0; padding: 0; }
  .answer-feedback {
    margin-top: 3px;
    color: var(--muted);
    font: 700 .8rem/1.2 system-ui, sans-serif;
    text-shadow: none;
  }
  .answer-feedback.good { color: var(--green); }
  .answer-feedback.bad { color: var(--red); }
</style>
<script defer src="/assets/affichage-horizontal.js?v=term1-orbit"></script>
</head>
<body>
<nav class="blog-nav" aria-label="All games"><a href="/en/" target="_top">See all games</a></nav>

<div class="app">
<section id="menuPage" class="shell">
<header>
<div class="brand">Little CE1 Challenges</div>
<h1>Mental maths <span>— Term 1</span></h1>
<p class="sub">Choose a skill. Each set contains <strong>15 calculations</strong> and lasts <strong>3 minutes</strong>.</p>
<p class="startnote"><strong>The timer starts when you enter your first answer.</strong></p>
</header>
<div class="menuview exercise-menu" id="skillsMenu">
<button class="skill-card" data-accent="cyan" data-skill="1"><strong>Doubles</strong><span>Know the doubles addition facts.</span></button>
<button class="skill-card" data-accent="mint" data-skill="2"><strong>Near doubles</strong><span>Know the near doubles addition facts.</span></button>
<button class="skill-card" data-accent="violet" data-skill="3"><strong>Number bonds to 10</strong><span>Complete an addition to make 10.</span></button>
<button class="skill-card" data-accent="amber" data-skill="4"><strong>Whole tens</strong><span>Add or subtract a whole number of tens from a number.</span></button>
<button class="skill-card" data-accent="cyan" data-skill="5"><strong>Sums below 10</strong><span>Calculate or find a missing number.</span></button>
<button class="skill-card" data-accent="mint" data-skill="6"><strong>Bridging 10</strong><span>Know addition facts that bridge 10.</span></button>
<button class="skill-card" data-accent="violet" data-skill="7"><strong>Subtract from 10</strong><span>Calculate 10 minus a number.</span></button>
</div>
</section>
<section id="gamePage" class="shell hidden">
<div class="game-header">
  <div class="brand">Mental maths — Term 1</div>
  <h2 class="exercise-title" id="gameTitle"></h2>
  <div class="topbar">
    <div class="box">Calculations<strong>15</strong></div>
    <div class="box">Timer<strong class="timer" id="timer">3:00</strong></div>
    <div class="box">Score<strong id="scoreBadge">—</strong></div>
  </div>
</div>
<div class="content">
  <p class="notice" id="roundInfo">Complete all 15 calculations, then select Check.</p>
  <div class="grid" id="calcGrid"></div>
  <div class="actions">
    <button class="check" id="checkBtn">Check</button>
    <button id="newBtn">New set</button>
    <button id="menuBtn">Back to menu</button>
  </div>
  <div class="feedback" id="result" aria-live="polite"></div>
</div>
</section>
</div>
<script>
const SKILLS={1:{title:"Doubles"},2:{title:"Near doubles"},3:{title:"Number bonds to 10"},4:{title:"Add or subtract tens"},5:{title:"Sums below 10"},6:{title:"Addition by bridging 10"},7:{title:"Subtract from 10"}};
let currentSkill=null,exercises=[],started=false,ended=false,remaining=180,timerId=null;
const menuPage=document.getElementById('menuPage'),gamePage=document.getElementById('gamePage'),gameTitle=document.getElementById('gameTitle'),grid=document.getElementById('calcGrid'),timerEl=document.getElementById('timer'),scoreBadge=document.getElementById('scoreBadge'),result=document.getElementById('result');
const roundInfo=document.getElementById('roundInfo');
const checkBtn=document.getElementById('checkBtn');

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}function choice(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function keyOf(e){return e.text+'='+e.answer}
function generateOne(skill){
if(skill===1){const a=randInt(1,10);return{text:`${a} + ${a}`,answer:a+a}}
if(skill===2){const a=randInt(1,9);let b=a+(Math.random()<.5?-1:1);if(b<1)b=a+1;if(b>10)b=a-1;return Math.random()<.5?{text:`${a} + ${b}`,answer:a+b}:{text:`${b} + ${a}`,answer:a+b}}
if(skill===3){const a=randInt(1,9),b=10-a,t=randInt(1,3);if(t===1)return{text:`${a} + □ = 10`,answer:b};if(t===2)return{text:`□ + ${b} = 10`,answer:a};return{text:`10 = ${a} + □`,answer:b}}
if(skill===4){const n=randInt(10,89);if(Math.random()<.55){const t=choice([10,20,30,40,50]);return{text:`${n} + ${t}`,answer:n+t}}const opts=[10,20,30,40,50].filter(x=>x<=Math.floor(n/10)*10);const t=choice(opts.length?opts:[10]);return{text:`${n} − ${t}`,answer:n-t}}
if(skill===5){const a=randInt(0,8),b=randInt(0,9-a),sum=a+b,t=randInt(1,3);if(t===1)return{text:`${a} + ${b}`,answer:sum};if(t===2)return{text:`${a} + □ = ${sum}`,answer:b};return{text:`${sum} = □ + ${b}`,answer:a}}
if(skill===6){let a,b;do{a=randInt(4,9);b=randInt(2,9)}while(a+b<=10||a+b>18);return{text:`${a} + ${b}`,answer:a+b}}
const a=randInt(0,10);return{text:`10 − ${a}`,answer:10-a}}
function generateBatch(skill){
  const arr=[],seen=new Set();
  let guard=0;
  while(arr.length<5 && guard<1000){
    guard++;
    const ex=generateOne(skill),k=keyOf(ex);
    if(!seen.has(k)){seen.add(k);arr.push(ex)}
  }
  return shuffle(arr);
}
function generateExercises(skill){
  return [...generateBatch(skill),...generateBatch(skill),...generateBatch(skill)];
}
function stopTimer(){
  clearInterval(timerId);
  timerId=null;
  timerEl.classList.remove('running');
}
function resetTimer(){
  stopTimer();
  started=false;
  ended=false;
  remaining=180;
  timerEl.textContent='3:00';
  timerEl.classList.remove('done');
}
function updateTimer(){timerEl.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}
function startTimer(){
  if(started||ended)return;
  started=true;
  timerEl.classList.add('running');
  timerId=setInterval(()=>{
    remaining--;
    updateTimer();
    if(remaining===0)endRound(true);
  },1000);
}
function renderGame(){
  resetTimer();
  scoreBadge.textContent='—';
  result.textContent='';
  roundInfo.textContent='Complete all 15 calculations, then select Check.';
  checkBtn.disabled=false;
  exercises=generateExercises(currentSkill);
  gameTitle.textContent=SKILLS[currentSkill].title;
  grid.replaceChildren();

  exercises.forEach((ex,i)=>{
    const card=document.createElement('div');
    card.className='calc answer-entry';
    const row=document.createElement('div');
    row.className='equation-row';
    const equation=ex.text.includes('□') ? ex.text : `${ex.text} = □`;
    const terms=equation.match(/\d+|[+=−□]/g);
    // Leave room for the answer and keep every symbol on the same line.
    const rowWidth=terms.reduce((width,term)=>{
      if(term==='□') return width+3.1;
      return width+(/^\d/.test(term) ? term.length*.79 : .86);
    },(terms.length-1)*.17+.12);
    row.style.setProperty('--equation-width',String(rowWidth));

    for(const term of terms){
      if(term==='□'){
        const input=document.createElement('input');
        input.className='answer';
        input.inputMode='numeric';
        input.autocomplete='off';
        input.setAttribute('aria-label',`Answer ${i+1}: ${equation.replace('□','…')}`);
        row.appendChild(input);
      }else{
        const span=document.createElement('span');
        span.textContent=term;
        if(/^\d/.test(term)) span.className='operand';
        row.appendChild(span);
      }
    }
    card.appendChild(row);
    grid.appendChild(card);
  });

  const inputs=[...grid.querySelectorAll('.answer')];
  inputs.forEach((input,index)=>{
    input.addEventListener('input',()=>{
      if(input.value.trim()!=='')startTimer();
    });
    input.addEventListener('keydown',event=>{
      if(event.key!=='Enter')return;
      event.preventDefault();
      const next=inputs[index+1] || checkBtn;
      next.focus();
    });
  });
  inputs[0]?.focus();
}
function endRound(fromTimer=false){
  if(ended)return;
  ended=true;
  stopTimer();
  checkBtn.disabled=true;
  if(fromTimer)timerEl.classList.add('done');

  let score=0;
  grid.querySelectorAll('.answer').forEach((input,index)=>{
    const value=input.value.trim();
    const feedback=document.createElement('span');
    feedback.className='answer-feedback';

    if(value===''){
      feedback.textContent='No answer';
    }else if(Number(value)===exercises[index].answer){
      score++;
      input.classList.add('good');
      feedback.classList.add('good');
      feedback.textContent='✓ Correct';
    }else{
      input.classList.add('bad');
      input.setAttribute('aria-invalid','true');
      feedback.classList.add('bad');
      feedback.textContent='✗ Incorrect';
    }
    feedback.id=`answer-feedback-${index+1}`;
    input.setAttribute('aria-describedby',feedback.id);
    input.closest('.calc').appendChild(feedback);
    input.disabled=true;
  });
  scoreBadge.textContent=`${score} / 15`;
  result.textContent=fromTimer
    ? `Time is up! Score: ${score} / 15.`
    : `Set complete: ${score} / 15.`;
  roundInfo.textContent='The set is complete.';
}
function openSkill(skill){
  currentSkill=Number(skill);
  menuPage.classList.add('hidden');
  gamePage.classList.remove('hidden');
  renderGame();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('[data-skill]').forEach(button=>{
  button.addEventListener('click',()=>openSkill(button.dataset.skill));
});
checkBtn.addEventListener('click',()=>{
  endRound();
  requestAnimationFrame(()=>result.scrollIntoView({block:'nearest'}));
});
document.getElementById('newBtn').addEventListener('click',()=>{
  renderGame();
  window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('menuBtn').addEventListener('click',()=>{
  stopTimer();
  gamePage.classList.add('hidden');
  menuPage.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
