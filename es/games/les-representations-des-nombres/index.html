<style>

.words{font-size:2rem;font-weight:800;text-align:center;color:var(--navy);line-height:1.35}.place-table{border-collapse:collapse;font-size:1.7rem;text-align:center;min-width:380px}.place-table th,.place-table td{border:3px solid #26374d;padding:15px 26px}.place-table th{background:#eef4fb;font-size:1rem}.place-table th:first-child,.place-table td:first-child{background:#d8f3dc;color:#1b5e20}.place-table th:nth-child(2),.place-table td:nth-child(2){background:#fff3b0;color:#7a5d00}.place-table th:last-child,.place-table td:last-child{background:#ffd6d6;color:#8b1e1e}.place-table td{font-weight:800}.addition{font-size:2.1rem;font-weight:800;color:#2f3e55;text-align:center}
.material{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-end}.mat-group{text-align:center;min-width:130px}.mat-label{font-weight:700;margin-bottom:8px}.hundreds{display:grid;grid-template-columns:repeat(2,52px);gap:7px;justify-content:center}.hundred{width:52px;height:52px;border:2px solid #c65c5c;border-radius:5px;background:linear-gradient(#f0b7b7 1px,transparent 1px),linear-gradient(90deg,#f0b7b7 1px,transparent 1px),#ffe5e5;background-size:10% 10%}.tens{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:120px}.ten{width:14px;height:78px;border:2px solid #3d8b63;border-radius:4px;background:repeating-linear-gradient(to bottom,#d9f2df 0 7px,#a9d9b6 7px 8px)}.units{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:100px}

.abacus{display:flex;gap:28px;align-items:flex-end;justify-content:center;padding:12px 20px 0;border-bottom:7px solid #725337;min-width:430px;margin-bottom:42px}.rod{position:relative;width:95px;height:180px;border-left:5px solid #9a704a}.rod-title{position:absolute;bottom:-43px;left:-27px;width:60px;text-align:center;font-weight:800;font-size:1.15rem}.beads{position:absolute;bottom:5px;left:-18px;display:flex;flex-direction:column-reverse;gap:3px}.bead{width:37px;height:15px;border-radius:999px;border:2px solid #3a506b;background:#b9d7f2}

<div class="wrap"><header><h1>Representar los números</h1><p class="sub">Mira la representación y escribe el número en dígitos. Los números van desde <strong>60 a 999</strong>.</p>
<div class="levels"><button class="level active" data-level="1">Nivel 1</button><button class="level" data-level="2">Nivel 2</button><button class="level" data-level="3">Nivel 3</button><button class="level" id="restartBtn" type="button">Nueva partida</button></div>
<div class="topline"><div class="badge" id="rangeBadge">Números: 60 a 199</div><div class="badge" id="qBadge">¿ Por qué?, 1 / 10</div><div class="badge" id="scoreBadge">Puntuación : 0</div></div><div class="progress"><div id="progressBar"></div></div></header>
<main class="card"><div class="kicker" id="modeName"></div><div class="question">¿Qué número está representado?</div><div class="representation" id="representation"></div>
<div class="answer-zone"><label for="answer">Respuesta</label><input id="answer" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Escriba el número en chiffres"><button class="action check" id="checkBtn">Comprobar</button><button class="action next" id="nextBtn" disabled>Siguiente pregunta</button></div><div class="feedback" id="feedback" aria-live="polite"></div></main></div>
<script>function enNumber(n){n=Number(n);if(n<0)return 'menos '+enNumber(-n);const u=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];if(n<30)return u[n];if(n<100)return ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'][Math.floor(n/10)]+(n%10?' y '+u[n%10]:'');if(n===100)return 'cien';if(n<1000)return ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'][Math.floor(n/100)]+(n%100?' '+enNumber(n%100):'');if(n===1000)return 'mil';return String(n)}

const ranges={1:[60,199],2:[100,599],3:[100,999]};const modes=[{id:'words',name:"Number in words"},{id:'table',name:"Place-value chart"},{id:'addition',name:"Additive partition"},{id:'material',name:"Base-ten blocks"},{id:'abacus',name:"Abacus"},{id:'short',name:"Hundreds, tens and ones: abbreviations"},{id:'verbal',name:"Hundreds, tens and ones: words"},{id:'disks',name:"Place-value counters"}];let level=1,questionIndex=0,score=0,current=null,usedNumbers=new Set(),previousRoundNumbers=new Set(),audioCtx=null;
const rep=document.getElementById('representation'),answer=document.getElementById('answer'),feedback=document.getElementById('feedback'),nextBtn=document.getElementById('nextBtn'),checkBtn=document.getElementById('checkBtn'),modeName=document.getElementById('modeName'),qBadge=document.getElementById('qBadge'),scoreBadge=document.getElementById('scoreBadge'),rangeBadge=document.getElementById('rangeBadge'),progressBar=document.getElementById('progressBar');
function randint(a,b){return Math.floor(Math.random()*(b-a+1))+a}function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function getNumber(){
  const [lo,hi]=ranges[level];
  // Priorité aux nombres jamais vus dans la partie précédente.
  for(let i=0;i<1000;i++){
    const n=randint(lo,hi);
    if(!usedNumbers.has(n) && !previousRoundNumbers.has(n)){
      usedNumbers.add(n);
      return n;
    }
  }
  // Sécurité : si la plage est trop petite, on évite au moins les doublons dans la partie en cours.
  for(let i=0;i<1000;i++){
    const n=randint(lo,hi);
    if(!usedNumbers.has(n)){
      usedNumbers.add(n);
      return n;
    }
  }
  return randint(lo,hi);
}function digits(n){return{c:Math.floor(n/100),d:Math.floor((n%100)/10),u:n%10}}
const ones=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis"];const tensWords={20:"veinte",30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta"};
function under100(n){return enNumber(n)}
function numberToWords(n){return enNumber(n)}
function renderWords(n){rep.innerHTML=`<div class="words">${numberToWords(n)}</div>`}function renderTable(n){const{c,d,u}=digits(n);rep.innerHTML=`<table class="place-table"><tr><th>Centenas</th><th>Decenas</th><th>Unidades</th></tr><tr><td>${c}</td><td>${d}</td><td>${u}</td></tr></table>`}function renderAddition(n){const{c,d,u}=digits(n);let p=[];if(c)p.push(c*100);if(d)p.push(d*10);if(u)p.push(u);p=shuffle(p);rep.innerHTML=`<div class="addition">${p.join(' + ')}</div>`}
function groupedItems(count,itemHtml,packClass){
  if(count===0)return '—';
  const make=n=>Array.from({length:n},()=>itemHtml).join('');
  if(count>5){
    return `<div class="quantity-groups"><div class="quantity-pack ${packClass}">${make(5)}</div><div class="quantity-pack ${packClass}">${make(count-5)}</div></div>`;
  }
  return `<div class="quantity-pack ${packClass}">${make(count)}</div>`;
}
function renderMaterial(n){
  const{c,d,u}=digits(n);
  const h=groupedItems(c,'<span class="hundred"></span>','hundreds-pack');
  const t=groupedItems(d,'<span class="ten"></span>','tens-pack');
  const un=groupedItems(u,'<span class="unit"></span>','units-pack');
  rep.innerHTML=`<div class="material"><div class="mat-group"><div class="mat-label">Centenas</div>${h}</div><div class="mat-group"><div class="mat-label">Decenas</div>${t}</div><div class="mat-group"><div class="mat-label">Unidades</div>${un}</div></div>`;
}
function rod(letter,count,color){return`<div class="rod"><div class="beads">${Array.from({length:count},()=>`<span class="bead" style="background:${color}"></span>`).join('')}</div><div class="rod-title">${letter}</div></div>`}function renderAbacus(n){const{c,d,u}=digits(n);rep.innerHTML=`<div class="abacus">${rod('H',c,'#ffc8c8')}${rod('T',d,'#c9efd3')}${rod('O',u,'#c8ddff')}</div>`}
function renderShort(n){
const{c,d,u}=digits(n);
let parts;
if(level===3&&Math.random()<.45){
  parts=[`${Math.floor(n/10)}T`,`${n%10}O`];
}else if(level>=2&&Math.random()<.30&&d>0){
  parts=[`${c}H`,`${d-1}T`,`${u+10}O`];
}else{
  parts=[`${c}H`,`${d}T`,`${u}O`];
}
parts=shuffle(parts);
rep.innerHTML=`<div class="text-rep">${parts.join(', ')}</div>`
}function renderVerbal(n){const{c,d,u}=digits(n),p=[];if(c)p.push(`${c} ${c===1?"hundred":"Centenas"}`);if(d)p.push(`${d} ${d===1?"diez":"Decenas"}`);if(u)p.push(`${u} ${u===1?"uno":"Unidades"}`);rep.innerHTML=`<div class="text-rep">${p.join(', ')}</div>`}
function diskGroups(count,cls,label){
  if(count===0)return '—';
  const make=n=>Array.from({length:n},()=>`<span class="disk ${cls}">${label}</span>`).join('');
  if(count>5){
    return `<div class="disk-groups"><div class="disk-pack">${make(5)}</div><div class="disk-pack">${make(count-5)}</div></div>`;
  }
  return `<div class="disk-pack">${make(count)}</div>`;
}
function renderDisks(n){
  const{c,d,u}=digits(n);
  rep.innerHTML=`<div class="disks"><div class="disk-col"><div class="disk-title">Centenas</div>${diskGroups(c,'d100','100')}</div><div class="disk-col"><div class="disk-title">Decenas</div>${diskGroups(d,'d10','10')}</div><div class="disk-col"><div class="disk-title">Unidades</div>${diskGroups(u,'d1','1')}</div></div>`;
}
const renderers={words:renderWords,table:renderTable,addition:renderAddition,material:renderMaterial,abacus:renderAbacus,short:renderShort,verbal:renderVerbal,disks:renderDisks};
function newQuestion(){if(questionIndex>=10){finishRound();return}answer.value='';answer.disabled=false;checkBtn.disabled=false;nextBtn.disabled=true;feedback.textContent='';const n=getNumber(),mode=modes[questionIndex%modes.length];current={n,mode};modeName.textContent=mode.name;renderers[mode.id](n);qBadge.textContent=`Pregunta ${questionIndex+1} / 10`;scoreBadge.textContent=`Puntuación ${score}`;progressBar.style.width=`${questionIndex*10}%`;answer.focus()}
function finishRound(){rep.innerHTML=`<div class="text-rep">¡Ronda completa!<br><span style="font-size:2.4rem;color:#198754">${score} / 10</span></div>`;modeName.textContent="Resultado";feedback.innerHTML=score>=8?"<span class=\"good\">¡Bien hecho, excelente trabajo!</span>":"<span>Juega de nuevo para mejorar tu puntuación.</span>";answer.disabled=true;checkBtn.disabled=true;nextBtn.disabled=true;qBadge.textContent="10 preguntas completadas";progressBar.style.width='100%'}
function getAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function beep(){const ctx=getAudio();if(!ctx)return;[0,.2].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=i?410:560;g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.16);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.19)})}function check(){if(!current)return;const raw=answer.value.trim();if(raw===''){feedback.innerHTML="<span class=\"wrong\">Escribe tu respuesta primero.</span>";beep();return}const val=Number(raw);if(val===current.n){feedback.innerHTML="<span class=\"good\">¡Bien hecho! Eso es correcto.</span>";score++;scoreBadge.textContent=`Puntuación ${score}`}else{feedback.innerHTML=`<span class="wrong">No del todo. La respuesta correcta es ${current.n}.</span>`;beep()}answer.disabled=true;checkBtn.disabled=true;nextBtn.disabled=false}
function startNewRound(){
  previousRoundNumbers = new Set(usedNumbers);
  usedNumbers.clear();
  questionIndex=0;
  score=0;
  scoreBadge.textContent="Puntuación : 0";
  progressBar.style.width='0%';
  newQuestion();
}
checkBtn.addEventListener('click',check);nextBtn.addEventListener('click',()=>{questionIndex++;newQuestion()});answer.addEventListener('keydown',e=>{if(e.key==='Enter'&&!checkBtn.disabled)check()});document.querySelectorAll('.level[data-level]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.level[data-level]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  previousRoundNumbers = new Set(usedNumbers);
  usedNumbers.clear();
  level=Number(btn.dataset.level);
  const[lo,hi]=ranges[level];
  rangeBadge.textContent=`Números: ${lo} to ${hi}`;
  questionIndex=0;
  score=0;
  newQuestion();
}));
const restartBtn=document.getElementById('restartBtn');
if(restartBtn) restartBtn.addEventListener('click',startNewRound);
newQuestion();
</script><script src="/assets/catalogue-v2/runtime-es.js?v=1" defer></script></body></html>
