<!doctype html>
<html lang="es" translate="no"><head><base href="https://bleja972.github.io/jeux/geometrie-ce1/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometría CE1 — Colorear las figuras</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e6f4ff,#fff7dc);font-family:Arial,sans-serif;color:#22384c}main{max-width:1150px;margin:auto;padding:14px}header,.card{background:#fffd;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 7px 20px #4454a01c}h1{color:#1765a1;text-align:center;margin:4px 0}p{line-height:1.55}.instruction{font-size:clamp(18px,2.2vw,24px);font-weight:bold}.palette,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{cursor:pointer;font:700 17px Arial;border:2px solid #d7e5ed;border-radius:12px;padding:10px 14px;background:#f4f9ff;color:#193b55}button[aria-pressed=true]{border-color:#1d72bc;box-shadow:0 0 0 2px #badafb}.primary{background:#1d72bc;color:white}.dot{width:22px;height:22px;display:inline-block;border:1px solid #889;border-radius:6px;vertical-align:middle;margin-right:7px}.board{display:block;width:100%;height:auto;max-height:75vh;touch-action:manipulation;background:white;border:2px solid #e4eefa;border-radius:16px}.shape{cursor:pointer;stroke:#35495b;stroke-width:3;stroke-linejoin:round;fill:#fff;transition:fill .15s}.shape:focus-visible{outline:none;stroke:#156cca;stroke-width:6}.shape.wrong{stroke:#e38c27;stroke-width:6}.shape.correct{stroke:#2b9851;stroke-width:5}#message{font-weight:700;font-size:20px;min-height:30px}.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#1266a2}@media(max-width:600px){.palette button{padding:9px}.board{max-height:none}}
</style></head><body><main><header><h1>Geometría CE1 — Colorear las figuras</h1></header><section class="card"><p class="instruction">Coloria interior de los cuadrados en <span style="color:#ef5b5b">Rojo</span>, rectángulos en <span style="color:#2678d9">Azul</span>, triángulos en <span style="color:#299b50">Verde</span> y círculos en <span style="color:#8b54cf">Violeta</span>.</p><div class="bar"><strong>Elige un color y luego toca una figura.</strong><strong id="progress">0 figura colorida</strong></div><div class="palette" id="palette"><button data-ink="red" aria-pressed="true"><span class="dot" style="background:#ef5b5b"></span>Rojo</button><button data-ink="blue" aria-pressed="false"><span class="dot" style="background:#4f98e6"></span>Azul</button><button data-ink="green" aria-pressed="false"><span class="dot" style="background:#58b86a"></span>Verde</button><button data-ink="purple" aria-pressed="false"><span class="dot" style="background:#9a6fda"></span>Violeta</button><button data-ink="erase" aria-pressed="false">Borrador</button></div>
<svg class="board" viewbox="0 0 1100 680" role="group" aria-label="Figuras para colorear">
<rect x="5" y="5" width="1090" height="670" rx="16" fill="white"></rect>
<rect class="shape" tabindex="0" data-answer="red" aria-label="Cuadrado" x="90" y="95" width="86" height="86"></rect>
<polygon class="shape" tabindex="0" data-answer="green" aria-label="Triángulo" points="275,110 385,110 340,219"></polygon>
<rect class="shape" tabindex="0" data-answer="blue" aria-label="Rectángulo inclinado" x="445" y="118" width="173" height="86" transform="rotate(-13 531.5 161)"></rect>
<rect class="shape" tabindex="0" data-answer="red" aria-label="Cuadrado inclinado" x="745" y="108" width="104" height="104" transform="rotate(43 797 160)"></rect>
<circle class="shape" tabindex="0" data-answer="purple" aria-label="Círculo" cx="952" cy="145" r="40"></circle>
<polygon class="shape" tabindex="0" data-answer="green" aria-label="Triángulo" points="977,258 1073,219 1053,333"></polygon>
<rect class="shape" tabindex="0" data-answer="blue" aria-label="Rectángulo fino inclinado" x="224" y="292" width="294" height="31" transform="rotate(24 371 307.5)"></rect>
<polygon class="shape" tabindex="0" data-answer="green" aria-label="Triángulo" points="105,482 228,440 157,564"></polygon>
<circle class="shape" tabindex="0" data-answer="purple" aria-label="Círculo" cx="524" cy="510" r="49"></circle>
<rect class="shape" tabindex="0" data-answer="blue" aria-label="Rectángulo" x="625" y="455" width="159" height="86" transform="rotate(-8 704.5 498)"></rect>
<ellipse class="shape" tabindex="0" data-answer="erase" aria-label="Ovale" cx="923" cy="510" rx="107" ry="42" transform="rotate(19 923 510)"></ellipse>
<polygon class="shape" tabindex="0" data-answer="erase" aria-label="Paralelogramo" points="280,574 421,574 458,638 317,638"></polygon>
</svg>
<div class="actions"><button class="primary" id="check">Comprobar</button><button id="clear">Borrar todo</button><button id="again">Volver a jugar</button></div><p id="message" role="status" aria-live="polite"></p><p><a href="/es/?lang=es">Volver al blog</a></p></section></main><script>
(()=>{const colors={red:'#ef5b5b',blue:'#4f98e6',green:'#58b86a',purple:'#9a6fda',erase:'#fff'};let ink='red';const shapes=[...document.querySelectorAll('.shape')];const progress=document.querySelector('#progress'),msg=document.querySelector('#message');function update(){const n=shapes.filter(e=>e.dataset.ink&&e.dataset.ink!=='erase').length;progress.textContent=n+' figure'+(n!==1?'s':'')+" colorida"+(n!==1?'s':'')}function paint(s){s.dataset.ink=ink;s.style.fill=colors[ink];s.classList.remove('correct','wrong');msg.textContent='';update()}document.querySelector('#palette').addEventListener('click',e=>{let b=e.target.closest('[data-ink]');if(!b)return;ink=b.dataset.ink;document.querySelectorAll('[data-ink]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});shapes.forEach(s=>{s.dataset.ink='erase';s.addEventListener('click',()=>paint(s));s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(s)}})});function clear(){shapes.forEach(s=>{s.dataset.ink='erase';s.style.fill='#fff';s.classList.remove('correct','wrong')});msg.textContent="Todos los colores han sido borrados.";update()}document.querySelector('#clear').onclick=clear;document.querySelector('#again').onclick=clear;document.querySelector('#check').onclick=()=>{let n=0;shapes.forEach(s=>{const ok=s.dataset.ink===s.dataset.answer;s.classList.toggle('correct',ok);s.classList.toggle('wrong',!ok);if(ok)n++});let p=Math.round(100*n/shapes.length);msg.textContent=(n===shapes.length?"¡Muy bien! ":"Puedes corregir las figuras rodeadas de naranja. ")+n+' / '+shapes.length+" respuestas justas "+p+" % de éxito."};update()})();
</script><script defer data-bleja-share src="/assets/partager-jeu.js?v=share-v1"></script><script src="/assets/catalogue-v2/runtime-es.js?v=1" defer></script></body></html>
