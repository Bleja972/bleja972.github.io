<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head><base href="https://bleja972.github.io/soustraction_cassage/">
<meta charset="UTF-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restas descomponiendo</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#ffffff;--ink:#243449;--accent:#1f67c5;
  --u1:#e86a78;--u2:#b7b9ff;--t1:#f4cb54;--t2:#ffd49d;--h1:#5fc97c;--h2:#a9dfd1;
  --line:#4f5d70;--soft:#e9eef5;--good:#1c844d;--bad:#c63b49;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:18px}
h1{margin:10px 0 4px;font-size:clamp(24px,4vw,34px)}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.info{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}
.panel{background:var(--panel);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(20,42,70,.08);margin-top:14px}
.operation{text-align:center;font-size:clamp(30px,5vw,44px);font-weight:800;margin:8px 0 12px}
.mat{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#fdfefe}
.place{border-right:2px solid var(--line)}
.place:last-child{border-right:0}
.heading{text-align:center;padding:10px 4px;font-weight:800;font-size:clamp(15px,2vw,20px);border-bottom:2px solid var(--line)}
.place.h .heading{background:#d6efdc}.place.t .heading{background:#fff3c9}.place.u .heading{background:#ffdbe0}
.column{min-height:0;padding:8px;display:grid;grid-template-rows:auto 20px auto;gap:8px;position:relative}
.group{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:8px;position:relative}
.separator{display:flex;align-items:center;justify-content:center}
.separator::before{content:"";width:78%;border-top:3px dashed #95a2b4}
.material{position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#263047;text-shadow:0 1px 0 rgba(255,255,255,.7);--baseColor:#ddd;--edgeColor:#888;--shine:#fff}
.material .label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.unit{
  width:22px;height:22px;border-radius:6px;border:2px solid rgba(45,45,55,.38);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.7), inset 0 -3px 4px rgba(0,0,0,.13),0 2px 4px rgba(28,45,78,.18);
}
.ten{
  width:74px;height:22px;border-radius:8px;border:2px solid rgba(45,45,55,.4);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.72), inset 0 -4px 6px rgba(0,0,0,.13),0 2px 4px rgba(28,45,78,.18);
  background-size:100% 100%,100% 100%,7px 100%;
}
.hundred{
  width:74px;height:74px;border-radius:10px;border:2px solid rgba(45,45,55,.4);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.72), inset 0 -4px 6px rgba(0,0,0,.13),0 2px 4px rgba(28,45,78,.18);
  background-size:100% 100%,100% 100%,7px 7px,7px 7px;
}
.first.unit{background:radial-gradient(circle at 30% 22%,#ffd7dc 0,var(--u1) 58%,#b53f52 100%)}
.first.ten{background-image:linear-gradient(180deg,#fff8cf 0,var(--t1) 58%,#c89315 100%),linear-gradient(90deg,transparent 0 100%),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 5px,rgba(0,0,0,.18) 5px 7px);}
.first.hundred{background-image:linear-gradient(180deg,#ebfff1 0,var(--h1) 58%,#2d994b 100%),linear-gradient(90deg,transparent 0 100%),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 5px,rgba(0,0,0,.16) 5px 7px),repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 5px,rgba(0,0,0,.16) 5px 7px);}
.second.unit{background:radial-gradient(circle at 30% 22%,#efefff 0,var(--u2) 58%,#7477ce 100%)}
.second.ten{background-image:linear-gradient(180deg,#fff8eb 0,var(--t2) 58%,#d18d3f 100%),linear-gradient(90deg,transparent 0 100%),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 5px,rgba(0,0,0,.18) 5px 7px);}
.second.hundred{background-image:linear-gradient(180deg,#f2fffb 0,var(--h2) 58%,#5aa89b 100%),linear-gradient(90deg,transparent 0 100%),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 5px,rgba(0,0,0,.16) 5px 7px),repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 5px,rgba(0,0,0,.16) 5px 7px);}
.subtrahend .material{opacity:.95}
.unit .label{font-size:12px}.ten .label{font-size:12px}.hundred .label{font-size:15px}
.borrow-ring{outline:4px dashed #e63f4c; outline-offset:4px; animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.notice{min-height:0;text-align:center;font-size:18px;font-weight:700;padding:5px 3px;color:#28456a}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{border:none;border-radius:12px;padding:12px 16px;font-size:17px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer}
button.alt{background:#627288} button.good{background:var(--good)} button:disabled{opacity:.45;cursor:not-allowed}
.linework{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:0;border:3px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;background:#eef4fb;min-height:128px}
.line-step{min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:7px;text-align:center;font-weight:700;padding:13px 6px;border-right:0;margin:0}
.line-step:last-child{border-right:0}
.linework::before,.linework::after{content:"";position:absolute;z-index:2;top:0;bottom:0;width:2px;background:var(--line);pointer-events:none}
.linework::before{left:calc(100% / 3)}
.linework::after{left:calc(200% / 3)}
#stepHundreds{grid-column:1;grid-row:1}
#stepTens{grid-column:2;grid-row:1}
#stepUnits{grid-column:3;grid-row:1;border-right:0}
.line-step.waiting{opacity:.72}
.line-step.waiting input:not(:disabled),.line-step.waiting button{visibility:hidden}
/* Une réponse validée reste lisible jusqu’à la prochaine opération. */
.line-step.waiting input:disabled{visibility:visible!important;opacity:1;color:#243449;background:#ffffff;-webkit-text-fill-color:#243449}
.line-step input:disabled{opacity:1;color:#243449;background:#fff;-webkit-text-fill-color:#243449}
.line-step.active{opacity:1}
.expr{font-size:clamp(17px,2.3vw,27px);min-width:0;white-space:nowrap;text-align:center}
.line-step button{font-size:14px;padding:9px 11px}
.mat{border-radius:16px 16px 0 0}

.expr .n1u{color:var(--u1)} .expr .n2u{color:var(--u2)} .expr .n1t{color:#d59a14} .expr .n2t{color:#c27b2d} .expr .n1h{color:#2b8f48} .expr .n2h{color:#3f998d}
.expr .carry{color:#d59a14}
.line-step input,.answer input{width:72px;height:52px;border:2px solid #7f91a8;border-radius:10px;font-size:28px;text-align:center}
.answer{display:flex;justify-content:center;gap:8px;align-items:end;flex-wrap:wrap;padding-top:5px}
.digit{text-align:center}.digit label{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.summary{text-align:center;font-size:22px;font-weight:700;margin-top:8px}
.hidden{display:none!important}
.material.fly{z-index:20;position:fixed;pointer-events:none;margin:0!important;transition:transform .95s ease, opacity .95s ease}
.material.fadeout{animation:fadeAway .55s forwards}
@keyframes fadeAway{to{opacity:0;transform:scale(.25)}}
.splitting-cloud{position:fixed;pointer-events:none;z-index:25;font-weight:900;color:#cb3542;background:#fff;border:3px dashed #e74251;border-radius:18px;padding:8px 12px;box-shadow:0 5px 14px rgba(0,0,0,.14)}
.material.incoming{visibility:hidden}
.material.borrow-highlight{outline:3px dashed #e03d4c;outline-offset:4px;z-index:2}
.material.cracking{animation:crack .48s ease-in forwards}
@keyframes crack{0%{filter:brightness(1)}35%{filter:brightness(1.27);transform:rotate(-7deg)}65%{filter:brightness(1.13);transform:rotate(7deg) scale(.96)}100%{opacity:0;transform:scale(.55) rotate(10deg)}}
.split-flash{position:fixed;z-index:28;pointer-events:none;border:4px dashed #ed4856;border-radius:18px;animation:splitRing .6s ease-out forwards}
@keyframes splitRing{0%{opacity:1;transform:scale(.88)}100%{opacity:0;transform:scale(1.5)}}
.material.break-piece{z-index:30;position:fixed!important;pointer-events:none!important;margin:0!important}
@media(max-width:700px){.column{min-height:0;grid-template-rows:auto 16px auto}.unit{width:18px;height:18px}.ten{width:60px;height:18px;background-size:100% 100%,100% 100%,6px 100%}.hundred{width:60px;height:60px;background-size:100% 100%,100% 100%,6px 6px,6px 6px}.group{gap:5px}.unit .label,.ten .label{font-size:10px}.hundred .label{font-size:13px}.expr{font-size:clamp(14px,3.2vw,21px);min-width:0}.line-step{padding:11px 3px;gap:6px;font-size:12px}.line-step button{font-size:12px;padding:8px 6px}.line-step input,.answer input{width:51px;height:43px;font-size:23px}button{font-size:15px;padding:11px 14px}}

/* Poubelle métallique et animation du zéro inutile */
.zero-trash-stage{position:relative;width:190px;height:105px;margin:6px auto 3px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:13px;background:#f5f8fb}
.zero-trash-stage img{display:block;width:190px;height:auto}
.zero-trash-caption{text-align:center;font-size:14px;font-weight:700;color:#526176}
.trash-row{display:grid;grid-template-columns:repeat(3,1fr);align-items:start;margin-top:0}
.trash-slot{display:flex;justify-content:center;align-items:flex-start;min-height:0;padding:0}
.trash-row .spacer{min-height:0}
.trash-row:has(#zeroTrash.hidden){display:none}
#zeroTrash{width:100%;max-width:220px}
.zero-trash-stage{margin:0 auto 4px}
.zero-trash-caption{max-width:180px;margin:0 auto}
@media(max-width:700px){.trash-slot{min-height:0}#zeroTrash{max-width:180px}.zero-trash-stage{width:160px;height:88px}.zero-trash-stage img{width:160px;height:auto}}

.zero-trim{outline:3px dashed #e04554!important;background:#fff5f5!important}

#finalAnswer{width:146px;height:58px;border:2px solid #7f91a8;border-radius:10px;font-size:30px;text-align:center;font-weight:700;background:#fff}
/* Le matériel représente seulement le nombre du haut. */
.column{display:block;min-height:64px}
.column .separator,.column .subtrahend{display:none!important}
.group.minuend{min-height:55px;align-content:flex-start}
.material.removable{cursor:pointer;touch-action:manipulation}
#colH .hundred.removable{pointer-events:auto!important;cursor:pointer;position:relative;z-index:3}
#colH .hundred.removable .label{pointer-events:none}
#colH .hundred.removable:hover{outline:3px solid #23804a;outline-offset:3px}
.material.removable:focus-visible{outline:3px solid #205d99;outline-offset:2px}
.material.crossed{opacity:.47;filter:grayscale(.32);pointer-events:none}
.material.crossed::after{content:"";position:absolute;left:-5%;top:50%;width:110%;height:3px;background:#c92d3d;transform:rotate(-36deg);border-radius:3px;z-index:4;box-shadow:0 1px white}
.small-carry{position:absolute;left:7%;top:-18%;font-size:.55em;color:#bd315c;font-weight:900;opacity:0;transform:translateX(-8px) translateY(0);z-index:5}
.small-carry.show{animation:carryDrop .78s ease forwards}
@keyframes carryDrop{0%{opacity:0;transform:translateX(-8px) translateY(-8px) scale(.45)}35%{opacity:1;transform:translateX(-8px) translateY(2px) scale(1.12)}100%{opacity:1;transform:translateX(-8px) translateY(26px) scale(1)}}
/* Soustraction posée, chiffres alignés par valeur de position */
.operation{display:flex;flex-direction:column;align-items:center;gap:2px;margin:12px auto 16px;font-variant-numeric:tabular-nums}
.vertical-operation{display:grid;grid-template-columns:38px repeat(3,58px);grid-template-rows:repeat(3,58px);align-items:center;justify-items:center;font-size:clamp(30px,4vw,42px);line-height:1;font-weight:800}
.vertical-operation .sign{grid-column:1;grid-row:2;color:#24476c}
.opcell,.resultcell{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.opdigit{display:block;position:relative;z-index:1}
.opcell.borrowed .opdigit{color:#6f7d8f}
.opcell.borrowed::after{content:"";position:absolute;width:74%;height:4px;background:#d04a57;transform:rotate(-55deg);border-radius:4px;z-index:2}
.borrow-note{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.68em;line-height:1;font-weight:900;color:#db2545;opacity:0;z-index:6;background:#fff;padding:1px 3px;border-radius:4px;white-space:nowrap}
.borrow-note.show{animation:borrowPop .65s ease forwards}
@keyframes borrowPop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.4)}65%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.14)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.resultcell{align-self:stretch;justify-self:stretch;border-top:4px solid #263b56;color:#8692a1}
.resultcell .placeholder{opacity:.68}
.result-digit{font-size:1em;opacity:0;transform:translateY(-10px) scale(.72);color:#1e3e64}
.result-digit.show{animation:writeDigit .58s ease forwards}
@keyframes writeDigit{0%{opacity:0;transform:translateY(-10px) scale(.72)}55%{opacity:1;transform:translateY(2px) scale(1.12)}100%{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:460px){.vertical-operation{grid-template-columns:30px repeat(3,45px);grid-template-rows:repeat(3,45px);font-size:31px}.borrow-note{top:-8px}.small-carry.show{animation:carryDropMobile .78s ease forwards}}
@keyframes carryDropMobile{0%{opacity:0;transform:translateX(-6px) translateY(-8px) scale(.45)}35%{opacity:1;transform:translateX(-6px) translateY(2px) scale(1.12)}100%{opacity:1;transform:translateX(-6px) translateY(18px) scale(1)}}

/* Regroupement : la petite retenue est accolée au chiffre pour former 14, 18, etc. */
.opdigit.regrouped{display:inline-flex;align-items:baseline;justify-content:center;gap:0;white-space:nowrap;letter-spacing:-.035em}
.opdigit .red-prefix{font-size:.58em;line-height:1;color:#db2545;font-weight:900;margin-right:-.035em;animation:prefixDrop .7s cubic-bezier(.18,.8,.27,1) both}
@keyframes prefixDrop{from{opacity:0;transform:translateY(-23px)}60%{opacity:1;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.opcell.borrowed .opdigit.regrouped::before{content:none}
.opcell.borrowed:has(.opdigit.regrouped)::after{width:96%;height:4px;transform:rotate(-28deg);background:#d04a57}
.opcell:has(.opdigit.regrouped) .borrow-note{top:-18px}
.borrow-note .red-prefix{display:inline-block;margin-right:0;vertical-align:baseline}
.flying-leading-zero{position:fixed;z-index:9999;color:#d72e46;font:900 42px Arial,sans-serif;text-shadow:0 2px 2px white;pointer-events:none;will-change:transform,opacity}
.zero-source-in-flight{color:transparent!important;caret-color:transparent!important}
</style>
</head>
<body><nav aria-label="Navegación de blogs" style="text-align:center;padding:12px"><a href="/es/?lang=es" style="display:inline-block;padding:10px 18px;border-radius:12px;background:#17664e;color:white;font:bold 16px Arial,sans-serif;text-decoration:none">Blog en inglés</a></nav>
<main>
  <div class="top">
    <div>
      <h1>Restas descomponiendo</h1>
      <div>Con bloques proporcionales de diez bases</div>
    </div>
    <div class="info"><span id="progress">Resta 1 / 8</span><span id="score">Respuestas correctas: 0</span></div>
  </div>

  <div class="panel">
    <div class="operation" id="operation"></div>

    <div class="mat">
      <section class="place h"><div class="heading">Centenas</div><div class="column" id="colH"></div></section>
      <section class="place t"><div class="heading">Decenas</div><div class="column" id="colT"></div></section>
      <section class="place u"><div class="heading">Unidades</div><div class="column" id="colU"></div></section>
    </div>

    <div class="linework" id="linework">
      <div class="line-step" id="stepUnits">
        <span>Unidades</span>
        <span class="expr" id="exprUnits"></span>
        <input id="unitsResult" inputmode="numeric" maxlength="2" aria-label="Respuesta para unidades">
        <button class="good" id="checkUnits">Comprobar</button>
      </div>
      <div class="line-step hidden" id="stepTens">
        <span>Decenas</span>
        <span class="expr" id="exprTens"></span>
        <input id="tensResult" inputmode="numeric" maxlength="2" aria-label="Respuesta para las decenas">
        <button class="good" id="checkTens">Comprobar</button>
      </div>
      <div class="line-step hidden" id="stepHundreds">
        <span>Centenas</span>
        <span class="expr" id="exprHundreds"></span>
        <input id="hundredsResult" inputmode="numeric" maxlength="2" aria-label="Respuesta para los cientos">
        <button class="good" id="checkHundreds">Comprobar</button>
      </div>
    </div>

    <div class="trash-row" aria-live="polite">
      <div class="trash-slot">
        <div id="zeroTrash" class="hidden" aria-live="polite"><div class="zero-trash-stage"><img id="zeroTrashGif" alt="El cero innecesario se lanza en un cubo realista"></div><div class="zero-trash-caption">El cero principal es innecesario: ¡en la papelera!</div></div>
      </div>
      <div class="spacer"></div>
      <div class="spacer"></div>
    </div>

    <div class="notice" id="notice"></div>

    <div class="controls">
      <button id="breakTen" class="hidden">Cambio 1 diez por 10 unidades</button>
      <button id="breakHundred" class="hidden">Cambia 1 centena por 10 decenas</button>
      <button id="restart" class="alt">Nueva partida</button>
    </div>

    <div class="answer" id="answer">
      <div class="digit"><label for="finalAnswer">Respuesta</label><input id="finalAnswer" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Respuesta finale"></div>
      <button class="good" id="verify">Comprobar</button>
    </div>

    <div class="summary hidden" id="end"></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);

async function throwZeroAway(){
  // Un seul zéro en mouvement : celui de la CASE RÉPONSE des centaines.
  const source=$('hundredsResult');
  const posedDigit=$('rd-h');
  const stage=$('zeroTrash');
  const image=$('zeroTrashGif');
  stage.classList.remove('hidden');
  image.src=staticTrashImage; // Poubelle fixe, aucun second zéro dans l'image.
  setNotice("¡El innecesario cero de los cientos va a la papelera!");
  await pause(180);
  if(source && source.value.trim()==='0'){
    const a=source.getBoundingClientRect();
    const dest=stage.querySelector('.zero-trash-stage').getBoundingClientRect();
    const flyer=document.createElement('span');
    flyer.className='flying-leading-zero';
    flyer.textContent='0';
    flyer.setAttribute('aria-hidden','true');
    const x=a.left+a.width/2, y=a.top+a.height/2;
    flyer.style.left=(x-14)+'px'; flyer.style.top=(y-23)+'px';
    document.body.append(flyer);
    const dx=dest.left+dest.width*.72-x;
    const dy=dest.top+dest.height*.73-y;
    const animation=flyer.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx*.5}px,${dy*.25-30}px) scale(1.05)`,opacity:1,offset:.5},
      {transform:`translate(${dx}px,${dy}px) scale(.12)`,opacity:0}
    ],{duration:1800,easing:'ease-in-out',fill:'forwards'});
    await animation.finished.catch(()=>{});
    flyer.remove();
  }
  // Après l'animation, seul le zéro inutile de la case des centaines est effacé.
  // Les réponses des dizaines et des unités restent affichées.
  if(source && source.value.trim()==='0') source.value='';
  if(posedDigit && posedDigit.textContent.trim()==='0'){
    posedDigit.textContent='';
    posedDigit.classList.remove('show');
  }
  await pause(300);
  stage.classList.add('hidden');
}

function make(type,which,text){
  const d=document.createElement('div');
  d.className=`material ${type} ${which}`;
  const span=document.createElement('span'); span.className='label'; span.textContent=text;
  d.append(span); return d;
}
function setupColumn(el){
  el.replaceChildren();
  const top=document.createElement('div'); top.className='group minuend';
  const sep=document.createElement('div'); sep.className='separator';
  const bottom=document.createElement('div'); bottom.className='group subtrahend';
  el.append(top,sep,bottom);
  return {top,bottom};
}
function adjustTableHeight(){
  // The three columns naturally match the tallest column thanks to CSS grid.
  ['colH','colT','colU'].forEach(id=>$(id).style.gridTemplateRows='');
}
window.addEventListener('resize',()=>requestAnimationFrame(adjustTableHeight));
function posedSubtraction(a,b){
  const digits=n=>String(n).padStart(3,' ').split('');
  const first=digits(a),second=digits(b), places=['h','t','u'];
  let out="<div class=\"vertical-operation\" role=\"img\" aria-label=\"Column subtraction: "+a+" minus "+b+'">';
  first.forEach((d,i)=>{
    const p=places[i];
    out+='<div class="opcell" id="top-'+p+'" style="grid-column:'+(i+2)+';grid-row:1">'
      +'<span class="borrow-note" id="note-'+p+'"></span>'+(p==='u'?'<span class="small-carry" id="unit-carry">1</span>':p==='t'?'<span class="small-carry" id="ten-carry">1</span>':'')
      +'<span class="opdigit" id="digit-'+p+'">'+(d===' '?'&nbsp;':d)+'</span></div>';
  });
  out+='<span class="sign">−</span>';
  second.forEach((d,i)=>out+='<span class="opdigit" style="grid-column:'+(i+2)+';grid-row:2">'+(d===' '?'&nbsp;':d)+'</span>');
  places.forEach((p,i)=>out+='<div class="resultcell" id="res-'+p+'" style="grid-column:'+(i+2)+';grid-row:3"><span class="placeholder" id="ph-'+p+'">?</span><span class="result-digit" id="rd-'+p+'"></span></div>');
  return out+'</div>';
}

const placeToCell={h:"Centenas",t:"Decenas",u:"Unidades"};
function markBorrow(place,newValue){
  const cell=$('top-'+place), note=$('note-'+place);
  if(!cell || !note) return;
  cell.classList.add('borrowed');
  note.textContent=String(newValue);
  note.style.color='#db2545';
  note.classList.remove('show');
  void note.offsetWidth;
  note.classList.add('show');
}
function placeRedOneBeside(place, originalDigit){
  const digit=$('digit-'+place);
  const cell=$('top-'+place);
  const note=$('note-'+place);
  const carry=$(place==='t'?'ten-carry':'unit-carry');
  if(!digit)return;
  // Après un cassage de dizaine, le nombre de dizaines restant est
  // écrit dans la note rouge (ex. 5) au-dessus du chiffre barré.
  // En cassant ensuite une centaine, il faut former 15 SUR CETTE NOTE,
  // sans remplacer le 5 par le chiffre initial devenu obsolète.
  if(place==='t' && cell?.classList.contains('borrowed') && note?.classList.contains('show')){
    const retained=String(originalDigit);
    note.innerHTML='<span class="red-prefix">1</span><span>'+retained+'</span>';
    note.classList.remove('show');
    void note.offsetWidth;
    note.classList.add('show');
  }else{
    digit.classList.add('regrouped');
    digit.innerHTML='<span class="red-prefix">1</span><span>'+String(originalDigit)+'</span>';
  }
  if(carry){carry.classList.remove('show');carry.style.display='none';}
}
async function writeResultDigit(place,value){
  const ph=$('ph-'+place), rd=$('rd-'+place);
  if(!rd) return;
  if(ph) ph.textContent='';
  rd.textContent=String(value);
  rd.classList.remove('show');
  void rd.offsetWidth;
  rd.classList.add('show');
  await pause(620);
}

let remainingToRemove={u:0,t:0,h:0}, removed={u:0,t:0,h:0};
function enableSelection(place){
  const col={u:views.U,t:views.T,h:views.H}[place];
  const type={u:'unit',t:"diez",h:'hundred'}[place];
  col.top.querySelectorAll('.'+type).forEach(el=>{
    const selected=el.classList.contains('crossed');
    el.classList.toggle('removable',!selected);
    el.style.cursor=selected?'default':'pointer';
    el.tabIndex=selected?-1:0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label', "Eliminar "+(place==='u'?"una unidad":place==='t'?"once":"cien"));
    // Identical click handling for hundreds, tens, and units.
    el.onclick=()=>removePiece(place,el);
    el.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();removePiece(place,el);}
    };
  });
}
function removePiece(place,el){
  if(locked||phase!=={u:'units',t:"Decenas",h:"Centenas"}[place]||el.classList.contains('crossed'))return;
  if(removed[place]>=remainingToRemove[place])return;
  el.classList.add('crossed');el.classList.remove('removable');el.tabIndex=-1;
  removed[place]++;
  const left=remainingToRemove[place]-removed[place];
  setNotice(left?`Sigue adelante: otro ${left} ${place==='u'?"uno(s)":place==='t'?"diez (s)":"cien(s)"} para tachar.`:"¡Bien hecho! Todos los bloques a quitar están tachados. Completar el cálculo horizontal.");
}
function beginRemoval(place){
  remainingToRemove[place]=current.sub[place];
  removed[place]=0;
  enableSelection(place);
  if(remainingToRemove[place]===0)setNotice("Nada que quitar en esta columna: completar el cálculo horizontal.");
  else setNotice(`Haga clic en ${remainingToRemove[place]} ${place==='u'?"uno(s)":place==='t'?"diez (s)":"cien(s)"} para tacharlos, y luego completar el cálculo.`);
}
function numToCounts(n){return {h:Math.floor(n/100),t:Math.floor(n/10)%10,u:n%10};}
function genGames(){
  const arr=[],seen=new Set();
  while(arr.length<8){
    const a=Math.floor(Math.random()*700)+200; // 200-899
    const b=Math.floor(Math.random()*(a-111))+101;
    const A=numToCounts(a),B=numToCounts(b);
    if(a<=b) continue;
    // want at least one cassage, often with both possibilities
    const needUnits=A.u < B.u;
    const needTensEventually=(A.t - (needUnits?1:0)) < B.t;
    if(!needUnits && !needTensEventually) continue;
    const key=a+'-'+b;
    if(seen.has(key)) continue;
    seen.add(key); arr.push({a,b});
  }
  return arr;
}
function colorSpan(cls,txt){return `<span class="${cls}">${txt}</span>`}
function lineExpr(col,a,b,borrow){
  if(col==='u') return `${colorSpan('n1u',a)} - ${colorSpan('n2u',b)} =`;
  if(col==='t') return borrow?`${colorSpan('n1t',a)} - ${colorSpan('carry','1')} - ${colorSpan('n2t',b)} =`:`${colorSpan('n1t',a)} - ${colorSpan('n2t',b)} =`;
  return borrow?`${colorSpan('n1h',a)} - ${colorSpan('carry','1')} - ${colorSpan('n2h',b)} =`:`${colorSpan('n1h',a)} - ${colorSpan('n2h',b)} =`;
}
function show(id,yes=true){$(id).classList.toggle('hidden',!yes)}
function setNotice(t){$('notice').textContent=t}
function syncLineWork(){
  const stages=[['u','stepUnits','unitsResult','checkUnits','units'],['t','stepTens','tensResult','checkTens',"Decenas"],['h','stepHundreds','hundredsResult','checkHundreds',"Centenas"]];
  stages.forEach(([p,step,input,button,activePhase])=>{
    show(step,true);
    const box=$(step), isActive=phase===activePhase;
    box.classList.toggle('waiting',!isActive);
    box.classList.toggle('active',isActive);
    if(isActive && !$(input).disabled) $(button).disabled=false;
  });
}
function updatePlaceEquations(){
  // Ne jamais dévoiler un calcul avant les cassages nécessaires.
  // Les calculs déjà validés restent affichés, les suivants sont masqués.
  const uReady=phase==='units' && !needBreakTen();
  const tReady=phase==="Decenas" && !needBreakHundred();
  const hReady=phase==="Centenas";
  $('exprUnits').innerHTML=(uReady || $('unitsResult').disabled)
    ?lineExpr('u',current.minuend.u,current.sub.u,false):'';
  $('exprTens').innerHTML=(tReady || $('tensResult').disabled)
    ?lineExpr('t',current.minuend.t,current.sub.t,false):'';
  $('exprHundreds').innerHTML=(hReady || $('hundredsResult').disabled)
    ?lineExpr('h',current.minuend.h,current.sub.h,false):'';
}

function resetInputs(){['unitsResult','tensResult','hundredsResult','finalAnswer'].forEach(id=>{$(id).value='';$(id).disabled=false}); ['checkUnits','checkTens','checkHundreds','verify','breakTen','breakHundred'].forEach(id=>$(id).disabled=false)}
function buildState(a,b){
  const A=numToCounts(a), B=numToCounts(b);
  return {
    a,b,
    minuend:{h:A.h,t:A.t,u:A.u},
    sub:{h:B.h,t:B.t,u:B.u},
    borrowedTen:false,
    borrowedHundred:false,
    result:a-b
  };
}
function render(){
  show('zeroTrash',false);
  current=buildState(games[index].a,games[index].b);
  locked=false; phase='units';
  $('progress').textContent=`Sustracción ${index+1} / 8`;
  $("Puntuación").textContent=`Respuestas correctas: ${score}`;
  $('operation').innerHTML=posedSubtraction(current.a,current.b);
  views.H=setupColumn($('colH')); views.T=setupColumn($('colT')); views.U=setupColumn($('colU'));
  for(let i=0;i<current.minuend.h;i++) views.H.top.append(make('hundred','first','100'));
  for(let i=0;i<current.minuend.t;i++) views.T.top.append(make("diez",'first','10'));
  for(let i=0;i<current.minuend.u;i++) views.U.top.append(make('unit','first','1'));
  removed={u:0,t:0,h:0}; remainingToRemove={u:0,t:0,h:0};
  show('stepUnits',true); show('stepTens',false); show('stepHundreds',false); show('breakTen',false); show('breakHundred',false);
  $("Respuesta").classList.remove('hidden'); $('end').classList.add('hidden'); resetInputs();
  prepareUnits();
  updatePlaceEquations();
  syncLineWork();
  adjustTableHeight();
}

function prepareUnits(){
  updatePlaceEquations();
  if(needBreakTen()){
    show('stepUnits',false);
    if(current.minuend.t===0){
      phase='breakHundredForUnits'; $('breakHundred').disabled=false; show('breakHundred',true);
      setNotice("No hay decenas para cambiar. Primero cambia 1 centena por 10 decenas.");
    }else{
      phase='breakTen'; $('breakTen').disabled=false; show('breakTen',true);
      setNotice("No hay suficientes. Cambio 1 diez antes de calcular.");
    }
  }else{
    phase='units'; show('stepUnits',true);
    $('exprUnits').innerHTML=lineExpr('u',current.minuend.u,current.sub.u,false);
    beginRemoval('u');
  }
  updatePlaceEquations();
}
function prepareTens(){
  updatePlaceEquations();
  if(needBreakHundred()){
    phase='breakHundred'; show('stepTens',false);$('breakHundred').disabled=false;show('breakHundred',true);
    setNotice("No hay suficientes decenas. Cambia 1 centena antes de calcular.");
  }else{
    phase="Decenas";show('stepTens',true);
    $('exprTens').innerHTML=lineExpr('t',current.minuend.t,current.sub.t,false);
    beginRemoval('t');
    syncLineWork();
  }
  updatePlaceEquations();
}
function needBreakTen(){return current.minuend.u < current.sub.u}
function needBreakHundred(){return current.minuend.t < current.sub.t}
function tokenRect(el){const r=el.getBoundingClientRect(); return {left:r.left,top:r.top,width:r.width,height:r.height,right:r.right,bottom:r.bottom}}
async function animateBreak(sourceEl,targetGroup,type,count,text){
  // The ten replacement pieces reserve their final positions BEFORE moving.
  const pieceType=type==='units'?'unit':"diez";
  const replacements=[];
  for(let i=0;i<count;i++){
    const piece=make(pieceType,'first',text);
    piece.classList.add('incoming');
    targetGroup.append(piece);
    replacements.push(piece);
  }
  adjustTableHeight(); // Make room for every replacement before measuring flight destinations.
  const source=tokenRect(sourceEl);
  const cx=source.left+source.width/2,cy=source.top+source.height/2;
  sourceEl.classList.add('borrow-highlight');
  await pause(650);
  const ring=document.createElement('div');
  ring.className='split-flash';
  ring.style.left=source.left+'px';ring.style.top=source.top+'px';
  ring.style.width=source.width+'px';ring.style.height=source.height+'px';
  document.body.append(ring);
  sourceEl.classList.add('cracking');
  await pause(480);
  sourceEl.remove();ring.remove();

  const reduce=window.matchMedia && window.matchMedia("(prefiere la reducción de la movilidad: reducir)").matches;
  const flights=replacements.map((replacement,i)=>{
    const dest=tokenRect(replacement);
    const flying=make(pieceType,'first',text);
    flying.classList.add('break-piece');
    flying.style.left=dest.left+'px'; flying.style.top=dest.top+'px';
    flying.style.width=dest.width+'px';flying.style.height=dest.height+'px';
    flying.style.opacity='0';
    document.body.append(flying);
    const dx=cx-(dest.left+dest.width/2);
    const dy=cy-(dest.top+dest.height/2);
    const delay=reduce?0:i*105;
    const duration=reduce?1:920;
    const anim=flying.animate([
      {transform:`translate(${dx}px,${dy}px) scale(.38) rotate(-15deg)`,opacity:0,offset:0},
      {transform:`translate(${dx*.56}px,${dy*.50-38}px) scale(.9) rotate(8deg)`,opacity:1,offset:.46},
      {transform:'translate(0,0) scale(1) rotate(0)',opacity:1,offset:1}
    ],{duration,delay,easing:"cubic-bezier(. 2,. 7,. 25,1)",fill:'forwards'});
    return anim.finished.catch(()=>{}).then(()=>{
      replacement.classList.remove('incoming');
      flying.remove();
    });
  });
  await Promise.all(flights);
  adjustTableHeight();
  return replacements;
}
async function breakTen(){
  if(locked || phase!=='breakTen') return; locked=true; $('breakTen').disabled=true;
  setNotice("Cambio 1 decena por 10 unidades…");
  const source=views.T.top.querySelector('.ten'); if(!source){locked=false;return;}
  await animateBreak(source, views.U.top, 'units', 10, '1');
  current.minuend.t -= 1; current.minuend.u += 10; current.borrowedTen=true;
  updatePlaceEquations();
  // Barre l'ancien chiffre (ou les 14/18 dizaines regroupées) et inscrit les dizaines restantes en rouge au-dessus.
  markBorrow('t', current.minuend.t);
  $('exprUnits').innerHTML=lineExpr('u', current.minuend.u, current.sub.u, false);
  show('breakTen',false); show('stepUnits',true); phase='units'; locked=false;
  placeRedOneBeside('u', current.minuend.u-10);
  beginRemoval('u');
  syncLineWork();
}
async function breakHundred(){
  if(locked || !['breakHundred','breakHundredForUnits'].includes(phase)) return; const forUnits=phase==='breakHundredForUnits'; locked=true; $('breakHundred').disabled=true;
  setNotice("Cambio 1 centena por 10 decenas…");
  const source=views.H.top.querySelector('.hundred'); if(!source){locked=false;return;}
  await animateBreak(source, views.T.top, "Decenas", 10, '10');
  current.minuend.h -= 1; current.minuend.t += 10; current.borrowedHundred=true;
  updatePlaceEquations();
  markBorrow('h', current.minuend.h);
  placeRedOneBeside('t', current.minuend.t-10);
  if(!forUnits) $('exprTens').innerHTML=lineExpr('t', current.minuend.t, current.sub.t, false);
  show('breakHundred',false); locked=false;
  if(forUnits){phase='breakTen';$('breakTen').disabled=false;show('breakTen',true);setNotice("Ahora tienes 10 decenas. Cambia 1 decena por 10 unidades.");}
  else {phase="Decenas";show('stepTens',true);beginRemoval('t');}
  syncLineWork();
}
async function checkUnits(){
  if(locked || phase!=='units') return;
  if(needBreakTen()){prepareUnits();return;}
  if(removed.u<current.sub.u){setNotice("Primero tacha todos unidades hay que quitar.");return;}
  const v=$('unitsResult').value.trim();
  const expected=current.minuend.u - current.sub.u;
  if(!/^\d{1,2}$/.test(v)){setNotice("Escriba la respuesta para unidades."); return;}
  if(Number(v)!==expected){setNotice("Esa no es la respuesta correcta para unidades lo hacen."); return;}
  locked=true; $('unitsResult').disabled=true; $('checkUnits').disabled=true;
  setNotice("Escribo un dígito en el cálculo de la columna.");
  await writeResultDigit('u', expected);
  locked=false;
  prepareTens();
  syncLineWork();
}
async function checkTens(){
  if(locked) return;
  if(phase!=="Decenas"){
    if(phase==='breakHundred') setNotice("Primero cambia una centena por 10 decenas.");
    else setNotice("En primer lugar terminar de calcular unidades.");
    return;
  }
  if(needBreakHundred()){prepareTens();return;}
  const v=$('tensResult').value.trim();
  const expected=current.minuend.t-current.sub.t;
  if(!/^\d{1,2}$/.test(v)){setNotice("Escribe la respuesta para el cálculo de las decenas.");return;}
  if(Number(v)!==expected){
    setNotice("Esa no es la respuesta correcta: "+current.minuend.t+' − '+current.sub.t+' = ?');
    return;
  }
  // Accept the correct answer, even if a few bars were not crossed by
  // an earlier tap (frequent on touch screens). Complete the highlighting.
  const bars=Array.from(views.T.top.querySelectorAll('.ten'));
  const crossed=bars.filter(el=>el.classList.contains('crossed'));
  const toCross=Math.max(0,current.sub.t-crossed.length);
  bars.filter(el=>!el.classList.contains('crossed')).slice(0,toCross).forEach(el=>{
    el.classList.add('crossed');
    el.classList.remove('removable');
    el.tabIndex=-1;
  });
  removed.t=current.sub.t;
  locked=true;
  $('tensResult').disabled=true;
  $('checkTens').disabled=true;
  setNotice("¡Muy bien! "+current.minuend.t+' − '+current.sub.t+' = '+expected+" Decenas");
  await writeResultDigit('t',expected);
  show('stepHundreds',true);
  phase="Centenas";
  locked=false;
  beginRemoval('h');
  updatePlaceEquations();
  syncLineWork();
  $('hundredsResult').focus({preventScroll:true});
}
async function checkHundreds(){
  if(locked || phase!=="Centenas") return;
  if(removed.h<current.sub.h){setNotice(`Tacha otro. ${current.sub.h-removed.h} verde cien (s) antes de comprobar.`); enableSelection('h');return;}
  const v=$('hundredsResult').value.trim();
  const expected=current.minuend.h - current.sub.h;
  if(!/^\d{1,2}$/.test(v)){setNotice("Escriba la respuesta para los cientos, incluso si es 0."); return;}
  if(Number(v)!==expected){setNotice("Esa no es la respuesta correcta para los cientos."); return;}
  locked=true; $('hundredsResult').disabled=true; $('checkHundreds').disabled=true;
  setNotice("Escribo los cientos de dígitos en el cálculo de columna.");
  await writeResultDigit('h', expected);
  if(expected===0){
    setNotice("0 cientos: este cero es innecesario al principio de la respuesta.");
    await throwZeroAway();
  }
  phase='final'; locked=false;
  syncLineWork();
  setNotice("¡Bien hecho! Ahora escribe la respuesta completa.");
}
async function verify(){
  if(locked) return;
  if(phase!=='final'){setNotice("En primer lugar complete cada cálculo de columna."); return;}
  const answer=$('finalAnswer').value.trim();
  if(!/^\d{1,3}$/.test(answer)){setNotice("Escriba la respuesta completa en el cuadro."); return;}
  const val=Number(answer);
  if(val!==current.result){setNotice("Intenta de nuevo. Mira las respuestas en cada columna."); return;}
  locked=true;
  // Aucun second trajet du zéro lors de la vérification finale.
  if(/^0\d/.test(answer)) $('finalAnswer').value=String(val);
  score++; $("Puntuación").textContent=`Respuestas correctas: ${score}`; $('verify').disabled=true; setNotice("¡Bien hecho! ¡Eso es correcto!");
  await pause(1200);
  index++;
  if(index<8) render(); else finish();
}
function finish(){
  $('progress').textContent="Juego completo"; $('operation').textContent="¡Muy bien!"; $('end').classList.remove('hidden');
  $('end').textContent=`Has resuelto ${score} las sustracciones de 8, o ${Math.round(score/8*100)} % !`;
  $("Respuesta").classList.add('hidden'); show('stepUnits',false); show('stepTens',false); show('stepHundreds',false); show('breakTen',false); show('breakHundred',false);
  setNotice("Haga clic en Nuevo juego para jugar de nuevo.");
}
function restart(){show('zeroTrash',false);games=genGames(); index=0; score=0; $("Respuesta").classList.remove('hidden'); render();}
['unitsResult','tensResult','hundredsResult','finalAnswer'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,Number(e.target.maxLength)>0?Number(e.target.maxLength):2)}));
$('checkUnits').addEventListener('click',checkUnits);
$('checkTens').addEventListener('click',checkTens);
$('checkHundreds').addEventListener('click',checkHundreds);
$('breakTen').addEventListener('click',breakTen);
$('breakHundred').addEventListener('click',breakHundred);
$('verify').addEventListener('click',verify);
$("Reiniciar").addEventListener('click',restart);
restart();
</script>
