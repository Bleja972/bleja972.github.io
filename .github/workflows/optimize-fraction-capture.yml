name: Optimiser la capture Mission Fractions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-fraction-capture.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow
      - run: python3 scripts/optimize_fraction_capture.py
      - name: Enregistrer la capture et ses références
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimiser la capture Mission Fractions CE1 en WebP"
          git push
