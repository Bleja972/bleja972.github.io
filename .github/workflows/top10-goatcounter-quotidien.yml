name: Actualiser le Top 10 des jeux (GoatCounter)

on:
  schedule:
    # 10:15 UTC = 06:15 en Martinique (UTC-4), tous les jours.
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classement-goatcounter-quotidien
  cancel-in-progress: false

jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tester le calcul du classement sans réseau
        run: |
          python -m py_compile scripts/actualiser_top10_goatcounter.py
          python -m unittest discover -s scripts -p 'test_top10_*.py' -v

      - name: Vérifier la présence de la clé API
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then
            echo "::error::Créez le secret GOATCOUNTER_TOKEN dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Recalculer le classement des clics
        env:
          GOATCOUNTER_HOST: lesjeuxdemathsetdefrancais.goatcounter.com
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/actualiser_top10_goatcounter.py

      - name: Publier les nouvelles statistiques
        run: |
          if git diff --quiet -- index.html assets/catalogue-v2/catalogue.json; then
            echo "Aucune différence dans le classement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/catalogue-v2/catalogue.json
          git commit -m "Actualiser automatiquement le Top 10 des jeux depuis GoatCounter"
          git push
