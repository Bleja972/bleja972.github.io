name: Proposer une bannière pour un nouveau jeu

on:
  push:
    branches: [main]
    paths:
      - "assets/catalogue-v2/catalogue.json"
      - "assets/images/bannieres/jeux-deja-publies.json"
  workflow_dispatch:
    inputs:
      game_id:
        description: "ID du nouveau jeu (facultatif, ex. jeu-113)"
        required: false
        type: string
      dry_run:
        description: "Simulation sans appel payant à l'API"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: banniere-nouveau-jeu
  cancel-in-progress: false

jobs:
  proposer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Pillow
        run: python -m pip install "pillow>=10,<13"
      - name: Détecter les nouveaux jeux et préparer une bannière
        id: banner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GAME_ID: ${{ inputs.game_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ -n "$GAME_ID" ]]; then
            flags+=(--game-id "$GAME_ID")
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            flags+=(--dry-run)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GAME_ID" == "jeu-61" ]]; then
            flags+=(--preview-existing)
          fi
          python scripts/generer-banniere-jeu.py "${flags[@]}"
      - name: Proposer les changements pour validation
        if: steps.banner.outputs.generated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: |
            assets/catalogue-v2/catalogue.json
            assets/images/bannieres/
          commit-message: "Proposer une bannière pour un nouveau jeu"
          branch: automation/banniere-nouveau-jeu
          delete-branch: true
          title: "Bannière proposée — aperçu à vérifier (aucune publication automatique)"
          body: |
            Une bannière WebP a été générée dans une branche de proposition.\n\n            Si le fichier est `jeu-61-apercu.webp`, il s’agit d’un aperçu **sans modification du catalogue**.

            - Vérifier que l'image correspond au jeu et qu'elle est de bonne qualité.
            - Vérifier le fichier assets/catalogue-v2/catalogue.json.
            - Fusionner cette pull request uniquement après validation.

            Aucune capture d'un jeu présent avant l'installation ne doit être remplacée.
